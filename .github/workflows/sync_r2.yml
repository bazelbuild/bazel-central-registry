name: Publish BCR to Cloudflare R2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Last validated registry commit to compare against
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: registry-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'wheelos/bazel-central-registry'
    uses: ./.github/workflows/validate-modules.yml
    with:
      base: ${{ inputs.base || github.event.before }}

  deploy:
    needs: validate
    runs-on: ubuntu-22.04
    environment: registry-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish add-only objects and verify remote contents
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
          VALIDATED_VERSIONS: ${{ needs.validate.outputs.versions }}
          BASE_REF: ${{ inputs.base || github.event.before }}
        run: |
          printf '%s\n' "$VALIDATED_VERSIONS" > "$RUNNER_TEMP/registry-validated-versions.json"
          python3 tools/publish_registry.py \
            --bucket wheelos-bazel-registry --endpoint-url "$R2_ENDPOINT" \
            --validated-versions "$RUNNER_TEMP/registry-validated-versions.json" \
            --base "$BASE_REF"
