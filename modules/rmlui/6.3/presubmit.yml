matrix:
  platform:
    - debian13
    - ubuntu2404
    - macos
    - macos_arm64
    - windows
  bazel:
    - 8.x
    - 9.x
    - rolling
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@rmlui//:core"
      - "@rmlui//:debugger"
      - "@rmlui//:rmlui"
      - "@rmlui//:rmlui_shared"
  verify_targets_with_options:
    name: Verify build targets with non-default options
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--@rmlui//:font_engine=none"
      - "--@rmlui//:matrix_row_major=True"
      - "--@rmlui//:thirdparty_containers=False"
    build_targets:
      - "@rmlui//:rmlui"
      - "@rmlui//:rmlui_shared"

# The test module renders a document with a headless render interface, linking RmlUi statically
# and as a shared library.
bcr_test_module:
  module_path: tests
  matrix:
    platform:
      - debian13
      - ubuntu2404
      - macos
      - macos_arm64
      - windows
    bazel:
      - 8.x
      - 9.x
      - rolling
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - //...
      test_targets:
        - //...
    run_test_module_with_svg_plugin:
      name: Run test module with the SVG plugin
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_flags:
        - "--@rmlui//:svg_plugin=True"
      test_flags:
        - "--@rmlui//:svg_plugin=True"
      build_targets:
        - //...
      test_targets:
        - //...
