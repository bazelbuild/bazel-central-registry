matrix:
  platform:
    - debian13
    - macos
    - macos_arm64
    - ubuntu2404
    - ubuntu2404_arm64
    - windows
  bazel:
    - rolling
    - 9.x
    - 8.x
    - 7.x
    # The floor 7.x floats past: rules_cc_autoconf needs attr.string_keyed_label_dict (7.4.0).
    - 7.4.0
tasks:
  verify_targets:
    name: Build and test
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@tre//:tre"
      - "@tre//:posix"
      - "@tre//tests:retest"
      - "@tre//tests:test_str_source"
    test_targets:
      - "@tre//tests:retest"
      - "@tre//tests:test_str_source"
  # Every flag false, one job: all four default to true, so nothing else in this file
  # evaluates the other arm of any select() the module declares.
  flags_off:
    name: "Build/test with every flag false"
    platform: ubuntu2404
    bazel: 9.x
    build_flags: &flags_off
      - "--@tre//:approx=false"
      - "--@tre//:wchar=false"
      - "--@tre//:multibyte=false"
      - "--@tre//:alloca=false"
    test_flags: *flags_off
    build_targets:
      - "@tre//:tre"
      - "@tre//:posix"
      - "@tre//tests:retest"
      - "@tre//tests:test_str_source"
    test_targets:
      - "@tre//tests:retest"
      - "@tre//tests:test_str_source"
bcr_test_module:
  module_path: test
  matrix:
    platform:
      - debian13
      - macos
      - macos_arm64
      - ubuntu2404
      - ubuntu2404_arm64
      - windows
    bazel:
      - rolling
      - 9.x
      - 8.x
      - 7.x
      - 7.4.0
  tasks:
    run_tests:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
