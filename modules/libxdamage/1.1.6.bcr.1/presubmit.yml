matrix:
  platform: [debian13, ubuntu2404]
  bazel: [7.x, 8.x, 9.x]
tasks:
  verify_targets:
    name: Build public library
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags: ["--cxxopt=-std=c++17"]
    build_targets: ["@libxdamage//:libxdamage"]
bcr_test_module:
  module_path: bazel_test
  matrix:
    platform: [debian13, ubuntu2404]
    bazel: [7.x, 8.x, 9.x]
  tasks:
    run_tests:
      name: Test external consumer
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_flags: ["--cxxopt=-std=c++17"]
      test_targets: ["//:all"]
