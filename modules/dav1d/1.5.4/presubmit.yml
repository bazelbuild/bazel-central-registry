matrix:
  platform:
    - ubuntu2404
    - ubuntu2404_arm64
    - macos_arm64
  bazel:
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Build 8- and 16-bit AV1 decoder and run original API header tests
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@dav1d//:dav1d'
    test_targets:
      - '@dav1d//:common_h_header_test'
      - '@dav1d//:data_h_header_test'
      - '@dav1d//:dav1d_h_header_test'
      - '@dav1d//:headers_h_header_test'
      - '@dav1d//:picture_h_header_test'
      - '@dav1d//:version_h_header_test'
      - '@dav1d//:decoder_test'
