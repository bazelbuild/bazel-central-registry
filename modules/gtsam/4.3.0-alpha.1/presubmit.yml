matrix:
  platform:
    - debian10
    - debian11
    - macos
    - macos_arm64
    - ubuntu2204
    - ubuntu2404
    - ubuntu2404_arm64
    # - windows
  bazel:
    - 7.x
    - 8.x
    - 9.x
    - rolling
tasks:
  test:
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - '--cxxopt=-std=c++17'
      - '--host_cxxopt=-std=c++17'
    build_targets:
      - '@gtsam//:gtsam'
      - '@gtsam//:gtsam_unstable'
    test_targets:
      - '@gtsam//...'
