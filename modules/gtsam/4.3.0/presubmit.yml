matrix:
  platform:
    - debian11
    - macos
    - macos_arm64
    - ubuntu2204
    - ubuntu2204_arm64
    - ubuntu2404
    # - windows
  bazel:
    - 7.x
    - 8.x
    - 9.x
    - rolling
tasks:
  test:
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - '--cxxopt=-std=c++17'
      - '--host_cxxopt=-std=c++17'
    test_flags:
      - '--cxxopt=-std=c++17'
      - '--host_cxxopt=-std=c++17'
    build_targets:
      - '@gtsam//:gtsam'
      - '@gtsam//:gtsam_unstable'
    test_targets:
      - '@gtsam//...'
  test_without_boost:
    name: Test without Boost
    platform: ubuntu2404
    bazel: ${{ bazel }}
    build_flags:
      - '--cxxopt=-std=c++17'
      - '--host_cxxopt=-std=c++17'
      - '--@gtsam//:use_boost=False'
    test_flags:
      - '--cxxopt=-std=c++17'
      - '--host_cxxopt=-std=c++17'
      - '--@gtsam//:use_boost=False'
    build_targets:
      - '@gtsam//:gtsam'
      - '@gtsam//:gtsam_unstable'
    test_targets:
      - '@gtsam//...'
