matrix:
  platform:
    - debian11
    - ubuntu2004
    - ubuntu2204
    - ubuntu2404
    - macos_arm64
    - windows
  unix_platform:
    - debian11
    - ubuntu2004
    - ubuntu2204
    - ubuntu2404
    - macos_arm64
  bazel:
    - 7.x
    - 8.x
    - 9.x
    - rolling

tasks:
  # boringssl (the default SSL backend) requires C++17
  verify_targets_unix:
    name: Verify build targets (unix)
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--cxxopt=-std=c++17"
    build_targets:
      - "@curl//..."
    test_targets:
      - "@curl//..."

  verify_targets_windows:
    name: Verify build targets (windows)
    platform: windows
    bazel: ${{ bazel }}
    build_flags:
      - "--cxxopt=/std:c++17"
    build_targets:
      - "@curl//..."
    test_targets:
      - "@curl//..."

  verify_targets_with_boringssl_unix:
    name: Verify build targets with boringssl (unix)
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@curl//..."
    build_flags:
      - "--@curl//:ssl_lib=boringssl"
      - "--cxxopt=-std=c++17"
    test_targets:
      - "@curl//..."

  verify_targets_with_boringssl_windows:
    name: Verify build targets with boringssl (windows)
    platform: windows
    bazel: ${{ bazel }}
    build_targets:
      - "@curl//..."
    build_flags:
      - "--@curl//:ssl_lib=boringssl"
      - "--cxxopt=/std:c++17"
    test_targets:
      - "@curl//..."

  verify_targets_with_mbedtls:
    name: Verify build targets with mbedtls
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@curl//..."
    build_flags:
      - "--@curl//:ssl_lib=mbedtls"
    test_targets:
      - "@curl//..."

  verify_targets_with_openssl:
    name: Verify build targets with openssl
    # The OpenSSL on BCR does not support Windows.
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@curl//..."
    build_flags:
      - "--@curl//:ssl_lib=openssl"
    test_targets:
      - "@curl//..."

  verify_targets_http_only_disabled_unix:
    name: Verify build targets with HTTP only disabled (unix)
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@curl//..."
    build_flags:
      - "--@curl//:http_only=false"
      - "--cxxopt=-std=c++17"
    test_targets:
      - "@curl//..."

  verify_targets_http_only_disabled_windows:
    name: Verify build targets with HTTP only disabled (windows)
    platform: windows
    bazel: ${{ bazel }}
    build_targets:
      - "@curl//..."
    build_flags:
      - "--@curl//:http_only=false"
      - "--cxxopt=/std:c++17"
    test_targets:
      - "@curl//..."
