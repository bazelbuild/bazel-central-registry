matrix:
  platform:
    - debian12
    - debian13
    - ubuntu2204
    - ubuntu2404
    - macos_arm64
    - windows
  unix_platform:
    - debian12
    - debian13
    - ubuntu2204
    - ubuntu2404
    - macos_arm64
  bazel:
    - 7.x
    - 8.x
    - 9.x
    - rolling
  # Hermetic LLVM: amd64 and arm64 on each OS.
  hermetic_llvm_unix_platform:
    - ubuntu2404
    - ubuntu2404_arm64
    - macos
    - macos_arm64
  hermetic_llvm_windows_platform:
    - windows
    - windows_arm64
  # The hermetic LLVM toolchain only works for Bazel 8.x onwards.
  hermetic_llvm_bazel:
    - 8.x
    - 9.x
    - rolling

tasks:
  # boringssl (the default SSL backend) requires C++17
  verify_targets_unix:
    name: Verify build targets (unix)
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--cxxopt=-std=c++17"
    build_targets:
      - "@curl//..."
    test_flags:
      - "--cxxopt=-std=c++17"
    test_targets:
      - "@curl//..."

  verify_targets_windows:
    name: Verify build targets (windows)
    platform: windows
    bazel: ${{ bazel }}
    build_flags:
      - "--cxxopt=/std:c++17"
    build_targets:
      - "@curl//..."
    test_flags:
      - "--cxxopt=/std:c++17"
    test_targets:
      - "@curl//..."

  verify_targets_with_http2_unix:
    name: Verify build targets with HTTP/2 and boringssl (unix)
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@curl//..."
    build_flags:
      - "--@curl//:http2=true"
      - "--@curl//:ssl_lib=boringssl"
      - "--cxxopt=-std=c++17"
    test_flags:
      - "--@curl//:http2=true"
      - "--@curl//:ssl_lib=boringssl"
      - "--cxxopt=-std=c++17"
    test_targets:
      - "@curl//..."

  verify_targets_with_http2_windows:
    name: Verify build targets with HTTP/2 and boringssl (windows)
    platform: windows
    bazel: ${{ bazel }}
    build_targets:
      - "@curl//..."
    build_flags:
      - "--@curl//:http2=true"
      - "--@curl//:ssl_lib=boringssl"
      - "--cxxopt=/std:c++17"
    test_flags:
      - "--@curl//:http2=true"
      - "--@curl//:ssl_lib=boringssl"
      - "--cxxopt=/std:c++17"
    test_targets:
      - "@curl//..."

  verify_targets_with_mbedtls:
    name: Verify build targets with mbedtls
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@curl//..."
    build_flags:
      - "--@curl//:ssl_lib=mbedtls"
    test_flags:
      - "--@curl//:ssl_lib=mbedtls"
    test_targets:
      - "@curl//..."

  verify_targets_with_openssl:
    name: Verify build targets with openssl
    # The OpenSSL on BCR does not support Windows.
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@curl//..."
    build_flags:
      - "--@curl//:ssl_lib=openssl"
    test_flags:
      - "--@curl//:ssl_lib=openssl"
    test_targets:
      - "@curl//..."

  # Check building and testing works against a hermetic C++ toolchain.
  verify_targets_hermetic_llvm_unix:
    name: Verify build targets (hermetic llvm, unix)
    platform: ${{ hermetic_llvm_unix_platform }}
    bazel: ${{ hermetic_llvm_bazel }}
    setup:
      - echo 'bazel_dep(name = "llvm", version = "0.8.27")' >> MODULE.bazel
    build_flags: &hermetic_llvm_unix_flags
      - "--repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1"
      - "--repo_env=BAZEL_NO_APPLE_CPP_TOOLCHAIN=1"
      - "--extra_toolchains=@llvm//toolchain:all"
      - "--cxxopt=-std=c++17"
    test_flags: *hermetic_llvm_unix_flags
    build_targets:
      - "@curl//..."
    test_targets:
      - "@curl//..."

  # On Windows the hermetic toolchain is MinGW. Setup runs under cmd.exe, which
  # does not strip single quotes, hence the unquoted echo. boringssl uses
  # pthreads under MinGW without linking winpthreads, so use mbedtls here.
  verify_targets_hermetic_llvm_windows:
    name: Verify build targets (hermetic llvm, windows)
    platform: ${{ hermetic_llvm_windows_platform }}
    bazel: ${{ hermetic_llvm_bazel }}
    setup:
      - echo bazel_dep(name = "llvm", version = "0.8.27")>> MODULE.bazel
    build_flags: &hermetic_llvm_windows_flags
      - "--repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1"
      - "--extra_toolchains=@llvm//toolchain:all"
      - "--@curl//:ssl_lib=mbedtls"
    test_flags: *hermetic_llvm_windows_flags
    build_targets:
      - "@curl//..."
    test_targets:
      - "@curl//..."
