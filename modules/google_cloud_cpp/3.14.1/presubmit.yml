matrix:
  platform: ["debian13", "macos"]
  bazel: ["8.x", "9.x"]
tasks:
  verify_targets:
    name: "Verify build targets"
    bazel: ${{ bazel }}
    platform: ${{ platform }}
    build_flags:
      - "--cxxopt=-std=c++17"
      - "--host_cxxopt=-std=c++17"
    build_targets:
      - "@google_cloud_cpp//:common"
      - "@google_cloud_cpp//:grpc_utils"
      - "@google_cloud_cpp//:storage"
      - "@google_cloud_cpp//:storage_grpc"
    test_flags:
      - "--cxxopt=-std=c++17"
      - "--host_cxxopt=-std=c++17"
    test_targets:
      - "@google_cloud_cpp//google/cloud:status_test"
  verify_targets_windows:
    name: "Verify build targets on Windows"
    bazel: ${{ bazel }}
    platform: "windows"
    build_flags:
      - "--cxxopt=/std:c++17"
      - "--host_cxxopt=/std:c++17"
      - "--define=protobuf_allow_msvc=true"
    build_targets:
      - "@google_cloud_cpp//:common"
      - "@google_cloud_cpp//:grpc_utils"
      - "@google_cloud_cpp//:storage"
      - "@google_cloud_cpp//:storage_grpc"
    test_flags:
      - "--cxxopt=/std:c++17"
      - "--host_cxxopt=/std:c++17"
      - "--define=protobuf_allow_msvc=true"
    test_targets:
      - "@google_cloud_cpp//google/cloud:status_test"
