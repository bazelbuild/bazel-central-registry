matrix:
  platform: ["debian13", "macos_arm64"]
  bazel: ["8.x", "9.x"]
tasks:
  verify_targets:
    name: "Verify build targets"
    bazel: ${{ bazel }}
    platform: ${{ platform }}
    build_flags:
      - "--cxxopt=-std=c++17"
      - "--host_cxxopt=-std=c++17"
    build_targets:
      - "@google_cloud_cpp//:common"
      - "@google_cloud_cpp//:grpc_utils"
      - "@google_cloud_cpp//:storage"
      - "@google_cloud_cpp//:storage_grpc"
    test_flags:
      - "--cxxopt=-std=c++17"
      - "--host_cxxopt=-std=c++17"
    test_targets:
      - "@google_cloud_cpp//google/cloud:status_test"
  verify_targets_windows_bazel8:
    name: "Verify build targets on Windows"
    bazel: "8.x"
    platform: "windows"
    build_flags:
      - "--cxxopt=/std:c++17"
      - "--host_cxxopt=/std:c++17"
      - "--cxxopt=/Zc:__cplusplus"
      - "--host_cxxopt=/Zc:__cplusplus"
      - "--define=protobuf_allow_msvc=true"
    build_targets:
      - "@google_cloud_cpp//:common"
      - "@google_cloud_cpp//:grpc_utils"
      - "@google_cloud_cpp//:storage"
      - "@google_cloud_cpp//:storage_grpc"
    test_flags:
      - "--cxxopt=/std:c++17"
      - "--host_cxxopt=/std:c++17"
      - "--cxxopt=/Zc:__cplusplus"
      - "--host_cxxopt=/Zc:__cplusplus"
      - "--define=protobuf_allow_msvc=true"
    test_targets:
      - "@google_cloud_cpp//google/cloud:status_test"
  # Exclude gRPC targets on Windows + Bazel 9 until upstream grpc/grpc#43924 is fixed.
  verify_targets_windows_bazel9:
    name: "Verify non-gRPC build targets on Windows"
    bazel: "9.x"
    platform: "windows"
    build_flags:
      - "--cxxopt=/std:c++17"
      - "--host_cxxopt=/std:c++17"
      - "--cxxopt=/Zc:__cplusplus"
      - "--host_cxxopt=/Zc:__cplusplus"
      - "--define=protobuf_allow_msvc=true"
    build_targets:
      - "@google_cloud_cpp//:common"
      - "@google_cloud_cpp//:storage"
    test_flags:
      - "--cxxopt=/std:c++17"
      - "--host_cxxopt=/std:c++17"
      - "--cxxopt=/Zc:__cplusplus"
      - "--host_cxxopt=/Zc:__cplusplus"
      - "--define=protobuf_allow_msvc=true"
    test_targets:
      - "@google_cloud_cpp//google/cloud:status_test"
