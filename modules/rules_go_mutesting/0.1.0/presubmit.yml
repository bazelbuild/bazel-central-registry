matrix:
  # Windows is left out: the mutation engine shells out to diff, which is not
  # present there by default.
  platform: ["debian11", "ubuntu2204", "macos"]
  bazel: ["8.*", "9.*"]
tasks:
  verify_targets:
    name: "Verify build targets"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@rules_go_mutesting//mutesting:tool"
      - "@rules_go_mutesting//mutesting/internal/runner"
      - "@rules_go_mutesting//mutesting/internal/reportcheck"

bcr_test_module:
  module_path: "e2e/bcr_test"
  matrix:
    platform: ["debian11", "ubuntu2204", "macos"]
    bazel: ["8.*", "9.*"]
  tasks:
    run_test_module:
      name: "Mutation testing works for a consuming module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
