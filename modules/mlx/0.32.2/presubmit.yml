matrix:
  platform:
    - ubuntu2204
    - ubuntu2404
    - macos_arm64
  bazel:
    - 8.x
    - 9.x
    - rolling
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@mlx"
bcr_test_module:
  module_path: test
  matrix:
    platform:
      - ubuntu2204
      - ubuntu2404
      - macos_arm64
    bazel:
      - 8.x
      - 9.x
      - rolling
  tasks:
    run_tests:
      name: Run upstream mlx tests
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      # Keep availability checks valid when Xcode's SDK is newer than the host OS.
      test_flags:
        - "--macos_minimum_os=14.0"
      test_targets:
        - "//..."
