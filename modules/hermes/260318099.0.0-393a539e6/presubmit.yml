bcr_test_module:
  module_path: examples/smoke
  matrix:
    platform: [ubuntu2204]
    bazel: [9.3.0]
  tasks:
    smoke:
      name: Hermes JSI consumer
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - "@hermes//:hermesc"
      test_targets:
        - "//:runtime_test"
