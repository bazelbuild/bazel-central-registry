matrix:
  platform:
    - debian13
    - ubuntu2204
    - ubuntu2404
    - macos_arm64
  bazel:
    - rolling
    - 9.x
    - 8.x
    - 7.x
tasks:
  verify_targets:
    name: Verify library target
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--cxxopt=-std=c++17"
    build_targets:
      - "@aliyun-oss-cpp-sdk//:aliyun-oss-cpp-sdk"
