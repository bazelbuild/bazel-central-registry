matrix:
  platform:
  - macos
  - macos_arm64
  bazel:
  - 8.x
  - 9.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@cucumberswift_expressions//:CucumberSwiftExpressions'
bcr_test_module:
  module_path: Tests
  matrix:
    platform:
    - macos
    - macos_arm64
    bazel:
    - 8.x
    - 9.x
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      # swift_test builds and runs helper tools on the agent; without these they target the
      # Xcode SDK's macOS version and cannot run on an older macOS. Its helpers need macOS 13.
      test_flags:
      - --host_macos_minimum_os=13.0
      - --macos_minimum_os=13.0
      test_targets:
      - //:CucumberSwiftExpressionsSwiftTest
