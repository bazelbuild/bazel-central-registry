matrix: &matrix
  bazel: ["8.x", "9.x"]
  platform: ["debian11", "ubuntu2204", "windows", "macos", "macos_arm64"]

# Builds an anonymous module that only `bazel_dep`s on rules_nsis, so no dev
# dependencies are present.
tasks:
  verify_targets:
    name: "Verify build targets"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@rules_nsis//nsis:defs"

# The archive has no tests/MODULE.bazel, so `tests` would resolve to the parent
# rules_nsis module with its dev dependencies. `tests/usagetests` is a real
# module that consumes rules_nsis like a downstream user and builds an
# installer. //tests needs dev-only dependencies and runs in this repo's CI.
bcr_test_module:
  module_path: "tests/usagetests"
  matrix: *matrix
  tasks:
    run_test_module:
      name: "Build test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - "//..."
