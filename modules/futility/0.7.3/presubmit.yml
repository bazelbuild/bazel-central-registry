#
# The integration test module runs on Bazel 8 and 9 alike, so both are
# tested. The CI workflow in .github/workflows/test.yml runs the same matrix.
#
# Windows is left out. futility builds there, but the integration test is a
# bash script (integration/serial_upload_runs.sh).
bcr_test_module:
  module_path: "integration"
  matrix:
    platform: ["debian13", "ubuntu2204", "ubuntu2404", "macos", "macos_arm64"]
    bazel: [8.x, 9.x]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
