matrix:
  platform:
    - ubuntu2404
    - ubuntu2404_arm64
    - macos_arm64
  bazel:
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Build GSM and run upstream arithmetic vectors
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@gsm//:gsm'
    test_targets:
      - '@gsm//:add_test'
