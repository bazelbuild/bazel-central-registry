matrix:
  platform:
    - ubuntu2404
    - ubuntu2404_arm64
    - macos_arm64
  bazel:
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Build Codec2 codebooks and run upstream modem unit tests
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@codec2//:codec2'
    test_targets:
      - '@codec2//:data_channel_test'
      - '@codec2//:qam16_test'
