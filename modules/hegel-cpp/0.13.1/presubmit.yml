matrix:
  # libhegel ships prebuilt engine libraries for linux-amd64, linux-arm64,
  # and darwin-arm64 only (see libhegel/libhegel.bzl).
  platform:
  - ubuntu2404
  - ubuntu2404_arm64
  - macos_arm64
  bazel:
  - 9.x
  - 8.x
  - 7.x

tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    # The library requires C++20 (reflect-cpp), matching the CMake build.
    - '--cxxopt=-std=c++20'
    - '--host_cxxopt=-std=c++20'
    build_targets:
    - '@hegel-cpp//...'
  verify_targets_no_throw_site:
    name: Verify build targets (throw site disabled)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--cxxopt=-std=c++20'
    - '--host_cxxopt=-std=c++20'
    # The HEGEL_THROW_SITE=OFF equivalent for toolchains that link the
    # C++ runtime statically.
    - '--@hegel-cpp//:throw_site=false'
    build_targets:
    - '@hegel-cpp//...'
