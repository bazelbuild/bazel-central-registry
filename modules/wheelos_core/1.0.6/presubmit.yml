matrix:
  platform: [ubuntu2204]
  bazel: ["7.6.1", "8.8.1"]
tasks:
  verify_targets:
    name: Verify Cyber runtime and command-line tools
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - --cxxopt=-std=c++17
    - --host_cxxopt=-std=c++17
    - --jobs=2
    build_targets:
    - "@wheelos_core//tools:mainboard"
    - "@wheelos_core//tools:cyber_node"
