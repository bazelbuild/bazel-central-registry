matrix:
  platform: [ubuntu2204]
  bazel: [7.x, 8.x]

tasks:
  verify_targets:
    name: Verify Linux runtime targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - --cxxopt=-std=c++17
    - --host_cxxopt=-std=c++17
    build_targets:
    - '@wheelos_core//tools:mainboard'
    - '@wheelos_core//tools:cyber_node'
