bcr_test_module:
  module_path: tests
  matrix:
    platform:
    - ubuntu2404
    - macos
    - macos_arm64
    bazel:
    - 8.x
    - 9.x
    xspice:
    - 'true'
    - 'false'
    openmp:
    - 'true'
    - 'false'
  tasks:
    default_features:
      name: Test API and CLI with XSPICE and OpenMP
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
      - //:all
    feature_combinations:
      name: Test XSPICE=${{ xspice }}, OpenMP=${{ openmp }}
      platform: ubuntu2404
      bazel: 9.x
      environment:
        CC: gcc
        CXX: g++
      test_flags:
      - --@ngspice//:xspice=${{ xspice }}
      - --@ngspice//:openmp=${{ openmp }}
      test_targets:
      - //:all
      - //gcc_openmp:consumer
    linux_clang:
      name: Test Linux Clang with XSPICE and OpenMP
      platform: ubuntu2404
      bazel: 9.x
      environment:
        CC: clang
        CXX: clang++
      test_flags:
      - --@ngspice//:xspice=true
      - --@ngspice//:openmp=true
      test_targets:
      - //:all
      - //clang_openmp:consumer
    macos_clang:
      name: Test OpenMP coexistence on macOS
      platform: macos_arm64
      bazel: 9.x
      test_targets:
      - //clang_openmp:consumer
    hermetic_llvm_linux:
      name: Test Linux with hermetic LLVM
      platform: ubuntu2404
      bazel: ${{ bazel }}
      setup:
      - cat hermetic_llvm.MODULE.bazel >> MODULE.bazel
      test_flags:
      - --extra_toolchains=@llvm//toolchain:all
      - --platforms=@llvm//platforms:linux_x86_64_gnu.2.28
      - --host_platform=@llvm//platforms:linux_x86_64_gnu.2.28
      - --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1
      - --repo_env=BAZEL_NO_APPLE_CPP_TOOLCHAIN=1
      - --incompatible_strict_action_env
      - --action_env=PATH=/usr/bin:/bin
      - --action_env=LANG=C
      - --action_env=LC_ALL=C
      - --action_env=TZ=UTC
      - --test_env=PATH=/usr/bin:/bin
      - --test_env=LANG=C
      - --test_env=LC_ALL=C
      - --test_env=TZ=UTC
      - --spawn_strategy=linux-sandbox
      - --nosandbox_default_allow_network
      test_targets:
      - //:all
      - //clang_openmp:consumer
    hermetic_llvm_macos:
      name: Test macOS with hermetic LLVM
      platform: macos_arm64
      bazel: ${{ bazel }}
      setup:
      - cat hermetic_llvm.MODULE.bazel >> MODULE.bazel
      test_flags:
      - --extra_toolchains=@llvm//toolchain:all
      - --platforms=@llvm//platforms:macos_aarch64
      - --host_platform=@llvm//platforms:macos_aarch64
      - --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1
      - --repo_env=BAZEL_NO_APPLE_CPP_TOOLCHAIN=1
      - --repo_env=BAZEL_MACOS_USE_HOST_SDK=0
      - --incompatible_strict_action_env
      - --action_env=PATH=/usr/bin:/bin
      - --action_env=LANG=C
      - --action_env=LC_ALL=C
      - --action_env=TZ=UTC
      - --test_env=PATH=/usr/bin:/bin
      - --test_env=LANG=C
      - --test_env=LC_ALL=C
      - --test_env=TZ=UTC
      - --spawn_strategy=darwin-sandbox
      - --nosandbox_default_allow_network
      test_targets:
      - //:all
      - //clang_openmp:consumer
