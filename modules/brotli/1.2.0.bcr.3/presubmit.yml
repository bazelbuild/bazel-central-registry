matrix:
  platform:
  - debian10
  - ubuntu2004
  - macos
  - macos_arm64
  bazel:
  - 7.x
  - 8.x
  - 9.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@brotli//:brotli'
      - '@brotli//:brotlicommon'
      - '@brotli//:brotlidec'
      - '@brotli//:brotlienc'
    build_flags:
      - "--cxxopt=-std=c++17"
    test_targets:
      - '@brotli//tests:rotate_right16_test'
    test_flags:
      - "--cxxopt=-std=c++17"
  verify_targets_arm64:
    name: Verify ARM64 build targets
    platform: ubuntu2404_arm64
    bazel: ${{ bazel }}
    build_flags:
      - "--cxxopt=-std=c++17"
    build_targets:
      - '@brotli//:brotli'
      - '@brotli//:brotlicommon'
      - '@brotli//:brotlidec'
      - '@brotli//:brotlienc'
    test_targets:
      - '@brotli//tests:rotate_right16_test'
    test_flags:
      - "--cxxopt=-std=c++17"
  verify_targets_windows:
    name: Verify build targets
    platform: windows
    bazel: ${{ bazel }}
    build_flags:
      - "--cxxopt=/std:c++17"
      - "--cxxopt=/D_WIN32_WINNT=0x0602"
      - "--cxxopt=/DWINVER=0x0602"
      - "--host_cxxopt=/std:c++17"
    build_targets:
      - '@brotli//:brotli'
      - '@brotli//:brotlicommon'
      - '@brotli//:brotlidec'
      - '@brotli//:brotlienc'
    test_targets:
      - '@brotli//tests:rotate_right16_test'
    test_flags:
      - "--cxxopt=/std:c++17"
      - "--cxxopt=/D_WIN32_WINNT=0x0602"
      - "--cxxopt=/DWINVER=0x0602"
      - "--host_cxxopt=/std:c++17"
