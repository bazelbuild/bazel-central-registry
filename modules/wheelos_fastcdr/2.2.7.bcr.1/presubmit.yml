matrix:
  platform:
  - ubuntu2204
  - macos
  - macos_arm64
  - windows
  bazel: [7.x, 8.x]

tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@wheelos_fastcdr//:fastcdr'

bcr_test_module:
  module_path: test_module
  matrix:
    platform: [ubuntu2204]
    bazel: [7.x, 8.x]
  tasks:
    binary_strings:
      name: Verify binary string serialization
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
      - //:binary_string_test
