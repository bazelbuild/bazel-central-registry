bcr_test_module:
  module_path: "e2e"
  matrix:
    bazel: ["8.6.0", "9.0.0"]
    # TODO(#9): add windows to this list
    platform: ["debian10", "macos", "ubuntu2004"]
  tasks:
    run_tests:
      name: "Run test module"
      bazel: ${{ bazel }}
      platform: ${{ platform }}
      test_flags:
        - "--test_tag_filters=-requires-docker"
      test_targets:
        - "//..."
        # Needs a cc toolchain, which the release archive does not register
        # (llvm toolchains are dev-only when IS_RELEASE = True).
        - "-//cases/uv-sdist-native-inputs/..."
