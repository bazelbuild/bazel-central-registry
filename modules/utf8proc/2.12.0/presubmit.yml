matrix:
  platform:
  - ubuntu2404
  - ubuntu2404_arm64
  - macos
  - macos_arm64
  - windows
  bazel:
  - 8.x
  - 9.x
  - rolling
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@utf8proc//:utf8proc'
bcr_test_module:
  module_path: ""
  matrix:
    platform:
    - ubuntu2404
    - ubuntu2404_arm64
    - macos
    - macos_arm64
    - windows
    bazel:
    - 8.x
    - 9.x
    - rolling
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
      - '@utf8proc//...'
