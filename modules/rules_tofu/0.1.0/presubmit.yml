# BCR presubmit: validate each published version against a real downstream
# module (e2e/smoke) consuming rules_tofu via bazel_dep.
#
# Linux + macOS only — Windows host support is a known gap (the runtime
# launcher is bash-only; see README "TODOs / known gaps").
#
# TODO: Bazel is pinned to 9.x (the version this repo targets). Add "8.x" once
# it is verified to pass; a brand-new module's first submission should keep
# the matrix to known-good combinations to avoid a red presubmit.
bcr_test_module:
  module_path: "e2e/smoke"
  matrix:
    platform: ["debian11", "ubuntu2204", "macos"]
    bazel: ["9.x"]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - "//..."
      test_targets:
        - "//..."
