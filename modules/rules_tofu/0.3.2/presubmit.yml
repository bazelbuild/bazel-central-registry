# BCR presubmit: validate each published version against a real downstream
# module (e2e/smoke) consuming rules_tofu via bazel_dep.
#
# Linux + macOS only — Windows host support is a known gap (the runtime
# launcher is bash-only; see README "Known gaps").
#
# Bazel 8.5.0 is the oldest supported version (bazel_compatibility in
# MODULE.bazel; it is the first with extension facts). Repo CI tests that floor
# on Linux and macOS; this matrix covers the latest 8.x and 9.x.
bcr_test_module:
  module_path: "e2e/smoke"
  matrix:
    platform: ["debian11", "ubuntu2204", "macos"]
    bazel: ["8.x", "9.x"]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - "//..."
      test_targets:
        - "//..."
