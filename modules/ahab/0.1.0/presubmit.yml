matrix:
  platform: ["ubuntu2204", "macos_arm64"]
  bazel: ["8.x", "9.x"]
tasks:
  verify_targets:
    name: "Verify build targets"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@ahab//:ahab"
bcr_test_module:
  module_path: "packaging"
  matrix:
    platform: ["ubuntu2204", "macos_arm64"]
    bazel: ["8.x", "9.x"]
  tasks:
    run_test_module:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - "//:ahab.report"
        - "//:ahab.check"
        - "//:ahab.update"
        - "//:ahab.explain"
