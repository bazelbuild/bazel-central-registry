matrix:
  platform: [ubuntu2404, ubuntu2404_arm64]
  bazel: [8.x, 9.x]
tasks:
  verify_targets:
    name: Build Linux targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@openvpn//:openvpn'
      - '@openvpn//:openvpn-plugin-auth-pam.so'
      - '@openvpn//:openvpn-plugin-down-root.so'
