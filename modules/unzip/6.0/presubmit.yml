matrix:
  platform:
    - debian13
    - ubuntu2204
    - ubuntu2204_arm64
    - ubuntu2404
    - macos
    - macos_arm64
    - windows
  bazel:
    - 7.x
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Verify build targets and tests
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@unzip//..."
    test_targets:
      - "@unzip//..."
