matrix:
  platform:
    - debian13
    - ubuntu2404
    - macos
    - macos_arm64
    - windows
  bazel:
    - 8.x
    - 9.x
    - rolling
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@spz//:spz"
      - "@spz//:ply_to_spz"
      - "@spz//:spz_info"
      - "@spz//:spz_to_ply"
  verify_targets_with_extensions:
    name: Verify build targets with extensions
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--@spz//:extensions=True"
    build_targets:
      - "@spz//:spz"
      - "@spz//:ply_to_spz"
      - "@spz//:spz_info"
      - "@spz//:spz_to_ply"

# The test module round-trips a Gaussian cloud through SPZ and PLY, with and without extensions.
bcr_test_module:
  module_path: tests
  matrix:
    platform:
      - debian13
      - ubuntu2404
      - macos
      - macos_arm64
      - windows
    bazel:
      - 8.x
      - 9.x
      - rolling
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - //...
      test_targets:
        - //...
    run_test_module_with_extensions:
      name: Run test module with extensions
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_flags:
        - "--@spz//:extensions=True"
      test_flags:
        - "--@spz//:extensions=True"
      build_targets:
        - //...
      test_targets:
        - //...
