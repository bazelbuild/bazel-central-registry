matrix:
  platform:
  - ubuntu2404
  - macos_arm64
  bazel:
  # Bazel 9.x is omitted because dependencies on this LTS branch (e.g.,
  # dartsim@6.13.2.bcr.2, gz-utils@3.1.1) use native cc_* rules removed in Bazel 9.
  - 8.x
  - 7.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--cxxopt=-std=c++17'
    - '--host_cxxopt=-std=c++17'
    build_targets:
    - '@gz-physics'
    - '@gz-physics//:heightmap'
    - '@gz-physics//:mesh'
    - '@gz-physics//:sdf'
    - '@gz-physics//dartsim'
    - '@gz-physics//dartsim:libgz-physics-dartsim-plugin.so'
    - '@gz-physics//bullet'
    - '@gz-physics//bullet:libgz-physics-bullet-plugin.so'
    - '@gz-physics//bullet-featherstone'
    - '@gz-physics//bullet-featherstone:libgz-physics-bullet-featherstone-plugin.so'
    - '@gz-physics//tpe'
    - '@gz-physics//tpe:libgz-physics-tpe-plugin.so'
    - '@gz-physics//tpe:tpelib'
