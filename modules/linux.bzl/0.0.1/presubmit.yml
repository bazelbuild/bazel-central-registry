bcr_test_module:
  module_path: examples
  matrix:
    platform: [ubuntu2404]
    bazel: [8.x, 9.x]
  tasks:
    smoke_test:
      name: Build initramfs and x86_64 kernel
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - //:example_initramfs
        - //:x86_64_kernel
