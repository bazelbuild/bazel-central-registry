bcr_test_module:
  module_path: "examples/simple"
  matrix:
    platform:
      - "ubuntu2004"
    bazel: [7.x, 8.x, 9.x]
  tasks:
    run_tests:
      name: "Build example module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_flags:
        # BCR runners don't ship Riviera — we exercise analysis (toolchain
        # resolution, attr validation, rule impl, macro expansion) without
        # actually invoking the binary.
        - "--nobuild"
      build_targets:
        - "//..."
