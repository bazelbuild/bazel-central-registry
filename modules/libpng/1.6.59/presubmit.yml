matrix:
  platform:
    - debian13
    - ubuntu2404
    - macos
    - macos_arm64
    - windows
  bazel: [8.x, 9.x, rolling]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@libpng//:libpng'
  verify_targets_withpnglibconf_options_minus_read_exif:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@libpng//:libpng'
    build_flags:
      - "--@libpng//:pnglibconf_options=-PNG_READ_eXIf_SUPPORTED"
