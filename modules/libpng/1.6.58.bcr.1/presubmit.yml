matrix:
  platform:
    - rockylinux8
    - debian10
    - debian11
    - macos
    - macos_arm64
    - ubuntu2004
    - ubuntu2204
    - ubuntu2404
    - windows
  bazel: [7.x, 8.x, 9.*]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@libpng//:libpng'
  verify_targets_withpnglibconf_options_minus_read_exif:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@libpng//:libpng'
    build_flags:
      - "@libpng//:pnglibconf_options=-PNG_READ_eXIf_SUPPORTED"
