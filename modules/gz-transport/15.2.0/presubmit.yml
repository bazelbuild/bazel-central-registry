matrix:
  platform:
  - ubuntu2404
  - macos_arm64
  bazel:
  - 9.x
  - 8.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    # Register the Rust toolchain (register_toolchains is dev_dependency = True
    # in MODULE.bazel) and expose @rules_rust for the macOS SDKROOT flag below
    # (no-op on Linux). Keep the rules_rs version in sync with MODULE.bazel.
    setup:
    - echo 'bazel_dep(name = "rules_rs", version = "0.0.109")' >> MODULE.bazel
    - echo 'toolchains = use_extension("@rules_rs//rs/toolchains:module_extension.bzl", "toolchains")' >> MODULE.bazel
    - echo 'toolchains.toolchain(edition = "2021", version = "1.93.0")' >> MODULE.bazel
    - echo 'use_repo(toolchains, "default_rust_toolchains")' >> MODULE.bazel
    - echo 'rules_rust = use_extension("@rules_rs//rs:rules_rust.bzl", "rules_rust")' >> MODULE.bazel
    - echo 'use_repo(rules_rust, "rules_rust")' >> MODULE.bazel
    build_flags:
    - '--cxxopt=-std=c++17'
    - '--host_cxxopt=-std=c++17'
    - '--extra_toolchains=@default_rust_toolchains//...'
    - '--@rules_rust//rust/settings:use_hermetic_macos_sdkroot=false'
    build_targets:
    - '@gz-transport'
    - '@gz-transport//:topic'
    - '@gz-transport//:service'
    - '@gz-transport//log'
    - '@gz-transport//parameters'
