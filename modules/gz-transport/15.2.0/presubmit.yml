matrix:
  linux_platform:
  - ubuntu2404
  macos_platform:
  - macos_arm64
  bazel:
  - 9.x
  - 8.x
tasks:
  verify_targets_linux:
    name: Verify build targets (Linux)
    platform: ${{ linux_platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--cxxopt=-std=c++17'
    - '--host_cxxopt=-std=c++17'
    build_targets: &build_targets
    - '@gz-transport'
    - '@gz-transport//:topic'
    - '@gz-transport//:service'
    - '@gz-transport//log'
    - '@gz-transport//parameters'
  verify_targets_macos:
    name: Verify build targets (macOS)
    platform: ${{ macos_platform }}
    bazel: ${{ bazel }}
    setup:
    - echo 'bazel_dep(name = "rules_rs", version = "0.0.109")' >> MODULE.bazel
    - echo 'rules_rust = use_extension("@rules_rs//rs:rules_rust.bzl", "rules_rust")' >> MODULE.bazel
    - echo 'use_repo(rules_rust, "rules_rust")' >> MODULE.bazel
    build_flags:
    - '--cxxopt=-std=c++17'
    - '--host_cxxopt=-std=c++17'
    - '--@rules_rust//rust/settings:use_hermetic_macos_sdkroot=false'
    build_targets: *build_targets
