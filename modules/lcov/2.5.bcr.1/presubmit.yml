bcr_test_module:
  module_path: "tests"
  matrix:
    platform: ["ubuntu2004", "ubuntu2004_arm64", "macos_arm64", "windows"]
    bazel: ["7.x", "8.x", "9.x"]
    xs: ["--@rules_perl//perl/settings:xs=false", "--@rules_perl//perl/settings:xs=true"]
  tasks:
    verify_targets:
      name: "Build and test (${{ xs }})"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_flags:
        - "${{ xs }}"
      test_flags:
        - "${{ xs }}"
      build_targets:
        - "@lcov//..."
        - "//..."
      test_targets:
        - "@lcov//..."
        - "//..."
