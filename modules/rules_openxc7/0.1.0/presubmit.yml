# The registry presubmit builds the module named by `module_path` against the
# release being published. That directory exists in this repository and is
# runnable locally with `cd integration && bazel test //...`.
#
# The matrix names 9.x only, which is what `.bazelversion` pins. Claiming a
# version the module is not built against would make the presubmit assert
# something untested. The platforms are the Linux x86-64 hosts only: the
# open toolchain's prebuilt binaries exist for linux-x86_64 first, and a
# platform is added here when its binaries are published.
bcr_test_module:
  module_path: "integration"
  matrix:
    platform: ["debian11", "ubuntu2204", "ubuntu2404"]
    bazel: [9.x]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
