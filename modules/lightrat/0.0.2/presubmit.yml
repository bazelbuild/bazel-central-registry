matrix:
  unix_platform: ["fedora40", "ubuntu2204", "macos_arm64", "ubuntu2404", "debian13"]
  win_platform: ["windows"]
  bazel: [7.x, 8.x, 9.x, rolling]
  exclude:
  - win_platform: "windows"
    bazel: 7.x # For some reason, the header generation does not work properly on windows and bazel 7.x
tasks:
  unix_test:
    name: "Verify build targets"
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@lightrat//lightrat"
  win_test:
    name: "Verify build targets"
    platform: ${{ win_platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--cxxopt=/std:c++20"
    build_targets:
      - "@lightrat//lightrat"
