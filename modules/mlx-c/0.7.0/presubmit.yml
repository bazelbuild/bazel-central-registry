matrix:
  platform:
    - ubuntu2204
    - ubuntu2404
    - macos_arm64
  bazel:
    - 8.x
    - 9.x
    - rolling
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@mlx-c"
bcr_test_module:
  module_path: test
  matrix:
    platform:
      - ubuntu2204
      - ubuntu2404
      - macos_arm64
    bazel:
      - 8.x
      - 9.x
      - rolling
  tasks:
    run_tests:
      name: Run upstream mlx-c examples
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
