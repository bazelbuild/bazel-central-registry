matrix:
  platform:
    # - ubuntu2204  # std::format requires GCC 13 or newer.
    - ubuntu2404
    - macos_arm64
  bazel:
    - 8.x
    - 9.x
    - rolling
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    # Xcode 26 distributes Metal as an optional component on CI workers.
    shell_commands: &metal_toolchain_setup
      - |
        if [ "$(uname -s)" = Darwin ]; then
          if ! xcrun --no-cache --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --no-cache --sdk macosx metal --version
        fi
    build_targets:
      - "@mlx-c"
bcr_test_module:
  module_path: test
  matrix:
    platform:
      # - ubuntu2204  # std::format requires GCC 13 or newer.
      - ubuntu2404
      - macos_arm64
    bazel:
      - 8.x
      - 9.x
      - rolling
  tasks:
    run_tests:
      name: Run upstream mlx-c examples
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      shell_commands: *metal_toolchain_setup
      # Keep availability checks valid when Xcode's SDK is newer than the host OS.
      test_flags:
        - "--macos_minimum_os=14.0"
      test_targets:
        - "//..."
