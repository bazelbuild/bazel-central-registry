matrix: &matrix
  platform:
    - debian10
    - debian11
    - macos
    - macos_arm64
    - ubuntu2004
    - ubuntu2204
    - ubuntu2004_arm64
    - windows
  bazel: [7.x, 8.x, 9.x, rolling]
  cpu_features:
    - x86_64_baseline
    - x86_64_v3_no_pclmul
    - x86_64_clmul
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--incompatible_disallow_empty_glob"
    build_targets:
      - "@xz//:lzma"
  verify_binaries:
    name: Verify command-line tools
    platform: ubuntu2204
    bazel: ${{ bazel }}
    build_targets:
      - "@xz//:xz"
      - "@xz//:xzdec"
      - "@xz//:lzmadec"
bcr_test_module:
  module_path: ""
  matrix: *matrix
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_flags:
        - "--incompatible_disallow_empty_glob"
        - "--enable_runfiles"
      test_targets:
        - all_tests
    crc_x86_features:
      name: Verify CRC32 and CRC64 with x86 CPU feature constraints
      platform: ubuntu2204
      bazel: ${{ bazel }}
      test_flags:
        - "--platforms=//:${{ cpu_features }}"
        - "--enable_runfiles"
      test_targets:
        - //:test_check
