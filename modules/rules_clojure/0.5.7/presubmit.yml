# Copied verbatim into modules/rules_clojure/<version>/presubmit.yml in the BCR
# by tools/publish_to_bcr.sh. Run by BCR CI on every registry PR for this module.
# See https://github.com/bazelbuild/bazel-central-registry/tree/main/docs#presubmit
matrix:
  platform: ["ubuntu2204", "macos"]
  bazel: ["8.x"]
tasks:
  verify_targets:
    name: "Verify build targets"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@rules_clojure//:rules.bzl"
bcr_test_module:
  module_path: "examples/simple"
  matrix:
    platform: ["ubuntu2204", "macos"]
    bazel: ["8.x"]
  tasks:
    run_test_module:
      name: "Run example tests"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
