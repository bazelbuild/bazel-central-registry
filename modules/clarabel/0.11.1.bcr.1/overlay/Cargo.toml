[workspace]
resolver = "2"

[package]
name = "clarabel_c"
version = "0.11.1"
edition = "2021"

[dependencies]
paste = "1.0"
serde = { version = "1", optional = true }
cfg-if = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
clarabel = { version = "0.11.1", features = ["sdp-accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
clarabel = { version = "0.11.1", features = ["sdp-openblas"] }
openblas-src = { version = "0.10.16", default-features = false, features = ["system"] }

[features]
default = []
sdp = []
serde = ["dep:serde"]

[lib]
path = "rust_wrapper/src/lib.rs"
crate-type = ["staticlib"]
