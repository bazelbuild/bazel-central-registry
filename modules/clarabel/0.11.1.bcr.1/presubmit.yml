matrix:
  bazel: [8.x, 9.x, rolling]
  platform:
    - debian11
    - debian13
    - ubuntu2204
    - ubuntu2404
    - macos_arm64

tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@clarabel//:clarabel'
      - '@clarabel//:clarabel_c'
      - '@clarabel//:clarabel_cpp'

bcr_test_module:
  module_path: tests
  matrix:
    bazel: [8.x, 9.x, rolling]
    platform:
      - debian11
      - debian13
      - ubuntu2204
      - ubuntu2404
      - macos_arm64
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - //:clarabel_c_smoke_test
        - //:clarabel_cpp_tests
