bcr_test_module:
  module_path: test
  matrix:
    platform:
      - debian11
      - ubuntu2004
      - ubuntu2004_arm64
      - ubuntu2204
      - ubuntu2404
      - macos
      - macos_arm64
    bazel: [7.x, 8.x, 9.x]
  tasks:
    smoke_tests:
      name: Run smoke tests
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
      - "@openfpgaloader//..."
      test_targets:
      - "//..."
