matrix:
  platform:
    - debian11
    - ubuntu2004
  bazel:
    - 8.x
    - 7.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - '--cxxopt=-std=c++17'
      - '--host_cxxopt=-std=c++17'
    build_targets:
      - '@cel-c//cel-c:arena'
      - '@cel-c//cel-c:value'
      - '@cel-c//cel-c:runtime'
      - '@cel-c//cel-c:status'
