matrix:
  platform: ["debian13", "macos", "windows"]
  bazel: ["7.x", "8.x", "9.x"]

tasks:
  verify_targets:
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - "@wpilib_toolchains//..."

bcr_test_module:
  module_path: "tests"
  matrix:
    # googletest 1.14.0, which tests/MODULE.bazel pins, uses bare cc_library and
    # so does not load under Bazel 9. Bump it upstream to widen this matrix.
    platform: ["debian13", "macos", "windows"]
    bazel: ["7.x", "8.x"]
  tasks:
    verify_targets:
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
      - "//:main"
      test_targets:
      - "//:test"
