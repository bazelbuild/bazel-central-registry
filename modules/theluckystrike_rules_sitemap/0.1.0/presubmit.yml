matrix:
  platform:
  - ubuntu2204
  - macos
  - windows
  bazel:
  - 7.x
  - 8.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@theluckystrike_rules_sitemap//:theluckystrike_rules_sitemap'

bcr_test_module:
  module_path: examples/site
  matrix:
    platform:
    - ubuntu2204
    - macos
    - windows
    bazel:
    - 7.x
    - 8.x
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
      - '//:site'
      test_targets:
      - '//...'
