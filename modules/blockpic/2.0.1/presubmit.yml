# The test module is integration/: blockpic as another module uses it,
# everything else from the Bazel Central Registry. CI runs the same module
# (.github/workflows/main.yml, job `integration`).
bcr_test_module:
  module_path: "integration"
  matrix:
    platform: ["debian11", "ubuntu2204", "ubuntu2404", "macos", "macos_arm64"]
    bazel: [8.x, 9.x]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
