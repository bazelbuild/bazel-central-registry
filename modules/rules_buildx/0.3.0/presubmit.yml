bcr_test_module:
  module_path: "e2e/smoke"
  matrix:
    platform: ["debian11", "ubuntu2204", "macos", "macos_arm64"]
    bazel: ["8.x", "9.x"]
  tasks:
    # BCR agents have no Docker daemon, so only verify the toolchain resolves and runs.
    # buildx_build targets are covered by this repo's CI.
    verify_toolchain:
      name: "Verify toolchain"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - "//:version"
