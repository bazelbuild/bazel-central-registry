# The Bazel Central Registry's checks for a new rinx version.
#
# Windows is absent on purpose: the rules drive their actions through bash,
# and crate_universe resolves only the platforms `MODULE.bazel` lists.
matrix:
  platform: ["debian11", "ubuntu2204", "macos", "macos_arm64"]
  bazel: ["8.x", "9.x"]
tasks:
  verify_targets:
    name: Build the rinx binary
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@rinx//:rinx"

# A small site built by a module depending on rinx — the shape every user has,
# and the one rinx's own examples, built as the root module, cannot exercise.
bcr_test_module:
  module_path: "e2e/smoke"
  matrix:
    platform: ["debian11", "ubuntu2204", "macos", "macos_arm64"]
    bazel: ["8.x", "9.x"]
  tasks:
    run_test_module:
      name: Build and test the smoke module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - "//..."
      test_targets:
        - "//..."
