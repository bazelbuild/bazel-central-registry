matrix:
  platform: ["debian13", "ubuntu2204", "ubuntu2404", "macos_arm64"]
  bazel: ["8.x", "9.x"]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--cxxopt=-std=c++20"
    build_targets:
      - "@naja//src/dnl:naja_dnl"
      - "@naja//src/nl/formats/systemverilog:naja_snl_systemverilog"
      - "@naja//src/nl/formats/verilog:naja_snl_verilog"
      - "@naja//src/nl/netlist/serialization/capnp:naja_nl_dump"
      - "@naja//src/nl/python/pyloader:naja_snl_pyloader"
      - "@naja//src/optimization:naja_opt"
