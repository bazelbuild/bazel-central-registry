matrix:
  platform:
    - ubuntu2404
  bazel:
    - 9.x
    - 8.x

tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    shell_commands:
      - "sudo apt-get update && (sudo apt-get install -y --no-install-recommends libibverbs-dev || true) && sudo ldconfig"
    build_flags:
      - "--cxxopt=-std=c++20"
      - "--host_cxxopt=-std=c++20"
    build_targets:
      - "@peregrine//peregrine/src/api:socket_util"
