matrix:
  unix_platform: [debian13, macos_arm64, ubuntu2404, ubuntu2404_arm64]
  windows_platform: [windows]
  bazel: [7.x, 8.x, 9.x, rolling]
tasks:
  unix_verify_targets:
    name: Verify build targets
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_flags: ["--cxxopt=-std=c++17", "--process_headers_in_dependencies", "--@boost.redis//:ssl=openssl"]
    build_targets: ["@boost.redis//:boost.redis"]
  windows_verify_targets:
    name: Verify build targets
    platform: ${{ windows_platform }}
    bazel: ${{ bazel }}
    build_flags: ["--cxxopt=/std:c++17", "--process_headers_in_dependencies", "--@boost.redis//:ssl=openssl"]
    build_targets: ["@boost.redis//:boost.redis"]

bcr_test_module:
  module_path: test
  matrix:
    unix_platform: [debian13, macos_arm64, ubuntu2404, ubuntu2404_arm64]
    windows_platform: [windows]
    bazel: [7.x, 8.x, 9.x, rolling]
  tasks:
    unix_run_test_module:
      name: Run upstream tests
      platform: ${{ unix_platform }}
      bazel: ${{ bazel }}
      build_flags: ["--cxxopt=-std=c++17", "--process_headers_in_dependencies", "--@boost.redis//:ssl=openssl", "--@boost.asio//:ssl=openssl"]
      build_targets: ["//..."]
      test_flags: ["--cxxopt=-std=c++17", "--process_headers_in_dependencies", "--@boost.redis//:ssl=openssl", "--@boost.asio//:ssl=openssl"]
      test_targets: ["//..."]
    windows_run_test_module:
      name: Run upstream tests
      platform: ${{ windows_platform }}
      bazel: ${{ bazel }}
      build_flags: ["--cxxopt=/std:c++17", "--process_headers_in_dependencies", "--@boost.redis//:ssl=openssl", "--@boost.asio//:ssl=openssl"]
      build_targets: ["//..."]
      test_flags: ["--cxxopt=/std:c++17", "--process_headers_in_dependencies", "--@boost.redis//:ssl=openssl", "--@boost.asio//:ssl=openssl"]
      test_targets: ["//..."]
