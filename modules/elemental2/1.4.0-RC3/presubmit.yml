matrix:
  platform:
    - macos
    - ubuntu2004
  bazel:
    - 8.x
tasks:
  run_tests:
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    # TODO(b/532249785): we need to have an empty maven.install() here due to
    #   https://github.com/bazel-contrib/rules_jvm_external/issues/1438
    shell_commands:
      - "echo 'bazel_dep(name = \"rules_jvm_external\", version = \"6.6\")' >> MODULE.bazel"
      - "echo 'maven = use_extension(\"@rules_jvm_external//:extensions.bzl\", \"maven\")' >> MODULE.bazel"
      - "echo 'maven.install()' >> MODULE.bazel"
    build_flags:
      - "--java_language_version=21"
      - "--java_runtime_version=21"
      - "--tool_java_language_version=21"
      - "--tool_java_runtime_version=21"
    build_targets:
      - '@elemental2//:all'
