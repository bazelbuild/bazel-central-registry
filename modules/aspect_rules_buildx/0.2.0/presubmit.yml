bcr_test_module:
  module_path: "e2e/smoke"
  matrix:
    linux_platform: ["debian11", "ubuntu2204"]
    macos_platform: ["macos", "macos_arm64"]
    bazel: ["8.x", "9.x"]
  tasks:
    run_tests_linux:
      name: "Run test module (Linux)"
      platform: ${{ linux_platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
    # macOS agents have no Docker daemon, so only verify the toolchain resolves and runs
    verify_toolchain_macos:
      name: "Verify toolchain (macOS, no Docker)"
      platform: ${{ macos_platform }}
      bazel: ${{ bazel }}
      build_targets:
        - "//:version"
