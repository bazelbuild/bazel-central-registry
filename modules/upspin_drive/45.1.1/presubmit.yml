# BCR builds this module as a dependency of another, so a target here is
# written as @upspin_drive//..., and the root module's overrides and its
# custom registry are not there. The integration module is that other
# module; see integration/MODULE.bazel.
#
# The package's own test is an end-to-end test against a real Drive
# account and skips without one, so it is not run here.
bcr_test_module:
  module_path: "integration"
  matrix:
    platform: ["debian11", "ubuntu2204", "ubuntu2404", "macos", "macos_arm64"]
    bazel: [8.x, 9.x]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - "@upspin_drive//cmd/upspinserver-drive"
        - "@upspin_drive//cmd/upspin-setupstorage-drive"
      test_targets:
        - "//..."
