matrix: &matrix
  platform:
    - debian11
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
    - windows
  bazel:
    - 7.x
    - 8.x
    - 9.x
    - rolling

tasks:
  # Eigen 3.4, as declared in daqp's MODULE.bazel.
  verify_targets:
    name: Verify build targets and run tests (Eigen 3.4)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets: &build_targets
      - '@daqp//:daqp'
      - '@daqp//:daqp_eigen'
      - '@daqp//:00_basic_qp'
      - '@daqp//:01_static_func'
      - '@daqp//:02_class'
      - '@daqp//:03_update'
      - '@daqp//:04_slack_sign'
      - '@daqp//:05_warmstart'
      - '@daqp//:06_general_hessian'
      - '@daqp//:07_symmetrize_hessian'
      - '@daqp//:08_unconstrained_check'
      - '@daqp//:09_soft_weights'
      - '@daqp//:10_eq_reduction'
      - '@daqp//:11_warm_update_M'
      - '@daqp//:12_update_state'
      - '@daqp//:13_warm_start_drift'
      - '@daqp//:14_degenerate_lp_warm'
      - '@daqp//:15_degenerate_lp_skip'
      - '@daqp//:16_update_M'
      - '@daqp//:17_cold_start_reduction'
      - '@daqp//:18_equality_warm_activation'
      - '@daqp//:19_fully_determined_eq'
      - '@daqp//:20_degenerate_cycling'
    test_targets: &test_targets
      - '@daqp//:00_basic_qp'
      - '@daqp//:01_static_func'
      - '@daqp//:02_class'
      - '@daqp//:03_update'
      - '@daqp//:05_warmstart'
      - '@daqp//:06_general_hessian'
      - '@daqp//:07_symmetrize_hessian'
      - '@daqp//:08_unconstrained_check'
      - '@daqp//:09_soft_weights'
      - '@daqp//:10_eq_reduction'
      - '@daqp//:11_warm_update_M'
      - '@daqp//:12_update_state'
      - '@daqp//:13_warm_start_drift'
      - '@daqp//:14_degenerate_lp_warm'
      - '@daqp//:15_degenerate_lp_skip'
      - '@daqp//:16_update_M'
      - '@daqp//:17_cold_start_reduction'
      - '@daqp//:18_equality_warm_activation'
      - '@daqp//:19_fully_determined_eq'
      - '@daqp//:20_degenerate_cycling'

# Eigen 5, as declared in tests/eigen5/MODULE.bazel.
bcr_test_module:
  module_path: tests/eigen5
  matrix: *matrix
  tasks:
    run_test_module:
      name: Verify build targets and run tests (Eigen 5)
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets: *build_targets
      test_targets: *test_targets
