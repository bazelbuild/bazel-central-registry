matrix: &matrix
  platform:
    - debian11
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
    - windows
  bazel:
    - 7.x
    - 8.x
    - 9.x
    - rolling

tasks:
  # Eigen 3.4, as declared in daqp's MODULE.bazel.
  verify_targets:
    name: Verify build targets and run tests (Eigen 3.4)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets: &build_targets
      - '@daqp//:all'
    test_targets: &test_targets
      - '@daqp//:all'

# Eigen 5, as declared in tests/eigen5/MODULE.bazel.
bcr_test_module:
  module_path: tests/eigen5
  matrix: *matrix
  tasks:
    run_test_module:
      name: Verify build targets and run tests (Eigen 5)
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets: *build_targets
      test_targets: *test_targets
