matrix: &matrix
  platform:
    - debian11
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
    - windows
  bazel:
    - 7.x
    - 8.x
    - 9.x
    - rolling

tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@daqp//:daqp'
      - '@daqp//:daqp_eigen'

bcr_test_module:
  module_path: .
  matrix: *matrix
  tasks:
    run_test_module:
      name: Run daqp-eigen tests
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - '//:00_basic_qp'
        - '//:01_static_func'
        - '//:02_class'
        - '//:03_update'
        - '//:04_slack_sign'
        - '//:05_warmstart'
        - '//:06_general_hessian'
        - '//:07_symmetrize_hessian'
        - '//:08_unconstrained_check'
        - '//:09_soft_weights'
        - '//:10_eq_reduction'
        - '//:11_warm_update_M'
        - '//:12_update_state'
        - '//:13_warm_start_drift'
        - '//:14_degenerate_lp_warm'
        - '//:15_degenerate_lp_skip'
        - '//:16_update_M'
        - '//:17_cold_start_reduction'
        - '//:18_equality_warm_activation'
      test_targets:
        - '//:00_basic_qp'
        - '//:01_static_func'
        - '//:02_class'
        - '//:03_update'
        - '//:05_warmstart'
        - '//:06_general_hessian'
        - '//:07_symmetrize_hessian'
        - '//:08_unconstrained_check'
        - '//:09_soft_weights'
        - '//:10_eq_reduction'
        - '//:11_warm_update_M'
        - '//:12_update_state'
        - '//:13_warm_start_drift'
        - '//:14_degenerate_lp_warm'
        - '//:15_degenerate_lp_skip'
        - '//:16_update_M'
        - '//:17_cold_start_reduction'
        - '//:18_equality_warm_activation'
