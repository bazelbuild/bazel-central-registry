# BCR builds this module as a dependency of another, so a target here is
# written as @upspin//..., and the root module's dev dependencies and its
# custom registry are not there. The integration module is that other
# module; see integration/MODULE.bazel.
#
# The tests in the upspin packages read their fixtures from the source
# tree with testutil.Repo, so they run only where upspin is the main
# module. The integration module's own test generates its keys instead.
bcr_test_module:
  module_path: "integration"
  matrix:
    platform: ["debian11", "ubuntu2204", "ubuntu2404", "macos", "macos_arm64"]
    bazel: [8.x, 9.x]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - "@upspin//cmd/upspin"
        - "@upspin//cmd/upspinserver"
        - "@upspin//cmd/upspinfs"
      test_targets:
        - "//..."
