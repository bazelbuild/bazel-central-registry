# Build all public aliases and exercise a separate downstream module.
matrix:
  platform:
    - ubuntu2404
    - macos
    - macos_arm64
  bazel:
    - 8.x
  cpp:
    - c++17
    - c++20

tasks:
  verify_targets:
    name: Build public library targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - --cxxopt=-std=${{ cpp }}
      - --host_cxxopt=-std=${{ cpp }}
    build_targets:
      - '@pixelmatch-cpp17//:pixelmatch'
      - '@pixelmatch-cpp17//:pixelmatch-cpp17'
      - '@pixelmatch-cpp17//:image_utils'

bcr_test_module:
  module_path: examples/bazel_consumer
  matrix:
    platform:
      - ubuntu2404
      - macos
      - macos_arm64
    bazel:
      - 8.x
    cpp:
      - c++17
      - c++20
  tasks:
    compare_images:
      name: Compare images through the public API
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_flags:
        - --cxxopt=-std=${{ cpp }}
        - --host_cxxopt=-std=${{ cpp }}
      test_targets:
        - //:consumer_test
