matrix:
  platform:
    - debian13
    - ubuntu2404
  bazel:
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@graphviz//:graphviz"
      - "@graphviz//:dot"
      - "@graphviz//:all_layout_bins"
bcr_test_module:
  module_path: "overlay/test_module"
  matrix:
    platform:
      - debian13
      - ubuntu2404
    bazel:
      - 8.x
      - 9.x
  tasks:
    run_tests:
      name: Run the test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
