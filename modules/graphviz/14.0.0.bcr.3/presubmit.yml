matrix:
  platform:
    - debian13
    - ubuntu2404
  bazel:
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@graphviz//:graphviz"
      - "@graphviz//:dot"
      - "@graphviz//:all_layout_bins"
bcr_test_module:
  # Relative to the source tree as Bazel materializes it, which already has
  # the overlay laid on top: the registry entry keeps this module under
  # overlay/test_module, the vendored source has it at test_module. With the
  # entry-relative path, presubmit stops while generating its pipeline with
  # "The test module directory does not exist in the source archive", before
  # any per-job status exists, so the only visible sign is the aggregate
  # bcr-presubmit check failing while every build job passes.
  module_path: "test_module"
  matrix:
    platform:
      - debian13
      - ubuntu2404
    bazel:
      - 8.x
      - 9.x
  tasks:
    run_tests:
      name: Run the test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
