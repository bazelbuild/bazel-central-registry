matrix:
  platform:
  - debian12
  - debian13
  - ubuntu2204
  - ubuntu2404
  - macos_arm64
  - windows
  bazel:
  - rolling
  - 9.x
  - 8.x
  - 7.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@nanoflann'

bcr_test_module:
  module_path: examples
  matrix:
    platform:
    - debian13
    - ubuntu2404
    - macos_arm64
    - windows
    bazel:
    - rolling
    - 9.x
    - 8.x
    - 7.x
  tasks:
    verify_examples:
      name: Verify examples
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
      - '//:dynamic_pointcloud_example'
      - '//:pointcloud_example'
      - '//:pointcloud_kdd_radius'
      - '//:pointcloud_adaptor_example'
      - '//:pointcloud_custom_metric'
      - '//:pointcloud_custom_resultset'
      - '//:pointcloud_incremental_example'
      - '//:manifold_so2_example'
      - '//:manifold_so3_example'
      - '//:manifold_se3_example'
      - '//:manifold_s2_example'
      - '//:manifold_se3_incremental_example'
      - '//:saveload_example'
      - '//:vector_of_vectors_example'
      - '//:matrix_example'
