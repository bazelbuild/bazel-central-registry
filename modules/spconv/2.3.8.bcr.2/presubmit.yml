matrix:
  platform: ["ubuntu2204"]
  bazel: ["8.x"]
tasks:
  verify_sources:
    name: Verify official and generated source packaging without a CUDA compiler
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@spconv//:upstream_sources"
      - "@spconv//:source_manifest"
      - "@spconv//:licenses"
