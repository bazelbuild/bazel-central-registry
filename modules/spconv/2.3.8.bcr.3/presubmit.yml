matrix:
  platform: ["ubuntu2204"]
  bazel: ["7.6.1", "8.8.1"]
tasks:
  verify_sources:
    name: "spconv source descriptors"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - "@spconv//:upstream_sources"
    - "@spconv//:source_manifest"
    - "@spconv//:licenses"
    - "@spconv//:generated"
    test_targets:
    - "@spconv//bazel:generate_test"
