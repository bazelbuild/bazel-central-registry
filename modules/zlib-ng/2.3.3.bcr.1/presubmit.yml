matrix:
  platform:
    - debian11
    - ubuntu2004
    - ubuntu2204
    - ubuntu2404_arm64
    - macos
    - macos_arm64
    - windows
    - windows_arm64
  bazel:
    - 7.x
    - 8.x
    - 9.x
    - rolling

tasks:
  verify_targets:
    name: Verify compatibility and native zlib-ng targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@zlib-ng//:zlib-ng'
      - '@zlib-ng//:zlib'
      - '@zlib-ng//:zlib_ng_native'

bcr_test_module:
  module_path: tests
  matrix:
    platform:
      - ubuntu2204
      - ubuntu2404_arm64
      - macos
      - macos_arm64
      - windows
      - windows_arm64
    bazel:
      - 7.x
      - 8.x
      - 9.x
      - rolling
  tasks:
    run_test_module:
      name: Verify compatibility and native gzip decoding
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - //:compat_gzip_smoke
        - //:native_gzip_smoke
