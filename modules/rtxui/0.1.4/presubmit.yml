# RTXUI needs C++23: GCC 14 or newer, Clang 18 or newer, or MSVC. Of the BCR's
# Linux images, debian13 is the one whose system GCC is new enough.
matrix:
  platform:
    - debian13
    - macos_arm64
    - windows
  bazel:
    - 8.x
    - rolling

tasks:
  verify_targets:
    name: Build the library
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@rtxui//:rtxui'

bcr_test_module:
  module_path: packaging/bazel/test_module
  matrix:
    platform:
      - debian13
      - macos_arm64
      - windows
    bazel:
      - 8.x
      - rolling
  tasks:
    run_test_module:
      name: Run an app depending on rtxui
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - '//:app_test'
