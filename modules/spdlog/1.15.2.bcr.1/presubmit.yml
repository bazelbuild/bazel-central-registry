matrix:
  unix_platform:
    - macos
    - macos_arm64
    - ubuntu2404
  windows_platform:
    - windows
  bazel: [8.x, 9.x, rolling]
tasks:
  unix_test_header:
    name: Verify unix build targets (header only)
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@spdlog//:spdlog"
      - "@spdlog//:package_metadata"
  unix_test_compiled:
    name: Verify unix build targets (compiled lib)
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@spdlog//:spdlog"
      - "@spdlog//:package_metadata"
    build_flags:
      - "--@spdlog//:header_only=False"
  windows_test_header:
    name: Verify windows build targets (header only)
    platform: ${{ windows_platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@spdlog//:spdlog"
      - "@spdlog//:package_metadata"
    build_flags:
      - --cxxopt=/utf-8
  windows_test_compiled:
    name: Verify windows build targets (compiled lib)
    platform: ${{ windows_platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@spdlog//:spdlog"
      - "@spdlog//:package_metadata"
    build_flags:
      - "--@spdlog//:header_only=False"
      - "--cxxopt=/utf-8"
