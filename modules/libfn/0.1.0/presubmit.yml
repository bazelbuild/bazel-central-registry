matrix:
  platform:
    - debian12
    - debian12_arm64
    - debian13
    - debian13_arm64
    - ubuntu2404
    - ubuntu2404_arm64
    - fedora43
    - macos
    - macos_arm64
    - windows
  bazel: [7.x, 8.x]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@libfn//:fn'
      - '@libfn//:fn_cxx26'
      - '@libfn//:pfn'
      - '@libfn//:version'
