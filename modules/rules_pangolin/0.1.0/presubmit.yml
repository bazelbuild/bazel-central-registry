bcr_test_module:
  module_path: "test"
  matrix:
    platform: ["ubuntu2204", "windows"]
    bazel: [8.x]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//:pangolin_core_test"
        - "//:pangolin_smoke_test"
