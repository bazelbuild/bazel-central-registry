matrix:
  unix_platform:
    - debian13
    - ubuntu2404
    - ubuntu2404_arm64
    - macos_arm64
  windows_platform:
    - windows
  bazel: [8.x, 9.x]
tasks:
  verify_targets_unix:
    name: Verify build targets
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_flags:
      - '--cxxopt=-std=c++20'
      - '--host_cxxopt=-std=c++20'
    test_flags:
      - '--cxxopt=-std=c++20'
      - '--host_cxxopt=-std=c++20'
    build_targets:
      - '@aos//aos:configuration'
      - '@aos//aos:init'
      - '@aos//aos:json_to_flatbuffer'
      - '@aos//aos:config_flattener'
      - '@aos//aos/events:shm_event_loop'
      - '@aos//aos/events:simulated_event_loop'
      - '@aos//aos/flatbuffers:generate'
    test_targets:
      - '@aos//aos/testing/ping_pong:pingpong_test'
      - '@aos//aos:configuration_test'
      - '@aos//aos:json_to_flatbuffer_test'
      - '@aos//aos:flatbuffer_merge_test'
      - '@aos//aos/events:simulated_event_loop_test'
  verify_targets_windows:
    name: Verify build targets
    platform: ${{ windows_platform }}
    bazel: ${{ bazel }}
    build_flags:
      - '--cxxopt=/std:c++20'
      - '--host_cxxopt=/std:c++20'
      - '--cxxopt=/Zc:preprocessor'
      - '--host_cxxopt=/Zc:preprocessor'
      - '--cxxopt=/Zc:__cplusplus'
      - '--host_cxxopt=/Zc:__cplusplus'
      - '--cxxopt=/permissive-'
      - '--host_cxxopt=/permissive-'
      - '--cxxopt=/utf-8'
      - '--host_cxxopt=/utf-8'
      - '--cxxopt=/bigobj'
      - '--host_cxxopt=/bigobj'
      - '--cxxopt=/EHsc'
      - '--host_cxxopt=/EHsc'
      - '--enable_runfiles'
    test_flags:
      - '--cxxopt=/std:c++20'
      - '--host_cxxopt=/std:c++20'
      - '--cxxopt=/Zc:preprocessor'
      - '--host_cxxopt=/Zc:preprocessor'
      - '--cxxopt=/Zc:__cplusplus'
      - '--host_cxxopt=/Zc:__cplusplus'
      - '--cxxopt=/permissive-'
      - '--host_cxxopt=/permissive-'
      - '--cxxopt=/utf-8'
      - '--host_cxxopt=/utf-8'
      - '--cxxopt=/bigobj'
      - '--host_cxxopt=/bigobj'
      - '--cxxopt=/EHsc'
      - '--host_cxxopt=/EHsc'
      - '--enable_runfiles'
    build_targets:
      - '@aos//aos:configuration'
      - '@aos//aos:init'
      - '@aos//aos:json_to_flatbuffer'
      - '@aos//aos:config_flattener'
      - '@aos//aos/events:shm_event_loop'
      - '@aos//aos/events:simulated_event_loop'
      - '@aos//aos/flatbuffers:generate'
    test_targets:
      - '@aos//aos/testing/ping_pong:pingpong_test'
      - '@aos//aos:configuration_test'
      - '@aos//aos:json_to_flatbuffer_test'
      - '@aos//aos:flatbuffer_merge_test'
      - '@aos//aos/events:simulated_event_loop_test'
bcr_test_module:
  module_path: test
  matrix:
    unix_platform:
      - debian13
      - ubuntu2404
      - ubuntu2404_arm64
      - macos_arm64
    windows_platform:
      - windows
    bazel: [8.x, 9.x]
  tasks:
    run_test_module_unix:
      name: Run test module
      platform: ${{ unix_platform }}
      bazel: ${{ bazel }}
      build_flags:
        - '--cxxopt=-std=c++20'
        - '--host_cxxopt=-std=c++20'
      test_flags:
        - '--cxxopt=-std=c++20'
        - '--host_cxxopt=-std=c++20'
      build_targets:
        - //...
      test_targets:
        - //...
    run_test_module_windows:
      name: Run test module
      platform: ${{ windows_platform }}
      bazel: ${{ bazel }}
      build_flags:
        - '--cxxopt=/std:c++20'
        - '--host_cxxopt=/std:c++20'
        - '--cxxopt=/Zc:preprocessor'
        - '--host_cxxopt=/Zc:preprocessor'
        - '--cxxopt=/Zc:__cplusplus'
        - '--host_cxxopt=/Zc:__cplusplus'
        - '--cxxopt=/permissive-'
        - '--host_cxxopt=/permissive-'
        - '--cxxopt=/utf-8'
        - '--host_cxxopt=/utf-8'
        - '--cxxopt=/bigobj'
        - '--host_cxxopt=/bigobj'
        - '--cxxopt=/EHsc'
        - '--host_cxxopt=/EHsc'
        - '--enable_runfiles'
      test_flags:
        - '--cxxopt=/std:c++20'
        - '--host_cxxopt=/std:c++20'
        - '--cxxopt=/Zc:preprocessor'
        - '--host_cxxopt=/Zc:preprocessor'
        - '--cxxopt=/Zc:__cplusplus'
        - '--host_cxxopt=/Zc:__cplusplus'
        - '--cxxopt=/permissive-'
        - '--host_cxxopt=/permissive-'
        - '--cxxopt=/utf-8'
        - '--host_cxxopt=/utf-8'
        - '--cxxopt=/bigobj'
        - '--host_cxxopt=/bigobj'
        - '--cxxopt=/EHsc'
        - '--host_cxxopt=/EHsc'
        - '--enable_runfiles'
      build_targets:
        - //...
      test_targets:
        - //...
