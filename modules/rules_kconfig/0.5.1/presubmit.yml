bcr_test_module:
  module_path: "examples/simple"
  matrix:
    platform:
      - "macos_arm64"
      - "ubuntu2004"
      - "ubuntu2004_arm64"
      - "windows"
      - debian10
      - rockylinux8
    bazel: [7.x, 8.x, 9.x]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
    run_tests_wasm:
      name: "Run test module (WebAssembly backend)"
      platform: ${{ platform }}
      bazel: 9.x
      build_flags:
        - "--experimental_repository_ctx_execute_wasm"
      test_flags:
        - "--experimental_repository_ctx_execute_wasm"
      test_targets:
        - "//..."
