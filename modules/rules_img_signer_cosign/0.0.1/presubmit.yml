bcr_test_module:
  module_path: "."
  matrix:
    platform: ["debian10", "ubuntu2004", "macos", "macos_arm64", "windows", "windows_arm64"]
    bazel: [8.x, 9.*]
  tasks:
    run_test_module:
      name: "build plugin"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//:all"
