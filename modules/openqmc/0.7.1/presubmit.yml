matrix:
  platform:
    - debian13
    - ubuntu2404
    - macos
    - macos_arm64
    - windows
  bazel: [8.x, 9.x, rolling]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@openqmc//:openqmc'
    test_targets:
      - '@openqmc//:bntables_test'
      - '@openqmc//:encode_test'
      - '@openqmc//:float_test'
      - '@openqmc//:permute_test'
      - '@openqmc//:reverse_test'
      - '@openqmc//:sampler_test'
