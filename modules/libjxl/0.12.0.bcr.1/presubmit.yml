matrix:
  platform:
    - ubuntu2404
    - ubuntu2404_arm64
    - macos_arm64
  bazel:
    - 8.5.0
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Build upstream JPEG XL targets and run original codec tests
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@libjxl//:libjxl'
      - '@libjxl//:jxl'
      - '@libjxl//:jxl_threads'
    test_targets:
      - '@libjxl//lib:jxl/bits_test'
      - '@libjxl//lib:jxl/alpha_test'
      - '@libjxl//lib:jxl/enc_external_image_test'
