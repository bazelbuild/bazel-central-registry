matrix:
  platform: [ubuntu2204, ubuntu2004_arm64]
  bazel: [7.x, 8.x, 9.x]
tasks:
  native_fips:
    name: Native static FIPS library and integrity tests
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@aws-lc-fips//:crypto"
      - "@aws-lc-fips//:ssl"
    test_targets:
      - "@aws-lc-fips//:upstream_fips_test"
      - "@aws-lc-fips//:fips_smoke_test"
      - "@aws-lc-fips//:integrity_test"
