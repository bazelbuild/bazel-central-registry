# The registry presubmit builds the module named by `module_path` against the
# release being published. That directory exists in this repository and is
# runnable locally with `cd integration && bazel test //...`.
#
# v1 supports Linux x86_64 only (spec requirement P1), as do the other
# hardware modules. The packager and checker are Go, built from source, so
# a platform can be added once the module's tests run there.
bcr_test_module:
  module_path: "integration"
  matrix:
    platform: ["debian11", "ubuntu2204", "ubuntu2404"]
    bazel: [8.x, 9.x]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
