bcr_test_module:
  module_path: e2e/smoke
  matrix:
    bazel: ['8.x', '9.x']
  tasks:
    linux_amd64:
      platform: ubuntu2404
      bazel: ${{ bazel }}
      test_targets: ['//:x86_64_test']
    linux_arm64:
      platform: ubuntu2404_arm64
      bazel: ${{ bazel }}
      test_targets: ['//:aarch64_test', '//:x86_64_test']
    windows_amd64:
      platform: windows
      bazel: ${{ bazel }}
      test_targets: ['//:x86_64_test']
