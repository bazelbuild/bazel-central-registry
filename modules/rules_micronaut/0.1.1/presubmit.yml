bcr_test_module:
  module_path: "e2e/smoke"
  matrix:
    # Windows is unvalidated and excluded from the presubmit matrix.
    platform: ["debian11", "macos", "ubuntu2204"]
    bazel: ["9.*", "8.*"]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
