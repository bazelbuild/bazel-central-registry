matrix:
  platform: [debian13, ubuntu2404]
  bazel: [8.x, 9.x]
tasks:
  verify_targets:
    name: Build static renderer
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags: ["--cxxopt=-std=c++17"]
    build_targets: ["@librsvg"]
bcr_test_module:
  module_path: bazel_test
  matrix:
    platform: [debian13, ubuntu2404]
    bazel: [8.x, 9.x]
  tasks:
    run_tests:
      name: Render SVG through the built-in GdkPixbuf loader
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_flags: ["--cxxopt=-std=c++17", "--@gdk-pixbuf//:builtin_svg"]
      test_targets: ["//:all"]
