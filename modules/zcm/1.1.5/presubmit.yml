matrix:
  platform:
    - debian13
    - ubuntu2404
    - macos_arm64
  bazel:
    - 9.x
    - 8.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@zcm//:zcm"
      - "@zcm//:zcm-bridge"
      - "@zcm//:zcm-coretypes"
      - "@zcm//:zcm-gen"
      - "@zcm//:zcm-indexer"
      - "@zcm//:zcm-logger"
      - "@zcm//:zcm-logplayer"
      - "@zcm//:zcm-repeater"
      - "@zcm//:zcm-spy-lite"
      - "@zcm//:zcm-spy-peek"
      - "@zcm//:zcm-tools-util"
      - "@zcm//:zcm-topology-visualizer"
      - "@zcm//:zcm-transcoder"
