matrix:
  platform:
    - debian13
    - ubuntu2404
    - macos_arm64
  bazel:
    - 9.x
    - 8.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@zcm//:zcm"
      - "@zcm//:zcm-bridge"
      - "@zcm//:zcm-coretypes"
      - "@zcm//:zcm-gen"
      - "@zcm//:zcm-indexer"
      - "@zcm//:zcm-logger"
      - "@zcm//:zcm-logplayer"
      - "@zcm//:zcm-repeater"
      - "@zcm//:zcm-spy-lite"
      - "@zcm//:zcm-spy-peek"
      - "@zcm//:zcm-tools-util"
      - "@zcm//:zcm-topology-visualizer"
      - "@zcm//:zcm-transcoder"

bcr_test_module:
  module_path: test
  matrix:
    platform:
      - debian13
      - ubuntu2404
      - macos_arm64
    bazel:
      - 9.x
      - 8.x
  tasks:
    run_tests:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - //:api_retcodes_test
        - //:bitfield_test
        - //:core_test
        - //:dispatch_loop_test
        - //:flushing_test
        - //:forking_test
        - //:forking2_test
        - //:log_test
        - //:message_tracker_test
        - //:sub_unsub_c_test
        - //:sub_unsub_cpp_test
        - //:tracker_test
        - //:trans_test
