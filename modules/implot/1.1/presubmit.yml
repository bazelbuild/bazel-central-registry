matrix:
  platform:
    - debian10
    - debian11
    - debian12
    - debian13
    - macos
    - macos_arm64
    - ubuntu2004
    - ubuntu2204
    - ubuntu2404
    - windows
  bazel: [7.x, 8.x, 9.x, rolling]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@implot"

bcr_test_module:
  module_path: bcr_test_module
  matrix:
    platform: ["ubuntu2204", "macos", "macos_arm64", "windows"]
    bazel: [7.x, 8.x, 9.x]
  tasks:
    headless_test:
      name: Run headless ImPlot test
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//:smoke_test"
