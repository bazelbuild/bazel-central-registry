matrix:
  platform:
  - debian11
  - ubuntu2004
  - ubuntu2004_arm64
  - ubuntu2204
  - ubuntu2404
  - macos
  - macos_arm64
  # `src/mt.c` names MTIOCTOP and `struct mtop` outside the HAVE_SYS_MTIO_H
  # guard, so `--enable-mt` only ever built where <sys/mtio.h> exists.
  mtio_platform:
  - debian11
  - ubuntu2004
  - ubuntu2004_arm64
  - ubuntu2204
  - ubuntu2404
  bazel: [7.x, 8.x, 9.x]
tasks:
  verify_targets:
    name: Verify build targets (defaults)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@cpio//...'
    test_targets:
    - '@cpio//...'
  verify_mt:
    name: Verify build targets (--enable_mt=True)
    platform: ${{ mtio_platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--@cpio//:enable_mt=True'
    test_flags:
    - '--@cpio//:enable_mt=True'
    build_targets:
    - '@cpio//...'
    test_targets:
    - '@cpio//...'
  verify_rmt_command:
    name: Verify build targets (--default_rmt_command=/usr/sbin/rmt)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--@cpio//:default_rmt_command=/usr/sbin/rmt'
    test_flags:
    - '--@cpio//:default_rmt_command=/usr/sbin/rmt'
    build_targets:
    - '@cpio//...'
    test_targets:
    - '@cpio//...'
  verify_quoting_style:
    name: Verify build targets (--default_quoting_style=literal)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--@cpio//:default_quoting_style=literal'
    test_flags:
    - '--@cpio//:default_quoting_style=literal'
    build_targets:
    - '@cpio//...'
    test_targets:
    - '@cpio//...'
