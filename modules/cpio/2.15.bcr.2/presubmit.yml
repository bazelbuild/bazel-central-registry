matrix:
  platform:
  - debian11
  - ubuntu2204
  - ubuntu2204_arm64
  - ubuntu2404
  # `src/mt.c` names MTIOCTOP and `struct mtop` outside the HAVE_SYS_MTIO_H
  # guard, so `mt` (upstream's --enable-mt extra program) builds only where
  # <sys/mtio.h> exists; the macOS tasks below leave it out.
  macos_platform:
  - macos
  - macos_arm64
  bazel: [7.x, 8.x, 9.x]
tasks:
  verify_targets:
    name: Verify build targets (defaults)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@cpio//...'
    test_targets:
    - '@cpio//...'
  verify_targets_macos:
    name: Verify build targets (defaults, without mt)
    platform: ${{ macos_platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@cpio//...'
    - '-@cpio//:mt'
    - '-@cpio//:src/mt'
    test_targets:
    - '@cpio//...'
  verify_rmt_command:
    name: Verify build targets (--default_rmt_command=/usr/sbin/rmt)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--@cpio//:default_rmt_command=/usr/sbin/rmt'
    test_flags:
    - '--@cpio//:default_rmt_command=/usr/sbin/rmt'
    build_targets:
    - '@cpio//...'
    test_targets:
    - '@cpio//...'
  verify_quoting_style:
    name: Verify build targets (--default_quoting_style=literal)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--@cpio//:default_quoting_style=literal'
    test_flags:
    - '--@cpio//:default_quoting_style=literal'
    build_targets:
    - '@cpio//...'
    test_targets:
    - '@cpio//...'
