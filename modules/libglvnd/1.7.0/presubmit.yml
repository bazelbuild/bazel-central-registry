matrix:
  platform:
    - ubuntu2404
    - ubuntu2404_arm64
  bazel: [7.x, 8.x, 9.x]
  # The hermetic LLVM toolchain only works for Bazel 8.x onwards.
  hermetic_llvm_bazel: [8.x, 9.x]
tasks:
  # Check building works against a host-provided C++ toolchain.
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@libglvnd//:all'
  # Check building works against a hermetic C++ toolchain.
  verify_targets_hermetic_llvm:
    name: Verify build targets (hermetic llvm)
    platform: ${{ platform }}
    bazel: ${{ hermetic_llvm_bazel }}
    setup:
      - echo 'bazel_dep(name = "llvm", version = "0.8.27")' >> MODULE.bazel
    build_flags:
      - '--repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1'
      - '--extra_toolchains=@llvm//toolchain:all'
    build_targets:
      - '@libglvnd//:all'

# The *_render_test targets are tagged manual (they need a GPU), so //... runs
# only the hermetic export and DT_NEEDED checks.
bcr_test_module:
  module_path: tests
  matrix:
    platform:
      - ubuntu2404
      - ubuntu2404_arm64
    bazel: [7.x, 8.x, 9.x]
    hermetic_llvm_bazel: [8.x, 9.x]
  tasks:
    run_test_module:
      name: Verify stub exports and DT_NEEDED entries
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - '//...'
    run_test_module_hermetic_llvm:
      name: Verify stub exports and DT_NEEDED entries (hermetic llvm)
      platform: ${{ platform }}
      bazel: ${{ hermetic_llvm_bazel }}
      setup:
        - echo 'bazel_dep(name = "llvm", version = "0.8.27")' >> MODULE.bazel
      test_flags:
        - '--repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1'
        - '--extra_toolchains=@llvm//toolchain:all'
      test_targets:
        - '//...'
