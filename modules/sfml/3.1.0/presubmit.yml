matrix:
  linux_platform:
    - debian11
    - ubuntu2204
    - ubuntu2404
  macos_platform:
    - macos
    - macos_arm64
  bazel: [7.x, 8.x, 9.x]
tasks:
  verify_linux_targets:
    name: Verify build targets (Linux)
    platform: ${{ linux_platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@sfml//:sfml"
  verify_macos_targets:
    name: Verify build targets (macOS)
    platform: ${{ macos_platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1"
    build_targets:
      - "@sfml//:sfml"
  verify_windows_targets:
    name: Verify build targets (Windows)
    platform: windows
    bazel: ${{ bazel }}
    build_targets:
      - "@sfml//:sfml"
      - "@sfml//:main"
bcr_test_module:
  module_path: bazel_test
  matrix:
    platform:
      - debian11
      - ubuntu2204
      - ubuntu2404
      - macos
      - macos_arm64
      - windows
    bazel: [7.x, 8.x, 9.x]
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//:smoke_test"
