bcr_test_module:
  module_path: "e2e/smoke"
  matrix:
    platform:
      - "debian11"
      - "ubuntu2204"
      - "ubuntu2404"
  tasks:
    run_tests_bazel8:
      name: "Run stock-runner smoke tests (default Bazel, strict lock)"
      platform: ${{ platform }}
      bazel: "8.8.2"
      test_flags:
        - "--lockfile_mode=error"
      test_targets:
        - "//:stock_runner_tests"
    run_tests_bazel9:
      name: "Run stock-runner smoke tests (Bazel 9 compatibility)"
      platform: ${{ platform }}
      bazel: "9.3.1"
      test_flags:
        - "--lockfile_mode=off"
      test_targets:
        - "//:stock_runner_tests"
