matrix:
  platform:
    - ubuntu2204
    - ubuntu2004_arm64
    - macos
    - macos_arm64
  backend_platform:
    - ubuntu2404
    - ubuntu2004_arm64
    - macos
    - macos_arm64
  bazel8_backend_platform:
    - ubuntu2404
  default_backend_platform:
    - ubuntu2404
    - macos_arm64
  bazel:
    - 8.x
    - 9.x

tasks:
  verify_minimal_public_targets:
    name: Verify minimal public targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - --@sentry_native//config:backend=none
      - --@sentry_native//config:transport=none
      - --@sentry_native//config:screenshot=none
    build_targets:
      - "@sentry_native//:sentry"
      - "@sentry_native//:sentry_shared"
      - "@sentry_native//:sentry_shared_library"

  verify_breakpad_public_targets:
    name: Verify Breakpad public targets
    platform: ${{ backend_platform }}
    bazel: 9.x
    build_flags:
      - --@sentry_native//config:backend=breakpad
      - --@sentry_native//config:transport=none
      - --@sentry_native//config:screenshot=none
    build_targets:
      - "@sentry_native//:sentry"
      - "@sentry_native//:sentry_shared"

  verify_native_public_targets:
    name: Verify native-backend public targets
    platform: ${{ backend_platform }}
    bazel: 9.x
    build_flags:
      - --@sentry_native//config:backend=native
      - --@sentry_native//config:transport=none
      - --@sentry_native//config:screenshot=none
    build_targets:
      - "@sentry_native//:sentry"
      - "@sentry_native//:sentry_crash"
      - "@sentry_native//:sentry_shared"

  verify_breakpad_artifacts:
    name: Verify static and shared Breakpad artifacts
    platform: ${{ backend_platform }}
    bazel: 9.x
    test_flags:
      - --@sentry_native//config:backend=breakpad
      - --@sentry_native//config:transport=none
      - --@sentry_native//config:screenshot=none
    test_targets:
      - "@sentry_native//tests/breakpad:crash_artifact_test"
      - "@sentry_native//tests/breakpad:shared_crash_artifact_test"

  verify_crashpad_artifacts:
    name: Verify static and shared Crashpad artifacts
    platform: ${{ backend_platform }}
    bazel: 9.x
    test_flags:
      - --@sentry_native//config:backend=crashpad
      - --@sentry_native//config:transport=none
      - --@sentry_native//config:screenshot=none
    test_targets:
      - "@sentry_native//tests/crashpad:crash_artifact_test"
      - "@sentry_native//tests/crashpad:shared_crash_artifact_test"
      - "@sentry_native//tests/crashpad:invalid_handler_test"

  verify_crashpad_artifacts_bazel8:
    name: Verify Crashpad artifacts with Bazel 8
    platform: ${{ bazel8_backend_platform }}
    bazel: 8.x
    test_flags:
      - --@sentry_native//config:backend=crashpad
      - --@sentry_native//config:transport=none
      - --@sentry_native//config:screenshot=none
    test_targets:
      - "@sentry_native//tests/crashpad:crash_artifact_test"
      - "@sentry_native//tests/crashpad:shared_crash_artifact_test"
      - "@sentry_native//tests/crashpad:invalid_handler_test"

  verify_default_crashpad_artifacts:
    name: Verify default static and shared Crashpad artifacts
    platform: ${{ default_backend_platform }}
    bazel: 9.x
    test_targets:
      - "@sentry_native//tests/crashpad:crash_artifact_test"
      - "@sentry_native//tests/crashpad:shared_crash_artifact_test"

  verify_default_crashpad_artifacts_bazel8:
    name: Verify default static and shared Crashpad artifacts with Bazel 8
    platform: ${{ bazel8_backend_platform }}
    bazel: 8.x
    test_targets:
      - "@sentry_native//tests/crashpad:crash_artifact_test"
      - "@sentry_native//tests/crashpad:shared_crash_artifact_test"

  verify_native_artifact:
    name: Verify native backend artifact
    platform: ${{ backend_platform }}
    bazel: 9.x
    test_flags:
      - --@sentry_native//config:backend=native
      - --@sentry_native//config:transport=none
      - --@sentry_native//config:screenshot=none
    test_targets:
      - "@sentry_native//tests/native:crash_artifact_test"
      - "@sentry_native//tests/native:shared_crash_artifact_test"

bcr_test_module:
  module_path: e2e/bcr
  matrix:
    platform:
      - ubuntu2404
      - macos_arm64
    bazel:
      - 8.x
      - 9.x
  tasks:
    verify_crashpad_consumers:
      name: Verify static and shared Crashpad consumers
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_flags:
        - --@sentry_native//config:backend=crashpad
        - --@sentry_native//config:transport=none
        - --@sentry_native//config:screenshot=none
        - --@sentry_native//config:embed_info=true
      test_targets:
        - //:crashpad_smoke_test
        - //:shared_crashpad_smoke_test

    verify_default_crashpad_artifacts_bazel8_macos:
      name: Verify default Crashpad artifacts with Bazel 8 on macOS
      platform: macos_arm64
      bazel: 8.x
      test_targets:
        - "@sentry_native//tests/crashpad:crash_artifact_test"
        - "@sentry_native//tests/crashpad:shared_crash_artifact_test"
