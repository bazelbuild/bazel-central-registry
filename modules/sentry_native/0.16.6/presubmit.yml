matrix:
  platform:
    - ubuntu2204
    - ubuntu2004_arm64
    - macos
    - macos_arm64
  backend_platform:
    - ubuntu2404
    - ubuntu2004_arm64
    - macos
    - macos_arm64
  bazel:
    - 8.x
    - 9.x

tasks:
  verify_minimal_public_targets:
    name: Verify minimal public targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - --@sentry_native//config:backend=none
      - --@sentry_native//config:transport=none
      - --@sentry_native//config:screenshot=none
    build_targets:
      - "@sentry_native//:sentry"
      - "@sentry_native//:sentry_shared"
      - "@sentry_native//:sentry_shared_library"

  verify_breakpad_public_targets:
    name: Verify Breakpad public targets
    platform: ${{ backend_platform }}
    bazel: 9.x
    build_flags:
      - --@sentry_native//config:backend=breakpad
      - --@sentry_native//config:transport=none
      - --@sentry_native//config:screenshot=none
    build_targets:
      - "@sentry_native//:sentry"
      - "@sentry_native//:sentry_shared"

  verify_native_public_targets:
    name: Verify native-backend public targets
    platform: ${{ backend_platform }}
    bazel: 9.x
    build_flags:
      - --@sentry_native//config:backend=native
      - --@sentry_native//config:transport=none
      - --@sentry_native//config:screenshot=none
    build_targets:
      - "@sentry_native//:sentry"
      - "@sentry_native//:sentry_crash"
      - "@sentry_native//:sentry_shared"

bcr_test_module:
  module_path: e2e/bcr
  matrix:
    platform:
      - ubuntu2404
      - macos_arm64
    bazel:
      - 8.x
      - 9.x
  tasks:
    verify_crashpad_consumers:
      name: Verify static and shared Crashpad consumers
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_flags:
        - --@sentry_native//config:backend=crashpad
        - --@sentry_native//config:transport=none
        - --@sentry_native//config:screenshot=none
        - --@sentry_native//config:embed_info=true
      test_targets:
        - //:crashpad_smoke_test
        - //:shared_crashpad_smoke_test
