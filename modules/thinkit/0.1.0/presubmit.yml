matrix:
  platform:
    - debian11
    - ubuntu2204
  bazel:
    - 8.x
tasks:
  verify_targets:
    name: Verify build and test targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - '--cxxopt=-std=c++20'
      - '--host_cxxopt=-std=c++20'
    build_targets:
      - '@thinkit//thinkit:thinkit'
      - '@thinkit//thinkit:thinkit_mocks'
    test_targets:
      - '@thinkit//thinkit/...'
