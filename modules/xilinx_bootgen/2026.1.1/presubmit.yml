matrix:
  platform:
    - debian10
    - debian13
    - debian13_arm64
    - rockylinux8
    - ubuntu2204
    - ubuntu2204_arm64
  bazel: ["8.x", "9.x"]
tasks:
  verify_targets:
    name: "Verify build targets"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - "@xilinx_bootgen//..."
    test_targets:
    - "@xilinx_bootgen//..."
