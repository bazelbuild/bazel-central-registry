matrix:
  platform:
    - debian13
    - debian13_arm64
    - macos_arm64
    - ubuntu2204
    - ubuntu2204_arm64
  bazel: ["7.x", "8.x", "9.x"]
tasks:
  verify_targets:
    name: "Default build + test"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - "@bc//..."
    test_targets:
    - "@bc//..."

  # Flag coverage: each task flips one of the configure options (bool_flags of
  # the root package) to exercise its select() wiring.
  readline_on:
    name: "Build/test with //:readline=true"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@bc//:readline=true"
    test_flags:
    - "--@bc//:readline=true"
    build_targets:
    - "@bc//..."
    test_targets:
    - "@bc//..."

  dc_bang_shell_off:
    name: "Build/test with //:dc_bang_shell=false"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@bc//:dc_bang_shell=false"
    test_flags:
    - "--@bc//:dc_bang_shell=false"
    build_targets:
    - "@bc//..."
    test_targets:
    - "@bc//..."

# Windows is not built: bc/proto.h, dc/eval.c and lib/getopt.c include
# <unistd.h>, which MSVC does not have.
