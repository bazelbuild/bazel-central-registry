matrix:
  platform:
    - ubuntu2404
    - ubuntu2404_arm64
    - macos_arm64
  bazel:
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Build Shine and run its upstream encoding rounds
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@shine//:shine'
    test_targets:
      - '@shine//:rounds_test'
