matrix:
  platform:
    - debian10
    - debian13
    - debian13_arm64
    - macos_arm64
    - rockylinux8
    - ubuntu2204
    - ubuntu2204_arm64
    - windows
  bazel: ["7.x", "8.x", "9.x"]
tasks:
  verify_targets:
    name: "Run test module"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - "@flex//..."
    test_targets:
    - "@flex//..."
# test_module/ is a Bazel module of its own under the overlay, ignored by the
# program's .bazelignore: it registers @flex//:flex as the rules_flex toolchain
# and runs the rule set's basic operation with it, so that rules_flex is not a
# dependency of the program itself.
bcr_test_module:
  module_path: test_module
  matrix:
    platform:
      - debian10
      - debian13
      - debian13_arm64
      - macos_arm64
      - rockylinux8
      - ubuntu2204
      - ubuntu2204_arm64
      - windows
    bazel: ["7.x", "8.x", "9.x"]
  tasks:
    run_test_module:
      name: Run test module (rules_flex toolchain)
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
      - "//..."
      test_targets:
      - "//..."
