matrix:
  platform:
    - debian11
    - ubuntu2004
    - ubuntu2004_arm64
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
  bazel: ["7.x", "8.x", "9.x"]
tasks:
  verify_targets:
    name: Verify build targets (defaults)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@gzip//..."
    test_targets:
      - "@gzip//..."
  # Build-only: the flag only drops _FILE_OFFSET_BITS=64, a no-op on the
  # 64-bit hosts above, so the tests would repeat the run above verbatim.
  verify_no_largefile:
    name: Verify build targets (--disable-largefile)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--@gzip//:largefile=false"
    build_targets:
      - "@gzip//..."
