matrix:
  platform:
    - ubuntu2404
    - macos_arm64
    - windows
  bazel:
    - 8.x
    - 9.x
    - rolling
tasks:
  verify_targets:
    name: Verify public target
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@logfmt_cpp//:logfmt_cpp'

bcr_test_module:
  module_path: e2e/bzlmod
  matrix:
    platform:
      - ubuntu2404
      - macos_arm64
      - windows
    bazel:
      - 8.x
      - 9.x
      - rolling
  tasks:
    run_consumer_test:
      name: Compile and run a downstream consumer
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - //:consumer_test
