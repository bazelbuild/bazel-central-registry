matrix:
  unix_platform:
    - debian11
    - debian13
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
  bazel: [8.x, 9.x, rolling]
tasks:
  # curl's default TLS backend (boringssl) needs C++17, as llm-cpp does.
  verify_targets_unix:
    name: Verify build targets (unix)
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_flags:
      - '--cxxopt=-std=c++17'
      - '--host_cxxopt=-std=c++17'
    build_targets:
      - '@mattbusel-llm-cpp//:mattbusel-llm-cpp'
      - '@mattbusel-llm-cpp//:package_metadata'
  verify_targets_windows:
    name: Verify build targets (windows)
    platform: windows
    bazel: ${{ bazel }}
    build_flags:
      - '--cxxopt=/std:c++17'
      - '--host_cxxopt=/std:c++17'
    build_targets:
      - '@mattbusel-llm-cpp//:mattbusel-llm-cpp'
      - '@mattbusel-llm-cpp//:package_metadata'
bcr_test_module:
  module_path: tests
  matrix:
    unix_platform:
      - debian11
      - debian13
      - ubuntu2204
      - ubuntu2404
      - macos
      - macos_arm64
    bazel: [8.x, 9.x, rolling]
  tasks:
    run_test_module_unix:
      name: Run test module (unix)
      platform: ${{ unix_platform }}
      bazel: ${{ bazel }}
      build_flags:
        - '--cxxopt=-std=c++17'
        - '--host_cxxopt=-std=c++17'
      test_flags:
        - '--cxxopt=-std=c++17'
        - '--host_cxxopt=-std=c++17'
      test_targets:
        - '//...'
    run_test_module_windows:
      name: Run test module (windows)
      platform: windows
      bazel: ${{ bazel }}
      build_flags:
        - '--cxxopt=/std:c++17'
        - '--host_cxxopt=/std:c++17'
      test_flags:
        - '--cxxopt=/std:c++17'
        - '--host_cxxopt=/std:c++17'
      test_targets:
        - '//...'
