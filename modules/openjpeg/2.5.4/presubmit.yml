matrix:
  platform:
    - ubuntu2404
    - ubuntu2404_arm64
    - macos_arm64
  bazel:
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Build OpenJPEG and run original sparse-array and JPEG 2000 tests
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@openjpeg//:openjp2'
    test_targets:
      - '@openjpeg//:sparse_array_test'
      - '@openjpeg//:empty_image_test'
