matrix:
  platform:
    - debian10
    - debian11
    - ubuntu2004
    - ubuntu2004_arm64
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
  bazel: [7.*, 8.*, 9.*, 10.*, rolling]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@ncurses"
  verify_ubuntu2404_clang:
    name: Verify build targets with clang
    platform: ubuntu2404
    bazel: ${{ bazel }}
    environment:
      CC: clang
    build_targets:
      - "@ncurses"
bcr_test_module:
  module_path: test
  matrix:
    platform:
      - debian11
      - ubuntu2004
      - ubuntu2004_arm64
      - ubuntu2404
      - macos
      - macos_arm64
    bazel: [8.*, 9.*, 10.*]
  tasks:
    run_test_module:
      name: Run test module with hermetic LLVM
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_flags:
        - "--experimental_remote_downloader="
      test_flags:
        - "--experimental_remote_downloader="
      test_targets:
        - "//..."
    cross_compile_on_linux:
      name: Cross-compile for Linux aarch64 with hermetic LLVM
      platform: ubuntu2004
      bazel: ${{ bazel }}
      build_flags:
        - "--experimental_remote_downloader="
        # The output directory otherwise doesn't depend on the target platform.
        - "--experimental_platform_in_output_dir"
        - "--platforms=@llvm//platforms:linux_aarch64"
      build_targets:
        - "//..."
    cross_compile_on_macos:
      name: Cross-compile for Linux x86_64 with hermetic LLVM
      platform: macos_arm64
      bazel: ${{ bazel }}
      build_flags:
        - "--experimental_remote_downloader="
        # The output directory otherwise doesn't depend on the target platform.
        - "--experimental_platform_in_output_dir"
        - "--platforms=@llvm//platforms:linux_x86_64"
      build_targets:
        - "//..."
