matrix:
  platform:
    - debian10
    - debian11
    - ubuntu2004
    - ubuntu2004_arm64
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
  bazel: [7.x, 8.x, 9.x, rolling]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@ncurses"
      - "@ncurses//:package_metadata"
  verify_ubuntu2404_clang:
    name: Verify build targets with clang
    platform: ubuntu2404
    bazel: ${{ bazel }}
    environment:
      CC: clang
    build_targets:
      - "@ncurses"
