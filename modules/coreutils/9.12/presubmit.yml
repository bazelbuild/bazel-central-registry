matrix:
  # coreutils builds with a POSIX shell and a GNU-compatible toolchain: Linux
  # and macOS, not Windows (configure.ac has no MSVC support either).
  platform:
    - debian11
    - ubuntu2204
    - ubuntu2204_arm64
    - ubuntu2404
    - macos
    - macos_arm64
  bazel: ["7.x", "8.x", "9.x"]
tasks:
  verify_targets:
    name: "Build every program and run the smoke test"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - "@coreutils//..."
