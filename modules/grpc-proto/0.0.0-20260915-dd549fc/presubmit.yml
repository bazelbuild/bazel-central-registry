matrix:
  unix_platform:
  - debian10
  - ubuntu2004
  - macos
  - macos_arm64
  windows_platform:
  - windows
  bazel:
  - 7.x
  - 8.x
  - 9.*
tasks:
  unix_verify_targets:
    name: Verify build targets
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--cxxopt=-std=c++17'
    - '--host_cxxopt=-std=c++17'
    build_targets:
    - '@grpc-proto//...'
  windows_verify_targets:
    name: Verify build targets
    platform: ${{ windows_platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--cxxopt=/std:c++17'
    - '--host_cxxopt=/std:c++17'
    build_targets:
    - '@grpc-proto//...'
