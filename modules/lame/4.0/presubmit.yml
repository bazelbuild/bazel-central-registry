matrix:
  platform:
    - ubuntu2404
    - ubuntu2404_arm64
    - macos_arm64
  bazel:
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Build LAME and its CLI and encode the upstream WAV regression fixture
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@lame//:lame'
      - '@lame//:lame_bin'
    test_targets:
      - '@lame//:upstream_wav_test'
      - '@lame//:lame_version_test'
      - '@lame//:lame_help_test'
      - '@lame//:lame_encode_test'
