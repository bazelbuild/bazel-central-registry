matrix:
  platform:
    - ubuntu2404
    - ubuntu2404_arm64
    - macos_arm64
  bazel:
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Build LAME and encode its upstream WAV regression fixture
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@lame//:lame'
    test_targets:
      - '@lame//:upstream_wav_test'
