bcr_test_module:
  module_path: examples/smoke
  matrix:
    bazel: ['9.x']
  tasks:
    linux_amd64_musl:
      platform: ubuntu2404
      bazel: ${{ bazel }}
      test_flags: ['--config=musl_x86_64']
      test_targets: ['//...']
    linux_arm64_musl:
      platform: ubuntu2404_arm64
      bazel: ${{ bazel }}
      test_flags: ['--config=musl_aarch64']
      test_targets: ['//...']
    linux_amd64_glibc:
      platform: ubuntu2404
      bazel: ${{ bazel }}
      test_flags: ['--config=glibc_x86_64']
      test_targets: ['//...']
    linux_arm64_glibc:
      platform: ubuntu2404_arm64
      bazel: ${{ bazel }}
      test_flags: ['--config=glibc_aarch64']
      test_targets: ['//...']
