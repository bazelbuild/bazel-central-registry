matrix:
  platform:
    - debian13
    - ubuntu2404
  bazel:
    - 9.x
    - 8.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      # Needed until cel-spec includes explicit protobuf rule loads (cel-expr/cel-spec#508).
      - '--incompatible_autoload_externally=proto_library,cc_proto_library,java_proto_library'
    build_targets:
      - '@cel-conformance//...'
