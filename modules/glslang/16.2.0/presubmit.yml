matrix:
  platform:
    - debian13
    - ubuntu2404
    - macos
    - macos_arm64
    - windows
  bazel:
    - 8.x
    - 9.x
    - rolling
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@glslang//:glslang"
      - "@glslang//:SPIRV"
      - "@glslang//:glslang-default-resource-limits"
      - "@glslang//:glslang_validator"
