matrix:
  platform: [ubuntu2204]
  bazel: ["7.6.1", "8.8.1"]
tasks:
  verify_targets:
    name: Verify generated C++ and Python messages
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - --jobs=2
    build_targets:
    - "@wheelos_msgs//wheelos_msgs:wheelos_msgs_cc_proto"
    - "@wheelos_msgs//wheelos_msgs:wheelos_msgs_py"
