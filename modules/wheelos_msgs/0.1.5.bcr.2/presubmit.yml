matrix:
  platform:
  - ubuntu2204
  - ubuntu2004
  - windows
  bazel: [6.x, 7.x, 8.x]

tasks:
  verify_targets:
    name: Verify C++ and Python targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@wheelos_msgs//wheelos_msgs:wheelos_msgs_cc_proto'
    - '@wheelos_msgs//wheelos_msgs:wheelos_msgs_py'
    - '@wheelos_msgs//wheelos_msgs/audio_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/basic_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/chassis_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/config_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/control_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/dreamview_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/drivers_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/guardian_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/localization_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/map_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/mission_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/monitor_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/perception_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/planning_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/prediction_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/routing_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/sensor_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/simulation_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/storytelling_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/transform_msgs:all'
    - '@wheelos_msgs//wheelos_msgs/v2x_msgs:all'
