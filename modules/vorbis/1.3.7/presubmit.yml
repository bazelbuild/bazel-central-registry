matrix:
  platform:
    - ubuntu2404
    - ubuntu2404_arm64
    - macos_arm64
  bazel:
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Build Vorbis libraries and run upstream tests
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@vorbis//:vorbis'
      - '@vorbis//:vorbisenc'
      - '@vorbis//:vorbisfile'
    test_targets:
      - '@vorbis//:codec_roundtrip_test'
      - '@vorbis//:sharedbook_test'
