matrix:
  platform: ["debian11", "macos", "ubuntu2204", "windows"]
  bazel: ["9.x"]
tasks:
  verify_targets:
    name: "Build and test the plugin"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@rules_dart_gazelle_plugin//dart"
    test_targets:
      - "@rules_dart_gazelle_plugin//dart:dart_test"
