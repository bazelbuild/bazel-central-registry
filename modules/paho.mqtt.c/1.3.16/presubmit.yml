matrix:
  platform: [debian13, ubuntu2404, macos, macos_arm64]
  ssl_lib: [boringssl, openssl]
  bazel: [7.x, 8.x, 9.*]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags: ["--cxxopt=-std=c++17", "--@paho.mqtt.c//:ssl_lib=${{ ssl_lib }}"]
    build_targets: ["@paho.mqtt.c//..."]
