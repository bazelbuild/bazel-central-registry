bcr_test_module:
  module_path: "test_module"
  matrix:
    bazel: [7.x, 8.x, 9.x]
    platform:
      - macos
      - macos_arm64
      - ubuntu2204
      - ubuntu2404
      - windows
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
matrix:
  bazel: [7.x, 8.x, 9.x]
  platform:
    - macos
    - macos_arm64
    - ubuntu2204
    - ubuntu2404
    - windows
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@meshoptimizer//:meshoptimizer"
