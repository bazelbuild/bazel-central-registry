matrix:
  platform:
    - debian13
    - macos
    - macos_arm64
    - ubuntu2404
    - ubuntu2404_arm64
    - windows
  unix_platform:
    - debian13
    - macos
    - macos_arm64
    - ubuntu2404
    - ubuntu2404_arm64
  bazel:
    - rolling
    - 9.x
    - 8.x
    - 7.x
    - 7.4.0  # bazel_compatibility floor
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@mediainfo//:mediainfo"
      - "@mediainfo//:analyze_test"
  run_tests:
    # Not Windows: analyze_test opens its runfile by relative path.
    name: Run test targets
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    test_targets:
      - "@mediainfo//:analyze_test"
bcr_test_module:
  module_path: test
  matrix:
    platform:
      - debian13
      - macos
      - macos_arm64
      - ubuntu2404
      - ubuntu2404_arm64
      - windows
    bazel:
      - rolling
      - 9.x
      - 8.x
      - 7.x
      - 7.4.0
  tasks:
    run_tests:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
