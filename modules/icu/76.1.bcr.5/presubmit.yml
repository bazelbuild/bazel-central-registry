matrix:
  unix_platform:
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
  bazel: [7.x, 8.x, 9.x]
tasks:
  verify_targets_unix:
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--cxxopt=-std=c++20"
    build_targets:
      - "@icu//..."
    test_flags:
      - "--cxxopt=-std=c++20"
    test_targets:
      - "@icu//..."
  verify_targets_windows:
    platform: windows
    bazel: ${{ bazel }}
    build_flags:
      - "--cxxopt=/std:c++20"
    build_targets:
      - "@icu//..."
    test_flags:
      - "--cxxopt=/std:c++20"
    test_targets:
      - "@icu//..."
