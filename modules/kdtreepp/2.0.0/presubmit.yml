matrix:
  platform: [ubuntu2404, macos_arm64]
  bazel: ["9.*"]
tasks:
  verify_targets:
    name: Verify library and regression tests
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags: ["--cxxopt=-std=c++17"]
    build_targets: ["@kdtreepp//:kdtreepp"]
    test_targets: ["@kdtreepp//:regression_test"]
