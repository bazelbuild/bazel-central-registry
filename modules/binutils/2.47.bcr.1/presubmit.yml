# Every target is built for the Bazel target platform, selected on the
# @platforms os/cpu pair; there is no host/target flag.  The lists below are
# explicit because `//...` would include the programs a platform does not
# build (as/ld/gprof on Darwin, the PE tools everywhere but Windows), which
# fail with the ordinary no-matching-select error rather than being skipped.
#
# No Windows lane: binutils is GNU C that only GCC and Clang compile, and the
# BCR runners carry no mingw toolchain.
matrix:
  linux_platform:
  - debian11
  - ubuntu2004
  - ubuntu2004_arm64
  - ubuntu2204
  - ubuntu2404
  macos_platform:
  - macos
  - macos_arm64
  bazel: [7.x, 8.x, 9.x]
tasks:
  verify_targets_linux:
    name: Verify build targets
    platform: ${{ linux_platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@binutils//:addr2line'
    - '@binutils//:ar'
    - '@binutils//:as'
    - '@binutils//:c++filt'
    - '@binutils//:elfedit'
    - '@binutils//:gprof'
    - '@binutils//:ld'
    - '@binutils//:nm'
    - '@binutils//:objcopy'
    - '@binutils//:objdump'
    - '@binutils//:ranlib'
    - '@binutils//:readelf'
    - '@binutils//:size'
    - '@binutils//:strings'
    - '@binutils//:strip'
    test_targets:
    - '@binutils//tests:smoke_test'
  verify_targets_macos:
    name: Verify build targets
    platform: ${{ macos_platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@binutils//:addr2line'
    - '@binutils//:ar'
    - '@binutils//:c++filt'
    - '@binutils//:elfedit'
    - '@binutils//:nm'
    - '@binutils//:objcopy'
    - '@binutils//:objdump'
    - '@binutils//:ranlib'
    - '@binutils//:readelf'
    - '@binutils//:size'
    - '@binutils//:strings'
    - '@binutils//:strip'
    test_targets:
    - '@binutils//tests:smoke_test'
  verify_options:
    name: Verify build targets (non-default options)
    platform: ${{ linux_platform }}
    bazel: ${{ bazel }}
    build_flags: &options
    - '--@binutils//:enable_relro=no'
    - '--@binutils//:with_zstd=False'
    - '--@binutils//:enable_libctf=False'
    - '--@binutils//:enable_plugins=no'
    - '--@binutils//:prefix=/opt/binutils'
    - '--@binutils//:with_sysroot=/opt/binutils/sysroot'
    - '--@binutils//:enable_compressed_debug_sections=none'
    - '--@binutils//:enable_default_hash_style=gnu'
    - '--@binutils//:enable_deterministic_archives=True'
    - '--@binutils//:enable_64_bit_bfd=True'
    test_flags: *options
    build_targets:
    - '@binutils//:as'
    - '@binutils//:ld'
    - '@binutils//:objdump'
    test_targets:
    - '@binutils//tests:smoke_test'
