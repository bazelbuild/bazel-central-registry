matrix:
  unix_platform:
    - debian10
    - debian11
    - macos
    - macos_arm64
    - ubuntu2004
    - ubuntu2204
    - ubuntu2404
  bazel: [8.x, 9.x, rolling]
tasks:
  unix_verify_targets:
    name: Verify build targets for unix
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_flags:
      - '--process_headers_in_dependencies'
      - --cxxopt=-std=c++20
    build_targets:
      - '@boost.context//:boost.context'
  windows_verify_targets:
    name: Verify build targets for windows
    platform: windows
    bazel: ${{ bazel }}
    build_flags:
      - '--process_headers_in_dependencies'
      - --cxxopt=/std:c++20
    build_targets:
      - '@boost.context//:boost.context'
