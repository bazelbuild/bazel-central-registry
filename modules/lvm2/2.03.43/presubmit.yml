matrix:
  # libdm drives the Linux device-mapper ioctl interface; there is no other
  # kernel it builds for.
  platform:
  - debian11
  - ubuntu2004
  - ubuntu2004_arm64
  - ubuntu2204
  - ubuntu2404
  bazel: [7.x, 8.x, 9.x]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@lvm2//...'
    test_targets:
    - '@lvm2//...'
