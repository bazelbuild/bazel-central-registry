matrix:
  platform:
    - macos
    - ubuntu2404
    - windows
  bazel:
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@occt//:occt"
bcr_test_module:
  module_path: bcr_test
  matrix:
    platform:
      - macos
      - ubuntu2404
      - windows
    bazel:
      - 8.x
      - 9.x
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
