matrix:
  platform:
  - debian12
  - ubuntu2404
  bazel:
  - 9.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--cxxopt=-std=c++17'
    - '--host_cxxopt=-std=c++17'
    build_targets:
    - '@openfst//openfst/lib'
    - '@openfst//openfst/lib:lib_lite'
    - '@openfst//openfst/compat:compat'
    - '@openfst//openfst/extensions/far:lib'
    - '@openfst//openfst/script'
    - '@openfst//openfst/bin:fstcompile'
