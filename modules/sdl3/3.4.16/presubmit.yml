matrix:
  platform:
    - ubuntu2004
    - ubuntu2204
    - ubuntu2404
    - ubuntu2404_arm64
    - debian11
    - macos
    - macos_arm64
    - windows
    - windows_arm64
  bazel:
    - 7.x
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@sdl3//...'
    test_targets:
      - '@sdl3//...'
bcr_test_module:
  module_path: test_module
  matrix:
    platform:
      - ubuntu2004
      - ubuntu2204
      - ubuntu2404
      - ubuntu2404_arm64
      - debian11
      - macos
      - macos_arm64
      - windows
      - windows_arm64
    bazel:
      - 7.x
      - 8.x
      - 9.x
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - '//...'
      test_targets:
        - '//...'
