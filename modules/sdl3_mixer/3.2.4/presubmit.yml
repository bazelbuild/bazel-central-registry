matrix:
  platform:
  - ubuntu2204
  - ubuntu2404
  - ubuntu2404_arm64
  - debian11
  - macos
  - macos_arm64
  - windows
  - windows_arm64
  bazel: [7.x, 8.x, 9.x, rolling]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@sdl3_mixer//:sdl3_mixer'
      - '@sdl3_mixer//:sdl3_mixer_headers'
      - '@sdl3_mixer//:testaudiodecoder'
      - '@sdl3_mixer//:testmixer'
      - '@sdl3_mixer//:testspatialization'
      - '@sdl3_mixer//:sdl3_mixer_headers_consumer_compile_test'
      - '@sdl3_mixer//:sdl3_mixer_consumer_link_test'
    test_targets:
      # Testcases shipped with SDL are not designed for integrated environments.
      #- '@sdl3_mixer//:testaudiodecoder'
      #- '@sdl3_mixer//:testmixer'
      #- '@sdl3_mixer//:testspatialization'
      - '@sdl3_mixer//:sdl3_mixer_headers_consumer_compile_test'
      - '@sdl3_mixer//:sdl3_mixer_consumer_link_test'
