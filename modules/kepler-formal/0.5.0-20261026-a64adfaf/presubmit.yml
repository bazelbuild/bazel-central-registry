matrix:
  platform: ["debian13", "ubuntu2204", "ubuntu2404", "macos_arm64"]
  bazel: ["8.x", "9.x"]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--cxxopt=-std=c++20"
      - "--host_cxxopt=-std=c++20"
    build_targets:
      - "@kepler-formal//src/bin:kepler-formal"
bcr_test_module:
  module_path: "bcr_test"
  matrix:
    platform: ["debian13", "ubuntu2204", "ubuntu2404", "macos_arm64"]
    bazel: ["8.x", "9.x"]
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_flags:
        - "--cxxopt=-std=c++20"
        - "--host_cxxopt=-std=c++20"
      test_flags:
        - "--cxxopt=-std=c++20"
        - "--host_cxxopt=-std=c++20"
      test_targets:
        - "//:version_test"
