---
bcr_test_module:
  # Relative to the module root after `strip_prefix`, so the module is
  # its own test module.
  module_path: "."
  matrix:
    # rules_oci does not work on the windows BCR runners. See
    # https://github.com/periareon/rules_helm/issues/53
    platform: ["macos_arm64", "ubuntu2004"]
    bazel: ["7.x", "8.x"]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "--"
        - "//..."
