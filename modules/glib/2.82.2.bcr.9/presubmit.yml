build_targets: &build_targets
- '@glib//gio'
- '@glib//gio:glib_compile_resources'
- '@glib//glib'
- '@glib//gmodule'
- '@glib//gobject'

test_targets: &test_targets
- '@glib//glib/tests/...'

matrix:
  linux_platform: [debian10, debian11, ubuntu2004, ubuntu2204]
  osx_platform: [macos, macos_arm64]
  bazel: [9.x, 8.x, 7.x]
tasks:
  verify_linux_targets:
    name: Verify linux build targets
    platform: ${{ linux_platform }}
    bazel: ${{ bazel }}
    build_targets: *build_targets
    test_targets: *test_targets
  verify_osx_targets:
    name: Verify osx build targets
    platform: ${{ osx_platform }}
    bazel: ${{ bazel }}
    build_targets: *build_targets
    build_flags: ["--repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1"]
    test_targets: *test_targets
    test_flags: ["--repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1"]
