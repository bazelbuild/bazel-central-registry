matrix:
  platform:
    - macos
    - macos_arm64
    - windows
  bazel: [9.x, rolling]
tasks:
  verify_targets:
    name: Verify Catch3 build and tests
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@catch3//:catch2'
      - '@catch3//:catch2_main'
      - '@catch3//src/Progmasoft:catch3'
    test_targets:
      - '@catch3//tests/Progmasoft:property_tests'
