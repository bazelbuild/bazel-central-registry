matrix:
  platform:
    - debian11
    - ubuntu2004
    - ubuntu2004_arm64
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
    - windows
  bazel: ["7.x", "8.x", "9.x"]
tasks:
  verify_targets:
    name: Verify public library targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@zpaq//:libzpaq"
      - "@zpaq//:zpaq"
      - "@zpaq//:zpaq_cli"

bcr_test_module:
  module_path: test/bcr
  matrix:
    platform:
      - debian11
      - ubuntu2004
      - ubuntu2004_arm64
      - ubuntu2204
      - ubuntu2404
      - macos
      - macos_arm64
      - windows
    bazel: ["7.x", "8.x", "9.x"]
  tasks:
    run_consumer_tests:
      name: Run libzpaq consumer tests
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//:error_hook_test"
        - "//:round_trip_test"
