matrix:
  platform:
  - debian12
  - debian13
  - ubuntu2204
  - ubuntu2404
  bazel:
  - 9.x
  - 8.x
  - 7.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--cxxopt=-std=c++17'
    - '--host_cxxopt=-std=c++17'
    build_targets:
    - '@kokkos//:kokkos'

# CPU-only smoke test (no GPU or CUDA toolkit needed): runs kernels and a
# container on the module's default host backend.
bcr_test_module:
  module_path: tests
  matrix:
    platform:
    - debian12
    - debian13
    - ubuntu2204
    - ubuntu2404
    bazel:
    - 9.x
    - 8.x
    - 7.x
  tasks:
    run_test_module:
      name: Run Kokkos smoke test
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_flags:
      - '--cxxopt=-std=c++17'
      - '--host_cxxopt=-std=c++17'
      - '--test_output=errors'
      test_targets:
      - '//:kokkos_smoke'
