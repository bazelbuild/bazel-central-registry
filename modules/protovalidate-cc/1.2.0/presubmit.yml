bcr_test_module:
  module_path: "e2e/bzlmod"
  matrix:
    # debian11 is the oldest Linux platform supported by the latest abseil-cpp.
    platform: [ "debian11", "macos" ]
    # TODO: Add 9.x after updating cel-cpp and removing backport patch
    # for 9.x support.
    bazel: [ 8.x ]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      environment:
        # Dependencies pull in Android SDK automatically despite not being
        # used. It can cause issues with BCR presubmit workers so clear
        # the variables to prevent fetching it.
        ANDROID_HOME: ""
        ANDROID_NDK_HOME: ""
      test_targets:
      - "//..."
