matrix:
  platform:
    - debian10
    - debian11
    - ubuntu2204
    - ubuntu2204_arm64
    - macos
    - macos_arm64
  bazel:
    - 7.x
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@libssh2//..."
  verify_mbedtls:
    name: Verify build targets (--crypto=mbedtls)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--@libssh2//:crypto=mbedtls"
    build_targets:
      - "@libssh2//..."
  # The example programs (example/) are POSIX-only upstream; the library is
  # what Windows builds.
  verify_windows:
    name: Verify build targets (windows)
    platform: windows
    bazel: ${{ bazel }}
    build_targets:
      - "@libssh2//:ssh2"
      - "@libssh2//:libssh2"
