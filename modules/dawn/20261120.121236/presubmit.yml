matrix:
  bazel:
    - 9.x
tasks:
  verify_targets:
    name: Build native Dawn with D3D11 and D3D12
    platform: windows
    bazel: ${{ bazel }}
    build_targets:
      - '@dawn//:dawn'
      - '@dawn//:webgpu_dawn'
      - '@dawn//:package_metadata'

bcr_test_module:
  module_path: bcr_tests
  matrix:
    bazel:
      - 9.x
  tasks:
    run_test_module:
      name: Link and initialize native Dawn without a GPU
      platform: windows
      bazel: ${{ bazel }}
      build_targets:
        - //:native_smoke_test
      test_targets:
        - //:native_smoke_test
