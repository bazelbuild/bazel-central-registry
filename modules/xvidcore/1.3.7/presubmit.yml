matrix:
  platform:
    - ubuntu2404
    - ubuntu2404_arm64
    - macos_arm64
  bazel:
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Build portable Xvid and run its original bitstream unit test
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@xvidcore//:xvidcore'
    test_targets:
      - '@xvidcore//:bitstream_test'
