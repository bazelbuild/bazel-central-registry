matrix:
  platform:
  - debian12
  - debian13
  - ubuntu2204
  - ubuntu2404
  - macos_arm64
  bazel:
  - rolling
  - 9.x
  - 8.x
  - 7.x
tasks:
  verify_targets:
    name: Verify library targets with default BoringSSL
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - '--cxxopt=-std=c++17'
    build_targets:
      - '@zchunk//:zchunk'
      - '@zchunk//:zck'
  verify_targets_with_openssl:
    name: Verify library targets with OpenSSL
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - '--@zchunk//:ssl_lib=openssl'
    build_targets:
      - '@zchunk//:zchunk'
      - '@zchunk//:zck'
