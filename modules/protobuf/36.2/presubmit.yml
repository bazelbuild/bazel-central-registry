# LINT.IfChange(bcr_presubmit)
bcr_test_module:
  module_path: examples
  matrix:
    platform: ["debian12", "macos_arm64", "ubuntu2404", "windows"]
    bazel: [8.x, 9.x]

  tasks:
    verify_targets:
      name: "Verify build targets"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
      - '//...'
      - '@com_google_protobuf//:protobuf'
      - '@com_google_protobuf//:protobuf_lite'
      - '@com_google_protobuf//:protobuf_python'
      - '@com_google_protobuf//:protobuf_java'
      - '@com_google_protobuf//:protoc'
      - '@com_google_protobuf//:test_messages_proto2_cc_proto'
      - '@com_google_protobuf//:test_messages_proto3_cc_proto'
# LINT.ThenChange(<ROOT_DIR>/.bazelci/presubmit.yml)

# Test config for the BCR Downstream Test, see
# https://github.com/bazelbuild/continuous-integration/pull/2875
bcr_downstream_test:
  select_top_bcr_modules: 6
  exclude_dev_deps: true
  smoke_test_percentage: 50
  use_bazel_version: 8.x
  # Overrides select_top_bcr_modules and exclude_dev_deps when set.
  # module_selections: ["grpc@latest", "rules_go@latest"]
