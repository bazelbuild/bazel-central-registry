matrix:
  platform:
  - debian10
  - ubuntu2004
  - macos
  - macos_arm64
  - windows
  bazel:
  - rolling
  - 8.x
  - 7.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@zlib//:zlib'
bcr_test_module:
  module_path: test/bcr
  matrix:
    platform:
    - debian10
    - ubuntu2004
    - macos
    - macos_arm64
    - windows
    unix_platform:
    - debian10
    - ubuntu2004
    - macos
    - macos_arm64
    bazel:
    - rolling
    - 8.x
    - 7.x
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
      - //...
    run_test_module_external_include_paths:
      name: Run test module with external_include_paths
      platform: ${{ unix_platform }}
      bazel: ${{ bazel }}
      test_flags:
      - --features=external_include_paths
      test_targets:
      - //...
    # The MSVC toolchains of Bazel 7 and 8 pass /external:I without
    # /external:W0, which makes cl.exe ignore the include paths.
    run_test_module_external_include_paths_windows:
      name: Run test module with external_include_paths
      platform: windows
      bazel: rolling
      test_flags:
      - --features=external_include_paths
      test_targets:
      - //...
    run_test_module_layering_check:
      name: Run test module with layering_check
      platform: ubuntu2404
      bazel: ${{ bazel }}
      environment:
        CC: clang
      test_flags:
      - --features=layering_check
      test_targets:
      - //...
    run_test_module_layering_check_external_include_paths:
      name: Run test module with layering_check and external_include_paths
      platform: ubuntu2404
      bazel: ${{ bazel }}
      environment:
        CC: clang
      test_flags:
      - --features=layering_check
      - --features=external_include_paths
      test_targets:
      - //...
