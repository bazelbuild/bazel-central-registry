matrix:
  platform: ["ubuntu2004"]
  bazel: ["7.x", "8.x", "9.x"]
tasks:
  verify:
    name: "Build gavel_tools_go"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    # Loading the package evaluates the module's aspect (or macro) definitions, so
    # this fails if its ruleset, linter binaries or gavel_tools do not resolve.
    build_targets:
      - "@gavel_tools_go//lint/aspects:defs.bzl"
