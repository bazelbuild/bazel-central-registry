matrix:
  platform:
    - debian13
    - ubuntu2204
    - ubuntu2404
  bazel: [7.x, 8.x, 9.x, rolling]
  hermetic_llvm_platform:
    - ubuntu2404
    - ubuntu2404_arm64
  # The other tasks already cover every Bazel version with the default
  # toolchains, so test hermetic LLVM on 9.x only to keep CI load down.
  hermetic_llvm_bazel: [9.x]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@wayland-protocols//...'
  verify_targets_hermetic_llvm:
    name: Verify build targets (hermetic llvm)
    platform: ${{ hermetic_llvm_platform }}
    bazel: ${{ hermetic_llvm_bazel }}
    setup:
      - echo 'bazel_dep(name = "llvm", version = "0.8.27")' >> MODULE.bazel
    build_flags:
      - '--repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1'
      - '--repo_env=BAZEL_NO_APPLE_CPP_TOOLCHAIN=1'
      - '--extra_toolchains=@llvm//toolchain:all'
    build_targets:
      - '@wayland-protocols//...'

bcr_test_module:
  module_path: tests
  matrix:
    platform: [debian13, ubuntu2204, ubuntu2404]
    bazel: [7.x, 8.x, 9.x, rolling]
    hermetic_llvm_platform: [ubuntu2404, ubuntu2404_arm64]
    # The other tasks already cover every Bazel version with the default
    # toolchains, so test hermetic LLVM on 9.x only to keep CI load down.
    hermetic_llvm_bazel: [9.x]
  tasks:
    run_tests:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets: ['//...']
    run_tests_hermetic_llvm:
      name: Run test module (hermetic llvm)
      platform: ${{ hermetic_llvm_platform }}
      bazel: ${{ hermetic_llvm_bazel }}
      setup:
        - echo 'bazel_dep(name = "llvm", version = "0.8.27")' >> MODULE.bazel
      test_flags:
        - '--repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1'
        - '--repo_env=BAZEL_NO_APPLE_CPP_TOOLCHAIN=1'
        - '--extra_toolchains=@llvm//toolchain:all'
      test_targets: ['//...']
