matrix:
  platform:
  - ubuntu2204
  - ubuntu2404
  - macos
  - macos_arm64
  # aw-backtrace needs glibc 2.35+, so it's disabled on these.
  old_glibc_platform:
  - debian10
  - ubuntu2004
  bazel:
  - 8.x
  - 9.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@gperftools//:cpu_profiler'
    - '@gperftools//:tcmalloc'
  verify_targets_without_aw_backtrace:
    name: Verify build targets without aw-backtrace
    platform: ${{ old_glibc_platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--@gperftools//:enable_aw_backtrace=false'
    build_targets:
    - '@gperftools//:cpu_profiler'
    - '@gperftools//:tcmalloc'
