# Build public API targets in an anonymous consumer module.
matrix:
  platform: [debian11, ubuntu2204, macos, macos_arm64, windows]
  bazel: [7.x, 8.x, 9.x]
tasks:
  verify_targets:
    name: Verify public API targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@betacalendars_calendar_fixtures//:public_api'
      - '@betacalendars_calendar_fixtures//calendar:api_docs'

# Also build the maintained consumer example under each supported configuration.
bcr_test_module:
  module_path: examples/bcr
  matrix:
    platform: [debian11, ubuntu2204, macos, macos_arm64, windows]
    bazel: [7.x, 8.x, 9.x]
  tasks:
    run_test_module:
      name: Build public consumer examples
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - //:all
