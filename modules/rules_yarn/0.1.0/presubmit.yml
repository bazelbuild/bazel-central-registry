bcr_test_module:
  module_path: "tests/bcr"
  matrix:
    # Linux and macOS are the platforms this ruleset claims. Windows is not,
    # because the launcher is a Bash script.
    platform: ["debian10", "ubuntu2004", "macos"]
    # The oldest line MODULE.bazel accepts, and the one it is developed on.
    bazel: [8.x, 9.x]
  tasks:
    run_test_module:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
