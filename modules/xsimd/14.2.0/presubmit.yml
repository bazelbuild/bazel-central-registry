matrix:
  platform:
    - debian11
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
    - windows
  bazel: [7.x, 8.x, 9.x, rolling]
tasks:
  verify_targets:
    name: Verify xsimd build target
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@xsimd//:xsimd"
bcr_test_module:
  module_path: test
  matrix:
    platform:
      - debian11
      - ubuntu2204
      - ubuntu2404
      - macos
      - macos_arm64
      - windows
    bazel: [7.x, 8.x, 9.x, rolling]
  tasks:
    run_test_module:
      name: Compile and run xsimd SIMD operations
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - //:xsimd_test
      test_targets:
        - //:xsimd_test
