matrix:
  platform:
    - ubuntu2404
    - ubuntu2404_arm64
    - macos_arm64
  bazel:
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Build TwoLAME and verify its upstream MPEG frame fixture
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@twolame//:twolame'
    test_targets:
      - '@twolame//:simplefrontend_test'
