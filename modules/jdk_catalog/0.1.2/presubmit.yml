bcr_test_module:
  module_path: examples/consuming
  matrix:
    platform: [ubuntu2404, macos, windows]
    bazel: [9.3.0]
  tasks:
    toolchain_test:
      name: Verify Java 27 compiler and runtime
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_flags:
        - --config=java27
      build_targets:
        - //:hello
      test_flags:
        - --config=java27
      test_targets:
        - //:toolchain_test
