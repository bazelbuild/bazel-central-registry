matrix:
  platform:
    - debian13
    - ubuntu2404
    - macos
    - macos_arm64
    - windows
  bazel:
    - 8.x
    - 9.x
    - rolling
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@vulkan_memory_allocator//:vulkan_memory_allocator"

# The library is header-only; the test module compiles and runs its implementation.
bcr_test_module:
  module_path: tests
  matrix:
    platform:
      - debian13
      - ubuntu2404
      - macos
      - macos_arm64
      - windows
    bazel:
      - 8.x
      - 9.x
      - rolling
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - //...
      test_targets:
        - //...
