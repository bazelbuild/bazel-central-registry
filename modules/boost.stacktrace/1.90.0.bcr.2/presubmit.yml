matrix:
  bazel: [7.x, 8.x, 9.x, rolling]
tasks:
  test_auto_debian13:
    name: Test automatic backend on Debian
    platform: debian13
    bazel: ${{ bazel }}
    test_targets:
      - '@boost.stacktrace//test:backend_test'
  test_auto_macos_arm64:
    name: Test automatic backend on macOS arm64
    platform: macos_arm64
    bazel: ${{ bazel }}
    test_targets:
      - '@boost.stacktrace//test:backend_test'
  test_auto_ubuntu2404:
    name: Test automatic backend on Ubuntu
    platform: ubuntu2404
    bazel: ${{ bazel }}
    test_targets:
      - '@boost.stacktrace//test:backend_test'
  test_auto_ubuntu2404_arm64:
    name: Test automatic backend on Ubuntu arm64
    platform: ubuntu2404_arm64
    bazel: ${{ bazel }}
    test_targets:
      - '@boost.stacktrace//test:backend_test'
  test_auto_windows:
    name: Test automatic backend on Windows
    platform: windows
    bazel: ${{ bazel }}
    test_targets:
      - '@boost.stacktrace//test:backend_test'
  test_basic:
    name: Test basic backend
    platform: ubuntu2404
    bazel: ${{ bazel }}
    test_flags:
      - '--@boost.stacktrace//:backend=basic'
    test_targets:
      - '@boost.stacktrace//test:backend_test'
  test_libbacktrace:
    name: Test libbacktrace backend
    platform: ubuntu2404
    bazel: ${{ bazel }}
    test_flags:
      - '--@boost.stacktrace//:backend=libbacktrace'
    test_targets:
      - '@boost.stacktrace//test:backend_test'
  test_addr2line:
    name: Test addr2line backend
    platform: ubuntu2404
    bazel: ${{ bazel }}
    test_flags:
      - '--@boost.stacktrace//:backend=addr2line'
    test_targets:
      - '@boost.stacktrace//test:backend_test'
  test_noop:
    name: Test no-op backend
    platform: ubuntu2404
    bazel: ${{ bazel }}
    test_flags:
      - '--@boost.stacktrace//:backend=noop'
    test_targets:
      - '@boost.stacktrace//test:backend_test'
  test_windbg:
    name: Test WinDbg backend
    platform: windows
    bazel: ${{ bazel }}
    test_flags:
      - '--@boost.stacktrace//:backend=windbg'
    test_targets:
      - '@boost.stacktrace//test:backend_test'
  test_windbg_cached:
    name: Test cached WinDbg backend
    platform: windows
    bazel: ${{ bazel }}
    test_flags:
      - '--@boost.stacktrace//:backend=windbg_cached'
    test_targets:
      - '@boost.stacktrace//test:backend_test'
