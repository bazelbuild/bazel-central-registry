matrix:
  unix_platform:
    - debian11
    - debian12
    - debian13
    - macos
    - macos_arm64
    - ubuntu2204
    - ubuntu2404
  windows_platform:
    - windows
  bazel: ["8.x", "9.x"]
tasks:
  unix_verify_targets:
    name: Verify unix build targets
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--cxxopt=-std=c++17'
    - '--host_cxxopt=-std=c++17'
    build_targets:
    - '@opentelemetry-cpp//api'
  windows_verify_targets:
    name: Verify windows build targets
    platform: ${{ windows_platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--cxxopt=/std:c++17'
    - '--host_cxxopt=/std:c++17'
    build_targets:
    - '@opentelemetry-cpp//api'
