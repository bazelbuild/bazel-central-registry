matrix:
  bazel:
    - 7.x
    - 8.x
    - 9.x
  platform:
    - ubuntu2404
    - macos_arm64
    - windows
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@mboworks_bzl//bzl/paths"
      - "@mboworks_bzl//bzl/runfiles"
      - "@mboworks_bzl//bzl/versions"

bcr_test_module:
  module_path: .
  matrix:
    bazel:
      - 7.x
      - 8.x
      - 9.x
    platform:
      - ubuntu2404
      - macos_arm64
      - windows
  tasks:
    test_release:
      name: Test release with development dependencies
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
