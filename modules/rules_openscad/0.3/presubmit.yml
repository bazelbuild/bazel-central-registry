matrix:
  platform:
  - debian10
  - ubuntu2004
  - macos
  - macos_arm64
  - windows
  bazel:
  - 7.x
  - 8.x
  - 9.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@rules_openscad//:scad_unittest'
    - '@rules_openscad//:scad_utils'
bcr_test_module:
  module_path: test_models
  matrix:
    platform:
    - debian10
    - ubuntu2004
    - macos
    - macos_arm64
    - windows
    bazel:
    - 7.x
    - 8.x
    - 9.x
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
      # Only build libraries, as we cannot run openscad in test platforms. Also, don't run any test targets
      - //:cylinder_section
      - //:hardware
      - //:hollow_cylinder
