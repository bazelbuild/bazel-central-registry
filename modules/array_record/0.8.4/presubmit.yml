matrix:
  platform:
    - debian11
    - ubuntu2204
    - macos
    - macos_arm64
  bazel:
    - 7.x
tasks:
  verify_targets:
    name: Verify build and test targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    # BCR runs `verify_targets` from a temporary anonymous root module, so any
    # module-local `.bazelrc` is ignored. Explicitly pass C++17 flags required
    # by abseil-cpp, protobuf, and riegeli.
    build_flags:
      - --cxxopt=-std=c++17
      - --host_cxxopt=-std=c++17
    test_flags:
      - --cxxopt=-std=c++17
      - --host_cxxopt=-std=c++17
    # External consumers without an explicit `repo_name` override resolve this
    # module under its module name (`@array_record`), not `com_google_array_record`.
    build_targets:
      - '@array_record//cpp/...'
      - '@array_record//python/...'
    test_targets:
      - '@array_record//cpp/...'
      - '@array_record//python/...'
