matrix:
  platform:
  - debian13
  - ubuntu2404
  - ubuntu2204
  bazel:
  - rolling
  - 9.x
  - 8.x
  - 7.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--cxxopt=-std=c++17'
    build_targets: &build_targets
    - '@jwt-cpp'
    - '@jwt-cpp//example:rsa_create'
    - '@jwt-cpp//example:rsa_verify'
  verify_targets_with_openssl:
    name: Verify build targets with OpenSSL
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--@jwt-cpp//:ssl_lib=openssl'
    build_targets: *build_targets
