matrix:
  # No Windows: upstream builds there only under mingw/cygwin, and gnulib's
  # mingw branches do not compile with the MSVC-based toolchains presubmit
  # provides (see the platform note in overlay/BUILD.bazel).
  platform:
    - debian11
    - ubuntu2004
    - ubuntu2004_arm64
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
  bazel: ["7.x", "8.x", "9.x"]
tasks:
  verify_targets:
    name: Verify build targets (defaults)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@wget2//..."
    test_targets:
      - "@wget2//..."
  verify_no_tls:
    name: Verify build targets (--ssl=none)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--@wget2//:ssl=none"
    test_flags:
      - "--@wget2//:ssl=none"
    build_targets:
      - "@wget2//..."
    test_targets:
      - "@wget2//..."
  verify_all_compression:
    name: Verify build targets (--bzip2 --lzma)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--@wget2//:bzip2=True"
      - "--@wget2//:lzma=True"
    test_flags:
      - "--@wget2//:bzip2=True"
      - "--@wget2//:lzma=True"
    build_targets:
      - "@wget2//..."
    test_targets:
      - "@wget2//..."
  verify_minimal:
    name: Verify build targets (every optional library off, assertions on)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--@wget2//:assert=True"
      - "--@wget2//:brotlidec=False"
      - "--@wget2//:libnghttp2=False"
      - "--@wget2//:libpcre2=False"
      - "--@wget2//:plugin_support=False"
      - "--@wget2//:xattr=False"
      - "--@wget2//:zlib=False"
      - "--@wget2//:zstd=False"
    test_flags:
      - "--@wget2//:assert=True"
      - "--@wget2//:brotlidec=False"
      - "--@wget2//:libnghttp2=False"
      - "--@wget2//:libpcre2=False"
      - "--@wget2//:plugin_support=False"
      - "--@wget2//:xattr=False"
      - "--@wget2//:zlib=False"
      - "--@wget2//:zstd=False"
    build_targets:
      - "@wget2//..."
    test_targets:
      - "@wget2//..."
