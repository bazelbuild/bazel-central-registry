matrix:
  platform:
  - ubuntu2204
  - ubuntu2404
  - ubuntu2404_arm64
  - debian11
  - macos
  - macos_arm64
  - windows
  bazel: [7.x, 8.x, 9.x, rolling]
  # Windows runs setup commands through cmd.exe, which needs different quoting,
  # so it has its own hermetic task below.
  hermetic_llvm_platform:
  - ubuntu2204
  - ubuntu2404
  - ubuntu2404_arm64
  - debian11
  - macos
  - macos_arm64
  # The other tasks already cover every Bazel version with the default
  # toolchains, so test hermetic LLVM on 9.x only to keep CI load down.
  hermetic_llvm_bazel: [9.x]
tasks:
  # Check building and testing works against a host-provided C++ toolchain.
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@xkbcommon//...'
    test_targets:
      - '@xkbcommon//...'
  # Check building and testing works against a hermetic C++ toolchain.
  verify_targets_hermetic_llvm:
    name: Verify build targets (hermetic llvm)
    platform: ${{ hermetic_llvm_platform }}
    bazel: ${{ hermetic_llvm_bazel }}
    setup:
      - echo 'bazel_dep(name = "llvm", version = "0.8.27")' >> MODULE.bazel
    # The m4 tool (bison -> m4) links -framework CoreServices on macOS via
    # gnulib's intlmacosx. The hermetic minimal macOS SDK omits it, so extend
    # the default framework list with CoreServices and CFNetwork (which
    # CoreServices re-exports). Ignored on non-macOS platforms.
    build_flags: &hermetic_llvm_flags
      - '--repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1'
      - '--repo_env=BAZEL_NO_APPLE_CPP_TOOLCHAIN=1'
      - '--repo_env=BAZEL_MACOS_FRAMEWORKS=CFNetwork,CoreFoundation,CoreServices,Foundation,Kernel,OSLog,Security,SystemConfiguration'
      - '--extra_toolchains=@llvm//toolchain:all'
    test_flags: *hermetic_llvm_flags
    build_targets:
      - '@xkbcommon//...'
    test_targets:
      - '@xkbcommon//...'
  # Same as above, but setup runs under cmd.exe on Windows, where single quotes
  # are not stripped by echo. The line would then be appended as a bare string
  # literal (a silent no-op in Starlark), leaving @llvm undeclared.
  verify_targets_hermetic_llvm_windows:
    name: Verify build targets (hermetic llvm)
    platform: windows
    bazel: ${{ hermetic_llvm_bazel }}
    setup:
      - echo bazel_dep(name = "llvm", version = "0.8.27")>> MODULE.bazel
    build_flags: *hermetic_llvm_flags
    test_flags: *hermetic_llvm_flags
    build_targets:
      - '@xkbcommon//...'
    test_targets:
      - '@xkbcommon//...'
