matrix:
  platform:
    - ubuntu2404
    - ubuntu2404_arm64
    - macos_arm64
  bazel:
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Build Speex and run all upstream bandwidth codec tests
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@speex//:speex'
    test_targets:
      - '@speex//:narrowband_test'
      - '@speex//:wideband_test'
      - '@speex//:ultra_wideband_test'
