bcr_test_module:
  module_path: "e2e/smoke"
  matrix:
    platform: ["debian11", "macos", "ubuntu2204", "windows"]
    bazel: ["9.x"]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      # rules_android registers `@androidsdk//:all`, so every build fetches the
      # SDK named by ANDROID_HOME. The macOS agents point it at an SDK with
      # build-tools 30.0.3, which rules_android rejects, failing the smoke test
      # before it runs. Unset, the SDK repository is an empty stub.
      environment:
        ANDROID_HOME: ""
        ANDROID_NDK_HOME: ""
      test_targets:
        - "//..."
