matrix:
  platform:
    - debian11
    - ubuntu2204
    - macos_arm64
    - windows
  bazel:
    - '8.x'
    - '9.x'

tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{platform}}
    bazel: ${{bazel}}
    build_targets:
      - '@rules_elisp//elisp/...'
    build_flags:
      - '--experimental_ui_max_stdouterr_bytes=2000000'

bcr_test_module:
  module_path: examples/ext
  matrix:
    platform:
      - debian11
      - ubuntu2204
      - macos_arm64
      - windows
    bazel:
      - '8.x'
      - '9.x'
  tasks:
    run_tests:
      name: Run test module
      platform: ${{platform}}
      bazel: ${{bazel}}
      build_targets:
        - //...
      test_targets:
        - //...
