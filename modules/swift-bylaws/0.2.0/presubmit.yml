# The Linux binary targets the glibc version in Ubuntu 22.04. The macOS
# binary is universal. `use_repo_rule` requires Bazel 7.1 or later.
bcr_test_module:
  module_path: "e2e/bzlmod"
  matrix:
    platform: ["macos", "macos_arm64", "ubuntu2204"]
    bazel: [7.x, 8.x, 9.x]
  tasks:
    verify_targets:
      name: "Check architectural rules"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - "@swift-bylaws//:bylaws"
        - "//:architecture"
