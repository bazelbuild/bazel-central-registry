matrix:
  platform:
  - ubuntu2204
  bazel:
  - 8.x
  - 9.x
tasks:
  verify_unix_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - --repo_env=CC=clang
    - --repo_env=CXX=clang++
    - --host_cxxopt=-std=c++17
    - --cxxopt=-std=c++17
    - --cxxopt=-Wno-c++20-extensions
    # riegeli uses sized deallocation, which clang enables by default only
    # since clang 19.
    - --cxxopt=-fsized-deallocation
    - --host_cxxopt=-fsized-deallocation
    build_targets:
    - '@fuzztest//fuzztest:fuzztest'
    - '@fuzztest//fuzztest:fuzztest_gtest_main'
    - '@fuzztest//centipede:centipede'
