matrix:
  platform: [ubuntu2404, macos_arm64, windows]
  bazel: [9.2.0]
tasks:
  public_api:
    name: Build public API
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@latticebuild_js//js:defs"
bcr_test_module:
  module_path: bcr_test
  matrix:
    platform: [ubuntu2404, macos_arm64, windows]
    bazel: [9.2.0]
  tasks:
    consumer:
      name: Build and execute the archive consumer
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      setup:
        - "npm exec --yes --package=@pnpm/exe@12.4.2 -- pnpm install --frozen-lockfile"
      build_targets: ["//:artifacts"]
      test_targets: ["//:test"]
      test_flags: ["--test_env=TMP", "--test_env=TEMP"]
