matrix:
  platform:
    - debian10
    - debian13
    - debian13_arm64
    - rockylinux8
    - ubuntu2204
    - ubuntu2204_arm64
  bazel: ["7.x", "8.x", "9.x"]
tasks:
  verify_targets:
    name: "Build with defaults"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - "@ppp//..."
  verify_minimal:
    name: "Build with optional features disabled"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@ppp//:microsoft_extensions=False"
    - "--@ppp//:ipv6cp=False"
    - "--@ppp//:plugins=False"
    - "--@ppp//:eaptls=False"
    - "--@ppp//:peap=False"
    - "--@ppp//:openssl=False"
    build_targets:
    - "@ppp//..."
