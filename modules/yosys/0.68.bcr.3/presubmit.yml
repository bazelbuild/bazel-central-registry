matrix: &matrix
  platform:
    # ubuntu2004 is gone: 0.68 requires a C++20 toolchain (README.md
    # "A C++ compiler with C++20 support is required"; CMAKE_CXX_STANDARD 20
    # REQUIRED), and 20.04's gcc-9 has no <source_location>.
    - ubuntu2204
    - ubuntu2404
    - ubuntu2404_arm64
    - debian13_arm64
    - macos_arm64
  bazel: ["7.x", "8.x", "9.x"]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@yosys//:yosys"
bcr_test_module:
  module_path: ""
  matrix: *matrix
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_flags:
        - "--verbose_failures"
      test_targets:
        - "@yosys//..."
