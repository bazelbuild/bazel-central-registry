matrix:
  platform:
    - debian13
    - macos
    - macos_arm64
    - ubuntu2404
    - ubuntu2404_arm64
    - windows
  bazel:
    - rolling
    - 9.x
    - 8.x
    - 7.x
    # The declared floor, which 7.x floats past.
    - 7.2.1
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@zenlib//:zen"
bcr_test_module:
  module_path: test
  matrix:
    platform:
      - debian13
      - macos
      - macos_arm64
      - ubuntu2404
      - ubuntu2404_arm64
      - windows
    bazel:
      - rolling
      - 9.x
      - 8.x
      - 7.x
      - 7.2.1
  tasks:
    run_tests:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
