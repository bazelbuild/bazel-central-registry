matrix:
  platform:
    - debian10
    - rockylinux8
    - ubuntu2004
    # Ubuntu 20.04 arm64 ships with GCC 9.x which does not have i8mm
    # support, which was introduced in GCC 10.x. Ubuntu 22.04 ships
    # with GCC 11.x which is why the Ubuntu version below is higher
    # than its x86_64 counterpart above.
    - ubuntu2204_arm64
    - macos_arm64
  bazel: ["8.5.0", "8.x", "9.x"]
tasks:
  verify_targets:
    name: "Run test module"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    test_targets:
      - "@ffmpeg//..."
  verify_ffmpeg_with_extras:
    name: "Build ffmpeg with extra features"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    test_targets:
      - "@ffmpeg//..."
    test_flags:
      - "--@ffmpeg//:enable_libx264_encoder=True"
      - "--@ffmpeg//:enable_golomb=True"  # dependency of libx264_encoder
      - "--@ffmpeg//:enable_atsc_a53=True"  # dependency of libx264_encoder
      - "--@ffmpeg//:enable_libsvtav1_encoder=True"
      - "--@ffmpeg//:enable_libvpx_vp8_decoder=True"
      - "--@ffmpeg//:enable_libvpx_vp8_encoder=True"
      - "--@ffmpeg//:enable_libvpx_vp9_decoder=True"
      - "--@ffmpeg//:enable_libvpx_vp9_encoder=True"
      - "--@ffmpeg//:enable_libaom_av1_decoder=True"
      - "--@ffmpeg//:enable_libaom_av1_encoder=True"
      - "--@ffmpeg//:enable_libcodec2_decoder=True"
      - "--@ffmpeg//:enable_libcodec2_encoder=True"
      - "--@ffmpeg//:enable_libdav1d_decoder=True"
      - "--@ffmpeg//:enable_libgsm_decoder=True"
      - "--@ffmpeg//:enable_libgsm_encoder=True"
      - "--@ffmpeg//:enable_libgsm_ms_decoder=True"
      - "--@ffmpeg//:enable_libgsm_ms_encoder=True"
      - "--@ffmpeg//:enable_libjxl_anim_decoder=True"
      - "--@ffmpeg//:enable_libjxl_anim_encoder=True"
      - "--@ffmpeg//:enable_libjxl_decoder=True"
      - "--@ffmpeg//:enable_libjxl_encoder=True"
      - "--@ffmpeg//:enable_libmp3lame_encoder=True"
      - "--@ffmpeg//:enable_libopenjpeg_encoder=True"
      - "--@ffmpeg//:enable_librav1e_encoder=True"
      - "--@ffmpeg//:enable_libshine_encoder=True"
      - "--@ffmpeg//:enable_libspeex_decoder=True"
      - "--@ffmpeg//:enable_libspeex_encoder=True"
      - "--@ffmpeg//:enable_libtwolame_encoder=True"
      - "--@ffmpeg//:enable_libvorbis_decoder=True"
      - "--@ffmpeg//:enable_libvorbis_encoder=True"
      - "--@ffmpeg//:enable_libxvid_encoder=True"
      - "--cxxopt=-std=c++17"  # required by libjxl on older compilers
      - "--host_cxxopt=-std=c++17"
      - "--@ffmpeg//:enable_tls_protocol=True"
      - "--@ffmpeg//:enable_dtls_protocol=True"
  verify_ffmpeg_with_boringssl:
    name: "Build ffmpeg with boringssl"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    test_targets:
      - "@ffmpeg//..."
    test_flags:
      - "--@ffmpeg//:enable_openssl=False"
      - "--@ffmpeg//:enable_boringssl=True"
      - "--@ffmpeg//:enable_tls_protocol=True"
      - "--@ffmpeg//:enable_dtls_protocol=True"
      - "--cxxopt=-std=c++17"  # required by boringssl, see modules/boringssl/*/presubmit.yml
      - "--host_cxxopt=-std=c++17"  # required by boringssl, see modules/boringssl/*/presubmit.yml
  verify_jxl_animation:
    name: "Test JPEG XL animation without still-image codecs"
    platform: ubuntu2004
    bazel: "8.5.0"
    test_targets:
      - "@ffmpeg//tests:external_codecs_test"
    test_flags:
      - "--@ffmpeg//:enable_libjxl_anim_decoder=True"
      - "--@ffmpeg//:enable_libjxl_anim_encoder=True"
      - "--cxxopt=-std=c++17"
      - "--host_cxxopt=-std=c++17"
