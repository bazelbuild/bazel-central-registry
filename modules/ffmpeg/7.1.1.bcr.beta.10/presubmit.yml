matrix:
  platform:
    - debian10
    - rockylinux8
    - ubuntu2004
    # Ubuntu 20.04 arm64 ships with GCC 9.x which does not have i8mm
    # support, which was introduced in GCC 10.x. Ubuntu 22.04 ships
    # with GCC 11.x which is why the Ubuntu version below is higher
    # than its x86_64 counterpart above.
    - ubuntu2204_arm64
    - macos_arm64
    - windows
  unix_platform:
    - debian10
    - rockylinux8
    - ubuntu2004
    - ubuntu2204_arm64
    - macos_arm64
  windows_platform:
    - windows
  bazel: ["7.x", "8.x", "9.x"]
tasks:
  verify_targets:
    name: "Run test module"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    test_targets:
      - "@ffmpeg//..."
    test_flags:
      - "--test_output=errors"
  verify_ffmpeg_with_extras:
    name: "Build ffmpeg with extra features"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    test_targets:
      - "@ffmpeg//..."
    test_flags:
      - "--test_output=errors"
      - "--@ffmpeg//:enable_libx264_encoder=True"
      - "--@ffmpeg//:enable_golomb=True"  # dependency of libx264_encoder
      - "--@ffmpeg//:enable_atsc_a53=True"  # dependency of libx264_encoder
      - "--@ffmpeg//:enable_libsvtav1_encoder=True"
      - "--@ffmpeg//:enable_libvpx_vp8_decoder=True"
      - "--@ffmpeg//:enable_libvpx_vp8_encoder=True"
      - "--@ffmpeg//:enable_libvpx_vp9_decoder=True"
      - "--@ffmpeg//:enable_libvpx_vp9_encoder=True"
      - "--@ffmpeg//:enable_libaom_av1_decoder=True"
      - "--@ffmpeg//:enable_libaom_av1_encoder=True"
      - "--@ffmpeg//:enable_libaom_av1_encoder=True"
  verify_ffmpeg_with_boringssl:
    name: "Build ffmpeg with boringssl"
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    test_targets:
      - "@ffmpeg//..."
    test_flags:
      - "--test_output=errors"
      - "--@ffmpeg//:enable_openssl=False"
      - "--@ffmpeg//:enable_boringssl=True"
      - "--cxxopt=-std=c++17"  # required by boringssl, see modules/boringssl/*/presubmit.yml
      - "--host_cxxopt=-std=c++17"  # required by boringssl, see modules/boringssl/*/presubmit.yml
  verify_ffmpeg_with_boringssl_windows:
    name: "Build ffmpeg with boringssl"
    platform: ${{ windows_platform }}
    bazel: ${{ bazel }}
    test_targets:
      - "@ffmpeg//..."
    test_flags:
      - "--test_output=errors"
      - "--@ffmpeg//:enable_openssl=False"
      - "--@ffmpeg//:enable_boringssl=True"
      - "--cxxopt=/std:c++17"  # required by boringssl, see modules/boringssl/*/presubmit.yml
      - "--host_cxxopt=/std:c++17"  # required by boringssl, see modules/boringssl/*/presubmit.yml
