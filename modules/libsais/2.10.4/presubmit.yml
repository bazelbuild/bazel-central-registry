matrix:
  bazel: [7.x, 8.x, 9.x, rolling]
  platform:
    - debian11
    - ubuntu2204
    - macos_arm64
    - windows
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - '--features=parse_headers'
      - '--process_headers_in_dependencies'
    build_targets:
      - "@libsais//:libsais"
      - "@libsais//:libsais16"
      - "@libsais//:libsais64"
      - "@libsais//:libsais16x64"
    test_targets:
      - "@libsais//:all"
