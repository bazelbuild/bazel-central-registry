bcr_test_module:
  module_path: ""
  matrix:
    bazel:
      - 7.x
      - 8.x
    platform:
      - debian12
      - debian13
      - ubuntu2404
      - ubuntu2204
      - fedora43
      - macos
      - macos_arm64
  tasks:
    tests:
      name: Run `libxcrypt` Tests
      bazel: ${{ bazel }}
      platform: ${{ platform }}
      build_targets:
        - "@libxcrypt//..."
      test_targets:
        - "@libxcrypt//..."
