matrix:
  platform: [debian13, ubuntu2404, ubuntu2404_arm64]
  bazel: [7.x, 8.x, 9.x]
tasks:
  verify_targets:
    name: Build MPICH runtime
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets: ["@mpich//:all"]
bcr_test_module:
  module_path: bazel_test
  matrix:
    platform: [debian13, ubuntu2404, ubuntu2404_arm64]
    bazel: [7.x, 8.x, 9.x]
  tasks:
    run_tests:
      name: Test MPI C runtime
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets: ["//:all"]
