matrix:
  platform:
  - debian11
  - ubuntu2204
  - macos
  - macos_arm64
  - windows
  bazel:
  - 8.x
  - 7.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@au//au'
    - '@au//au:io'
    - '@au//au:std_format'
    - '@au//au:testing'
    - '@au//au/compatibility:eigen'
    - '@au//compatibility:nholthaus_units'
bcr_test_module:
  module_path: bzlmod_test_client
  matrix:
    platform:
    - debian11
    - ubuntu2204
    - macos
    - macos_arm64
    - windows
    bazel:
    - 8.x
    - 7.x
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
      - test_au_client
