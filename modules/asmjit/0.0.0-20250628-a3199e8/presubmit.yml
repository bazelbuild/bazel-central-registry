matrix:
  platform:
  - debian11
  - ubuntu2204
  - ubuntu2404
  - macos
  - macos_arm64
  - windows
  bazel:
  - 9.x
  - 8.x
  - 7.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@asmjit//:asmjit'
    # Upstream builds its tests with -O2; unoptimized, the benchmarks that it
    # also registers as tests take minutes instead of seconds.
    test_flags:
    - '--compilation_mode=opt'
    test_targets:
    - '@asmjit//test:all'
