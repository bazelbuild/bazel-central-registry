matrix:
  platform:
  - ubuntu2204
  - ubuntu2404
  - ubuntu2404_arm64
  - debian13
  - macos
  - macos_arm64
  - windows
  - windows_arm64
  bazel: [8.x, 9.x, rolling]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@plutosvg//:plutosvg'
      - '@plutosvg//:camera2png'
      - '@plutosvg//:emoji2png'
      - '@plutosvg//:svg2png'
    test_targets:
      - '@plutosvg//:camera2png'
  verify_targets_without_freetype:
    name: Verify build targets without freetype
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@plutosvg//:plutosvg'
      - '@plutosvg//:camera2png'
      - '@plutosvg//:svg2png'
    test_targets:
      - '@plutosvg//:camera2png'
    build_flags:
      - "--@plutosvg//:use_freetype=false"
    test_flags:
      - "--@plutosvg//:use_freetype=false"
