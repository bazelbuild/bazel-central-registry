bcr_test_module_rules_rs:
  module_path: "examples/rules_rs"
  matrix:
    platform: ["macos", "ubuntu2204", "windows"]
    bazel: ["9.x", "8.x"]
  tasks:
    run_tests:
      name: "Run tests on examples/rules_rs module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."

