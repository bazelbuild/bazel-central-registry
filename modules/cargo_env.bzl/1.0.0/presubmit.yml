bcr_test_module:
  module_path: "."
  matrix:
    platform:
      - "macos"
      - "ubuntu2204"
      # - "windows" TODO(https://github.com/ZiplineTeam/cargo_env.bzl/issues/36): Enable
    bazel:
      - "9.x"
      - "8.x"
  tasks:
    test_rules_rs:
      name: "Run tests on examples/rules_rs"
      working_directory: "examples/rules_rs"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
    test_rules_rust:
      name: "Run tests on examples/rules_rust"
      working_directory: "examples/rules_rust"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
