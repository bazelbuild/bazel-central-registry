matrix: &matrix
  platform:
    - ubuntu2404
    - ubuntu2404_arm64
    - macos
    - macos_arm64
    - windows
  bazel: [8.x, 9.x]
tasks:
  verify_targets:
    name: Verify public libraries
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@libultrahdr//:ultrahdr'
      - '@libultrahdr'
      - '@libultrahdr//:ultrahdr_gpu'
      - '@libultrahdr//:ultrahdr_app'
      - '@libultrahdr//:uhdrjni'
      - '@libultrahdr//:java'
      - '@libultrahdr//:ultrahdr_java_app'
  verify_smpte:
    name: Verify SMPTE 2094-50 enabled
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - '--@libultrahdr//:enable_smpte2094_50=True'
    build_targets:
      - '@libultrahdr//:ultrahdr'
bcr_test_module:
  module_path: test
  matrix: *matrix
  tasks:
    roundtrip_test:
      name: Encode and decode Ultra HDR as a dependency
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - '//:roundtrip_test'
        - '//:heif_roundtrip_test'
        - '//:avif_roundtrip_test'
        - '//:jni_test'
        - '//:smpte_test'
    verify_jpeg_configuration:
      name: Verify scalar JPEG with XMP metadata
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_flags:
        - '--@libultrahdr//:enable_heif=False'
        - '--@libultrahdr//:enable_intrinsics=False'
        - '--@libultrahdr//:write_iso=False'
        - '--@libultrahdr//:write_xmp=True'
      test_targets:
        - '//:roundtrip_test'
    verify_smpte_gainmap:
      name: Generate a gain map from SMPTE metadata
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_flags:
        - '--@libultrahdr//:enable_smpte2094_50=True'
      test_targets:
        - '//:smpte_gainmap_test'
