matrix:
  platform: [ubuntu2204]
  bazel: [7.x, 8.x]

tasks:
  verify_targets:
    name: Verify Common public algorithms
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - --cxxopt=-std=c++17
    - --host_cxxopt=-std=c++17
    build_targets:
    - '@wheelos_common//modules/common/math:angle'
    - '@wheelos_common//modules/common/math:kalman_filter'
