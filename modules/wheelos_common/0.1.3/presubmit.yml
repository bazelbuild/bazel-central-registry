matrix:
  platform: [ubuntu2204]
  bazel: ["7.6.1", "8.8.1"]
tasks:
  verify_targets:
    name: Verify Common algorithms and CPU-only sparse ONNX import
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - --cxxopt=-std=c++17
    - --host_cxxopt=-std=c++17
    - --jobs=2
    build_targets:
    - "@wheelos_common//modules/common/math:angle"
    - "@wheelos_common//modules/common/math:kalman_filter"
    - "@wheelos_common//perception/ops/spconv:sparse_model"
    - "@wheelos_common//perception/model_io/onnx:sparse_model"
    test_targets:
    - "@wheelos_common//perception/model_io/onnx:sparse_model_test"
