matrix:
  platform:
    - ubuntu2404
    - macos
    - macos_arm64
    - windows
  bazel:
    - 9.x
    - 8.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@bitserializer//:core"
      - "@bitserializer//:json_archive"
      - "@bitserializer//:csv_archive"
      - "@bitserializer//:msgpack_archive"
bcr_test_module:
  module_path: ""
  matrix:
    platform:
      - ubuntu2404
      - macos
      - macos_arm64
      - windows
    bazel:
      - 9.x
      - 8.x
  tasks:
    run_tests:
      name: Run the integration test suite
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//tests/integration_tests:all_tests"
