matrix:
  platform: [debian11, ubuntu2204, ubuntu2404, macos, macos_arm64, windows]
  bazel: [7.x, 8.x, 9.x, rolling]
  hermetic_llvm_unix_platform: [ubuntu2404, ubuntu2404_arm64, macos, macos_arm64]
  hermetic_llvm_windows_platform: [windows, windows_arm64]
  # The hermetic LLVM toolchain only works for Bazel 8.x onwards.
  hermetic_llvm_bazel: [8.x, 9.x, rolling]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets: ['@capstone//...']
  verify_targets_hermetic_llvm_unix:
    name: Verify build targets (hermetic llvm, unix)
    platform: ${{ hermetic_llvm_unix_platform }}
    bazel: ${{ hermetic_llvm_bazel }}
    setup:
      - echo 'bazel_dep(name = "llvm", version = "0.8.27")' >> MODULE.bazel
    build_flags: &hermetic_llvm_flags
      - '--repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1'
      - '--repo_env=BAZEL_NO_APPLE_CPP_TOOLCHAIN=1'
      - '--extra_toolchains=@llvm//toolchain:all'
    build_targets: ['@capstone//...']
  # Windows runs setup through cmd.exe, which does not strip single quotes: the
  # line would be appended as a bare Starlark string (a silent no-op), so echo unquoted.
  verify_targets_hermetic_llvm_windows:
    name: Verify build targets (hermetic llvm, windows)
    platform: ${{ hermetic_llvm_windows_platform }}
    bazel: ${{ hermetic_llvm_bazel }}
    setup:
      - echo bazel_dep(name = "llvm", version = "0.8.27")>> MODULE.bazel
    build_flags: *hermetic_llvm_flags
    build_targets: ['@capstone//...']
