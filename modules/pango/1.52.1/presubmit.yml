matrix:
  platform: [debian13, ubuntu2404]
  bazel: [7.x, 8.x, 9.x]
tasks:
  verify_targets:
    name: Build Pango libraries
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@pango//:pango"
      - "@pango//:pangoft2"
      - "@pango//:pangocairo"
      - "@pango//:pango_shared"
      - "@pango//:pangoft2_shared"
      - "@pango//:pangocairo_shared"
bcr_test_module:
  module_path: bazel_test
  matrix:
    platform: [debian13, ubuntu2404]
    bazel: [7.x, 8.x, 9.x]
  tasks:
    run_tests:
      name: Test C++ consumers and runfiles dlopen
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets: ["//:all"]
