# MPI comes from @mpich, which only supports Linux.
matrix:
  platform: [debian13, ubuntu2404, ubuntu2404_arm64]
  bazel: [8.x, 9.x, rolling]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags: ["--cxxopt=-std=c++17", "--process_headers_in_dependencies"]
    build_targets: ["@boost.mpi//:boost.mpi"]

bcr_test_module:
  module_path: test
  matrix:
    platform: [debian13, ubuntu2404, ubuntu2404_arm64]
    bazel: [8.x, 9.x, rolling]
  tasks:
    run_test_module:
      name: Run upstream tests
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_flags: ["--cxxopt=-std=c++17", "--process_headers_in_dependencies"]
      test_flags: ["--cxxopt=-std=c++17", "--process_headers_in_dependencies"]
      test_targets: ["//..."]
