matrix:
  bazel: ["7.x", "8.x", "9.x"]
  platform: ["debian11", "macos", "macos_arm64", "ubuntu2204_arm64", "ubuntu2404", "windows"]

tasks:
  verify_targets:
    name: Verify build targets
    bazel: ${{ bazel }}
    platform: ${{ platform }}
    build_targets:
      - '@gsl//:gsl'

bcr_test_module:
  module_path: "."
  matrix:
    bazel: ["7.x", "8.x", "9.x"]
    platform: ["ubuntu2404"]
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
      - '//...'
