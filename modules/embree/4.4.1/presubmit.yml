matrix:
  platform:
    - macos
    - macos_arm64
    - ubuntu2404
    - windows
  bazel: [8.x, 9.x, rolling]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@embree//:embree'
    test_targets:
      - '@embree//:version_test'
