    name: bazel test //... (linux, gcc)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      # .bazelrc: unconditional flags
      - --experimental_guard_against_concurrent_changes
      - --nolegacy_external_runfiles
      - --force_pic
      - --dynamic_mode=off
      - --strip=never
      - --features=layering_check
      - --incompatible_no_implicit_file_export
      # .bazelrc: --config=generic_gcc
      - --repo_env=CC=gcc
      - --cxxopt=-std=c++17
      - --host_cxxopt=-std=c++17
      - --copt=-Wno-deprecated
      - --host_copt=-Wno-deprecated
      - --copt=-Wno-unused-parameter
      - --host_copt=-Wno-unused-parameter
      - --copt=-Wno-comment
      - --host_copt=-Wno-comment
      - --cxxopt=-Wno-class-memaccess
      - --host_cxxopt=-Wno-class-memaccess
      - --copt=-Wno-maybe-uninitialized
      - --host_copt=-Wno-maybe-uninitialized
      - --copt=-Wno-misleading-indentation
      - --host_copt=-Wno-misleading-indentation
      - --build_tag_filters=-nobuildkite
      - --keep_going
      - --incompatible_disallow_empty_glob=true
      - --incompatible_autoload_externally=
    build_targets:
      - '@llvm-project//...'
      # GCC rejects the [[gnu::alias]] in LLVM_LIBC_FUNCTION when glibc also
      # defines the function as an extern inline under optimization (atof in
      # stdlib.h, vprintf in bits/stdio.h, feraiseexcept in bits/fenvinline.h
      # on debian10's glibc 2.28)
      # and the libc rules force -O3. Overlay-mode GCC builds are a known gap
      # upstream (llvm/llvm-project#60481). Only the public-packaging variants
      # alias; the tests link the .__internal__ ones and are unaffected.
