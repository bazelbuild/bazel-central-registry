matrix:
  platform:
  - ubuntu2004
  - ubuntu2004_arm64
  - ubuntu2404
  - macos
  - macos_arm64
  - windows
  - windows_arm64
  bazel: [7.x, 8.x, 9.x]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@pkgconf//...'
    test_targets:
    - '@pkgconf//...'
