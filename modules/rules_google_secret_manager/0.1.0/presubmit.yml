matrix:
  platform: ["ubuntu2204", "macos", "macos_arm64"]
  bazel: [8.x, 9.x]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@rules_google_secret_manager//secret:extensions"
      - "@rules_google_secret_manager//secret:repo_rules"
