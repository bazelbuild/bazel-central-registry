# The integration module runs on Bazel 8 and 9 alike, so both are tested. The
# CI workflow in .github/workflows/test.yml runs the same matrix.
#
# Linux and macOS. Windows is left out: cmd/xrootfs calls syscall.Mknod,
# which Go does not define on Windows, so the module does not build there.
bcr_test_module:
  module_path: "integration"
  matrix:
    platform: ["debian13", "ubuntu2204", "ubuntu2404", "macos", "macos_arm64"]
    bazel: [8.x, 9.x]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
