matrix:
  platform:
  - macos
  - macos_arm64
  bazel:
  - 8.x
  - 9.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@cucumberswift//:CucumberSwift'
bcr_test_module:
  module_path: Tests
  matrix:
    platform:
    - macos
    - macos_arm64
    bazel:
    - 8.x
    - 9.x
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      # The macOS consumer suites, run with `xcrun xctest`; the _iOS suites need a simulator.
      test_targets:
      - //:xctest_runner_test
      - //:CucumberSwiftConsumerTests
      - //:CucumberSwiftDSLConsumerTests
      - //:CucumberSwiftSwift6ConsumerTests
