matrix:
  platform:
  - ubuntu2404
  - macos_arm64
  bazel:
  # Bazel 9.x is omitted because dependencies on this LTS branch (e.g.,
  # gz-utils@3.1.1) use native cc_* rules removed in Bazel 9.
  - 8.x
  - 7.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--cxxopt=-std=c++17'
    - '--host_cxxopt=-std=c++17'
    build_targets:
    - '@gz-rendering'
