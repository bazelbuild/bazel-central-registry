matrix:
  platform:
    - debian13
    - debian13_arm64
    - ubuntu2204
    - ubuntu2204_arm64
  bazel: ["7.x", "8.x", "9.x"]
tasks:
  verify_targets:
    name: "Default build + test"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - "@kmod//..."
    test_targets:
    - "@kmod//..."

  # Flag coverage: each task flips one of the configure options (bool_flags of
  # the root package) to exercise its select() wiring.
  zstd_on:
    name: "Build/test with //:zstd=true"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@kmod//:zstd=true"
    test_flags:
    - "--@kmod//:zstd=true"
    build_targets:
    - "@kmod//..."
    test_targets:
    - "@kmod//..."

  xz_on:
    name: "Build/test with //:xz=true"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@kmod//:xz=true"
    test_flags:
    - "--@kmod//:xz=true"
    build_targets:
    - "@kmod//..."
    test_targets:
    - "@kmod//..."

  zlib_on:
    name: "Build/test with //:zlib=true"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@kmod//:zlib=true"
    test_flags:
    - "--@kmod//:zlib=true"
    build_targets:
    - "@kmod//..."
    test_targets:
    - "@kmod//..."

  openssl_on:
    name: "Build/test with //:openssl=true"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@kmod//:openssl=true"
    test_flags:
    - "--@kmod//:openssl=true"
    build_targets:
    - "@kmod//..."
    test_targets:
    - "@kmod//..."

  logging_off:
    name: "Build/test with //:logging=false"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@kmod//:logging=false"
    test_flags:
    - "--@kmod//:logging=false"
    build_targets:
    - "@kmod//..."
    test_targets:
    - "@kmod//..."

  debug_on:
    name: "Build/test with //:debug=true"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@kmod//:debug=true"
    test_flags:
    - "--@kmod//:debug=true"
    build_targets:
    - "@kmod//..."
    test_targets:
    - "@kmod//..."

  tools_off:
    name: "Build with //:tools=false (library only)"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@kmod//:tools=false"
    build_targets:
    - "@kmod//:kmod"
    - "@kmod//:libkmod/kmod_shared"

# Linux only: kmod drives the init_module/finit_module/delete_module system
# calls and reads /proc/modules and /sys/module; macOS and Windows have no
# kernel modules of this kind to manage.
