# The registry's machines have no X11 or OpenGL development packages, which
# the example programs and the renderer need (the module is not hermetic;
# see README.md). The presubmit runs the tests that need only a C++ toolchain
# and googletest; the examples build in this repository's own CI, where
# //third_party/deps:ubuntu installs the packages first.
bcr_test_module:
  module_path: "integration"
  matrix:
    platform: ["ubuntu2404"]
    bazel: [9.x]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//third_party/luk707_games/common/math:vector3_test"
        - "//third_party/luk707_games/common/gl:parse_shader_test"
