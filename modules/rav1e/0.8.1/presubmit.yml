matrix:
  platform:
    - ubuntu2404
    - ubuntu2404_arm64
    - macos_arm64
  bazel:
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Build native Rust AV1 encoder and run upstream API and C encoding tests
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@rav1e//:rav1e'
    test_targets:
      - '@rav1e//:upstream_api_test'
      - '@rav1e//:c_api_encode_test'
      - '@rav1e//:c_api_header_cpp_test'
