matrix:
  platform:
  - debian11
  - ubuntu2004
  - ubuntu2004_arm64
  - ubuntu2204
  - ubuntu2404
  - macos
  - macos_arm64
  - windows
  bazel: [7.x, 8.x, 9.x]
tasks:
  verify_targets:
    name: Verify build targets (defaults)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    shell_commands:
    - 'git init --quiet .bcr-rules_cc_autoconf'
    - 'git -C .bcr-rules_cc_autoconf fetch --quiet --depth 1 https://github.com/periareon/rules_cc_autoconf.git 661ccc73ba823f4fd479f4a9d3d69143443a120a'
    - 'git -C .bcr-rules_cc_autoconf checkout --quiet FETCH_HEAD'
    batch_commands:
    - 'git init --quiet .bcr-rules_cc_autoconf'
    - 'git -C .bcr-rules_cc_autoconf fetch --quiet --depth 1 https://github.com/periareon/rules_cc_autoconf.git 661ccc73ba823f4fd479f4a9d3d69143443a120a'
    - 'git -C .bcr-rules_cc_autoconf checkout --quiet FETCH_HEAD'
    build_flags:
    - '--override_module=rules_cc_autoconf=.bcr-rules_cc_autoconf'
    test_flags:
    - '--override_module=rules_cc_autoconf=.bcr-rules_cc_autoconf'
    build_targets:
    - '@sed//...'
    test_targets:
    - '@sed//...'
  verify_no_i18n:
    name: Verify build targets (--enable_i18n=False)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    shell_commands:
    - 'git init --quiet .bcr-rules_cc_autoconf'
    - 'git -C .bcr-rules_cc_autoconf fetch --quiet --depth 1 https://github.com/periareon/rules_cc_autoconf.git 661ccc73ba823f4fd479f4a9d3d69143443a120a'
    - 'git -C .bcr-rules_cc_autoconf checkout --quiet FETCH_HEAD'
    batch_commands:
    - 'git init --quiet .bcr-rules_cc_autoconf'
    - 'git -C .bcr-rules_cc_autoconf fetch --quiet --depth 1 https://github.com/periareon/rules_cc_autoconf.git 661ccc73ba823f4fd479f4a9d3d69143443a120a'
    - 'git -C .bcr-rules_cc_autoconf checkout --quiet FETCH_HEAD'
    build_flags:
    - '--override_module=rules_cc_autoconf=.bcr-rules_cc_autoconf'
    - '--@sed//:enable_i18n=False'
    test_flags:
    - '--override_module=rules_cc_autoconf=.bcr-rules_cc_autoconf'
    - '--@sed//:enable_i18n=False'
    build_targets:
    - '@sed//...'
    test_targets:
    - '@sed//...'
  verify_no_threads:
    name: Verify build targets (--enable_threads=False)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    shell_commands:
    - 'git init --quiet .bcr-rules_cc_autoconf'
    - 'git -C .bcr-rules_cc_autoconf fetch --quiet --depth 1 https://github.com/periareon/rules_cc_autoconf.git 661ccc73ba823f4fd479f4a9d3d69143443a120a'
    - 'git -C .bcr-rules_cc_autoconf checkout --quiet FETCH_HEAD'
    batch_commands:
    - 'git init --quiet .bcr-rules_cc_autoconf'
    - 'git -C .bcr-rules_cc_autoconf fetch --quiet --depth 1 https://github.com/periareon/rules_cc_autoconf.git 661ccc73ba823f4fd479f4a9d3d69143443a120a'
    - 'git -C .bcr-rules_cc_autoconf checkout --quiet FETCH_HEAD'
    build_flags:
    - '--override_module=rules_cc_autoconf=.bcr-rules_cc_autoconf'
    - '--@sed//:enable_threads=False'
    test_flags:
    - '--override_module=rules_cc_autoconf=.bcr-rules_cc_autoconf'
    - '--@sed//:enable_threads=False'
    build_targets:
    - '@sed//...'
    test_targets:
    - '@sed//...'
