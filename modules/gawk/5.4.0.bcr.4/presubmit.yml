matrix:
  platform:
    - debian13
    - debian13_arm64
    - macos_arm64
    - ubuntu2204
    - ubuntu2204_arm64
  bazel: ["7.x", "8.x", "9.x"]
tasks:
  verify_targets:
    name: "Default build + test"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - "@gawk//..."
    test_targets:
    - "@gawk//..."

  # Flag coverage: each task flips one of the configure options (bool_flags of
  # the root package) to exercise its select() wiring.
  lint_off:
    name: "Build/test with //:lint=false"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@gawk//:lint=false"
    test_flags:
    - "--@gawk//:lint=false"
    build_targets:
    - "@gawk//..."
    test_targets:
    - "@gawk//..."

  builtin_intdiv0_on:
    name: "Build/test with //:builtin_intdiv0=true"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@gawk//:builtin_intdiv0=true"
    test_flags:
    - "--@gawk//:builtin_intdiv0=true"
    build_targets:
    - "@gawk//..."
    test_targets:
    - "@gawk//..."

  pma_off:
    name: "Build/test with //:pma=false"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@gawk//:pma=false"
    test_flags:
    - "--@gawk//:pma=false"
    build_targets:
    - "@gawk//..."
    test_targets:
    - "@gawk//..."

  extensions_off:
    name: "Build/test with //:extensions=false"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@gawk//:extensions=false"
    test_flags:
    - "--@gawk//:extensions=false"
    build_targets:
    - "@gawk//..."
    test_targets:
    - "@gawk//..."

  mpfr_on:
    name: "Build/test with //:mpfr=true"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@gawk//:mpfr=true"
    test_flags:
    - "--@gawk//:mpfr=true"
    build_targets:
    - "@gawk//..."
    test_targets:
    - "@gawk//..."

  # Windows: the interpreter and its tests. The bundled extensions include
  # POSIX headers MSVC does not have, so the wildcard is not built there.
  windows:
    name: "Windows build + test"
    platform: windows
    bazel: ${{ bazel }}
    build_targets:
    - "@gawk//:gawk"
    - "@gawk//:gawk_minimal"
    test_targets:
    - "@gawk//test/..."
