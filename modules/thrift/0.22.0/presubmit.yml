matrix:
  platform:
    - debian11
    - ubuntu2204
    - macos
    - macos_arm64
  bazel:
    - 7.x
    - 8.x
    - 9.x

tasks:
  verify_targets:
    name: Build Apache Thrift C++ runtime
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@thrift//:thrift"

bcr_test_module:
  module_path: test
  matrix:
    platform:
      - debian11
      - ubuntu2204
      - macos
      - macos_arm64
    bazel:
      - 7.x
      - 8.x
      - 9.x
  tasks:
    smoke_test:
      name: Test Apache Thrift compact-protocol serialization
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//:smoke_test"
