bcr_test_module:
  module_path: "examples"
  matrix:
    bazel: ["7.x", "8.x"]
    platform:
    - debian10
    - ubuntu2004
    # BCR CI no longer provides a running Docker daemon (docker socket
    # mount was removed from runners in Aug 2026), so tests that call
    # `docker compose` can't run here. macOS runners never had docker.
    # - macos
    # - macos_arm64
  tasks:
    test_linux:
      name: "Run test module"
      bazel: ${{ bazel }}
      platform: ${{ platform }}
      build_targets:
        - "//..."
      test_targets:
        # Only the go unit tests — every other test target needs a
        # running docker daemon, which BCR CI does not provide.
        - "//go-test-image-test:go-test-image-test.go_test"
