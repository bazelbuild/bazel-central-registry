matrix:
  platform:
    - debian13
    - macos_arm64
    - ubuntu2404
    - ubuntu2404_arm64
    - windows
  bazel:
    - 7.x
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@nasm//:nasm"
# nasm only assembles x86, and @rules_nasm//tests assemble x86-64 and then
# link and run the result, so the suite can only be exercised on an x86-64
# host. rules_nasm's own presubmit matrix is x86-64 only for the same reason.
bcr_test_module:
  module_path: "test_module"
  matrix:
    platform:
      - debian13
      - macos
      - ubuntu2404
      - windows
    bazel:
      - 7.x
      - 8.x
      - 9.x
  tasks:
    run_tests:
      name: Run rules_nasm test suite
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "@rules_nasm//tests/..."
