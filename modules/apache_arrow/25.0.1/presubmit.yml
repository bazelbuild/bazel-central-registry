matrix:
  platform:
    - debian11
    - ubuntu2204
    - macos
    - macos_arm64
  bazel:
    - 7.x
    - 8.x
    - 9.x

tasks:
  verify_targets:
    name: Build Arrow C++ libraries
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@apache_arrow//:apache_arrow"
      - "@apache_arrow//:acero"
      - "@apache_arrow//:parquet"
      - "@apache_arrow//:dataset"
bcr_test_module:
  module_path: test
  matrix:
    platform:
      - debian11
      - ubuntu2204
      - macos
      - macos_arm64
    bazel:
      - 7.x
      - 8.x
      - 9.x
  tasks:
    smoke_test:
      name: Test Arrow and Parquet from a dependent module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//:smoke_test"
    cloud_smoke_test:
      name: Test optional Azure and Amazon S3 filesystems
      platform: ubuntu2204
      bazel: 9.x
      test_flags:
        - "--@apache_arrow//:with_azure"
        - "--@apache_arrow//:with_s3"
        - "--@curl//:ssl_lib=openssl"
      test_targets:
        - "//:smoke_test"
