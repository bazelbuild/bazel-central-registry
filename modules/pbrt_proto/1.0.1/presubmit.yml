matrix:
  platform:
  - debian11
  - debian12
  - debian13
  - macos
  - macos_arm64
  - windows
  bazel:
  - rolling
  - 9.x
  - 8.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@pbrt_proto//pbrt_proto:pbrt_proto'
    - '@pbrt_proto//pbrt_proto:pbrt_cc_proto'
    - '@pbrt_proto//pbrt_proto/v1:convert'
    - '@pbrt_proto//pbrt_proto/v1:defaults_binpb'
    - '@pbrt_proto//pbrt_proto/v1:defaults_cc_proto'
    - '@pbrt_proto//pbrt_proto/v1:defaults_proto'
    - '@pbrt_proto//pbrt_proto/v1:v3_cc_proto'
    - '@pbrt_proto//pbrt_proto/v1:v3_proto'
    - '@pbrt_proto//pbrt_proto/v2:convert'
    - '@pbrt_proto//pbrt_proto/v2:defaults_binpb'
    - '@pbrt_proto//pbrt_proto/v2:defaults_cc_proto'
    - '@pbrt_proto//pbrt_proto/v2:defaults_proto'
    - '@pbrt_proto//pbrt_proto/v2:v3_cc_proto'
    - '@pbrt_proto//pbrt_proto/v2:v3_proto'
    - '@pbrt_proto//pbrt_proto/v3:convert'
    - '@pbrt_proto//pbrt_proto/v3:defaults_binpb'
    - '@pbrt_proto//pbrt_proto/v3:defaults_cc_proto'
    - '@pbrt_proto//pbrt_proto/v3:defaults_proto'
    - '@pbrt_proto//pbrt_proto/v3:v3_cc_proto'
    - '@pbrt_proto//pbrt_proto/v3:v3_proto'
    - '@pbrt_proto//tools:pbrt_proto_converter'
