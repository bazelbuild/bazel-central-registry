# BCR's prepare_test_module_repo rewrites matrix.bazel to <major>.x,
# which cannot resolve Bazel 10 release candidates. Use bazel_version instead.
matrix:
  platform: [debian13, ubuntu2404]
  bazel_version: [7.x, 8.x, 9.x, 10.*]
tasks:
  verify_targets:
    name: Build public library
    platform: ${{ platform }}
    bazel: ${{ bazel_version }}
    build_flags: ["--cxxopt=-std=c++17"]
    build_targets: ["@gtk//:gtk"]
bcr_test_module:
  module_path: bazel_test
  matrix:
    platform: [debian13, ubuntu2404]
    bazel_version: [7.x, 8.x, 9.x, 10.*]
  tasks:
    run_tests:
      name: Test external consumer
      platform: ${{ platform }}
      bazel: ${{ bazel_version }}
      test_flags: ["--cxxopt=-std=c++17"]
      test_targets: ["//:all"]
