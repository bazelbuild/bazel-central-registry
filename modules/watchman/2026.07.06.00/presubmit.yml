matrix:
  platform:
    - ubuntu2404
    - ubuntu2404_arm64
    - macos_arm64
  bazel: ["8.x"]
tasks:
  verify_targets:
    name: Build Watchman
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--copt=-O2"
      - "--cxxopt=-std=gnu++20"
      - "--host_cxxopt=-std=gnu++20"
    build_targets:
      - "@watchman//:watchman"
