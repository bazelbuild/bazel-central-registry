bcr_test_module:
  module_path: "."
  matrix:
    platform: ["debian10", "macos", "ubuntu2004"]
    bazel: ["8.5.0", "9.x", "rolling"]
  tasks:
    run_tests:
      name: "Run tests"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      shell_commands:
        - "echo 'common --remote_cache=' >> .bazelrc"
        - "echo 'common --experimental_remote_downloader=' >> .bazelrc"
      test_targets:
        - "//..."

