matrix:
  platform:
    - debian13
    - ubuntu2404
  bazel:
    - 9.x
    - 8.x

tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    environment:
      CC: clang
    build_flags:
      - "--cxxopt=-std=c++20"
      - "--host_cxxopt=-std=c++20"
      - "--copt=-fno-exceptions"
      - "--host_copt=-fno-exceptions"
      - "--copt=-funsigned-char"
      - "--host_copt=-funsigned-char"
    build_targets:
      - "@gloop//..."

bcr_test_module:
  module_path: "gloop/examples"
  matrix:
    platform:
      - debian13
      - ubuntu2404
    bazel:
      - 9.x
      - 8.x
  tasks:
    verify_examples:
      name: Verify Examples
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      environment:
        CC: clang
      build_flags:
        - "--cxxopt=-std=c++20"
        - "--host_cxxopt=-std=c++20"
        - "--copt=-fno-exceptions"
        - "--host_copt=-fno-exceptions"
        - "--copt=-funsigned-char"
        - "--host_copt=-funsigned-char"
      build_targets:
        - "//..."
      test_targets:
        - "//..."

