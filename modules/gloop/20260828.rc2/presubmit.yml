matrix:
  platform:
    - debian13
    - ubuntu2404
  bazel:
    - 9.x
    - 8.x

tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    environment:
      CC: "$HOME/clang-21/bin/clang"
      CXX: "$HOME/clang-21/bin/clang++"
      PATH: "$HOME/clang-21/bin:$PATH"
    shell_commands:
      - "mkdir -p $HOME/clang-21"
      - "curl -L https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.0/LLVM-21.1.0-Linux-X64.tar.xz | tar -xJ --strip-components=1 -C $HOME/clang-21"
      - "sudo cp -P $HOME/clang-21/lib/x86_64-unknown-linux-gnu/*.so* /usr/lib/x86_64-linux-gnu/"
      - "sudo ldconfig"
    build_flags:
      - "--cxxopt=-std=c++20"
      - "--host_cxxopt=-std=c++20"
      - "--copt=-fno-exceptions"
      - "--host_copt=-fno-exceptions"
      - "--copt=-funsigned-char"
      - "--host_copt=-funsigned-char"
      - "--cxxopt=-stdlib=libc++"
      - "--linkopt=-stdlib=libc++"
    build_targets:
      - "@gloop//gloop/concurrent/rcu:view"
      - "@gloop//gloop/thread"
      - "@gloop//gloop/thread/fiber"
      - "@gloop//gloop/util/status"
      - "@gloop//gloop/util/task"
      - "@gloop//gloop/util/hash"
      - "@gloop//gloop/util/symbolize"

bcr_test_module:
  module_path: "gloop/examples"
  matrix:
    platform:
      - debian13
      - ubuntu2404
    bazel:
      - 9.x
      - 8.x
  tasks:
    verify_examples:
      name: Verify Examples
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      environment:
        CC: "$HOME/clang-21/bin/clang"
        CXX: "$HOME/clang-21/bin/clang++"
        PATH: "$HOME/clang-21/bin:$PATH"
      shell_commands:
        - "mkdir -p $HOME/clang-21"
        - "curl -L https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.0/LLVM-21.1.0-Linux-X64.tar.xz | tar -xJ --strip-components=1 -C $HOME/clang-21"
        - "sudo cp -P $HOME/clang-21/lib/x86_64-unknown-linux-gnu/*.so* /usr/lib/x86_64-linux-gnu/"
        - "sudo ldconfig"
        - "sudo ln -sf $HOME/clang-21/bin/clang /usr/bin/clang"
        - "sudo ln -sf $HOME/clang-21/bin/clang++ /usr/bin/clang++"
      build_flags:
        - "--cxxopt=-std=c++20"
        - "--host_cxxopt=-std=c++20"
        - "--copt=-fno-exceptions"
        - "--host_copt=-fno-exceptions"
        - "--copt=-funsigned-char"
        - "--host_copt=-funsigned-char"
        - "--cxxopt=-stdlib=libc++"
        - "--linkopt=-stdlib=libc++"
        - "--host_cxxopt=-stdlib=libc++"
        - "--host_linkopt=-stdlib=libc++"
      test_flags:
        - "--cxxopt=-std=c++20"
        - "--host_cxxopt=-std=c++20"
        - "--copt=-fno-exceptions"
        - "--host_copt=-fno-exceptions"
        - "--copt=-funsigned-char"
        - "--host_copt=-funsigned-char"
        - "--cxxopt=-stdlib=libc++"
        - "--linkopt=-stdlib=libc++"
        - "--host_cxxopt=-stdlib=libc++"
        - "--host_linkopt=-stdlib=libc++"
      build_targets:
        - "//..."
      test_targets:
        - "//..."
