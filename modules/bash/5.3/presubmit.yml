matrix:
  platform:
    - debian13
    - debian13_arm64
    - macos
    - macos_arm64
    - ubuntu2204
    - ubuntu2204_arm64
  bazel: ["7.x", "8.x", "9.x"]
tasks:
  verify_targets:
    name: "Default build + test"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - "@bash//..."
    test_targets:
    - "@bash//..."

  # Flag coverage.  Build only: without readline the complete, compgen and bind builtins and the
  # readline shopt options do not exist, which seven of upstream's drivers assert on.
  readline_off:
    name: "Build with //:readline_option=false"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@bash//:readline_option=false"
    build_targets:
    - "@bash//:bash"

# No Windows: bash is POSIX throughout (fork, job control over waitpid and
# tcsetpgrp, /dev/fd redirections, unistd.h/pwd.h/termios.h unconditionally)
# and upstream builds it on Windows only under Cygwin or MSYS2, a POSIX layer
# the registry's MSVC and clang-cl lane does not provide.
