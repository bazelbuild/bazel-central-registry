matrix:
  platform:
    - debian11
    - ubuntu2004
    - ubuntu2004_arm64
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
  bazel: [7.*, 8.*, 9.*, 10.*]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@bash//:bash"
bcr_test_module:
  module_path: test
  matrix:
    linux_platform:
      - debian11
      - ubuntu2004_arm64
      - ubuntu2404
    macos_platform:
      - macos
      - macos_arm64
    bazel: [8.*, 9.*, 10.*]
    linux_cross_target:
      - linux_aarch64
      - linux_x86_64
      - windows_x86_64
    macos_cross_target:
      - linux_aarch64
      - linux_x86_64
      - macos_aarch64
      - macos_x86_64
      - windows_x86_64
  tasks:
    test_on_linux:
      name: Test on Linux with hermetic LLVM
      platform: ${{ linux_platform }}
      bazel: ${{ bazel }}
      test_flags:
        - "--experimental_remote_downloader="
      test_targets:
        - "//..."
    test_on_macos:
      name: Test on macOS with hermetic LLVM
      platform: ${{ macos_platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
    cross_compile_on_linux:
      name: Cross-compile on Linux with hermetic LLVM
      platform: ubuntu2404
      bazel: ${{ bazel }}
      build_flags:
        - "--experimental_remote_downloader="
        - "--platforms=@llvm//platforms:${{ linux_cross_target }}"
      build_targets:
        - "//..."
    cross_compile_on_macos:
      name: Cross-compile on macOS with hermetic LLVM
      platform: macos_arm64
      bazel: ${{ bazel }}
      build_flags:
        - "--platforms=@llvm//platforms:${{ macos_cross_target }}"
      build_targets:
        - "//..."
