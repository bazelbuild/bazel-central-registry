matrix:
  bazel:
    - 8.x
    - 9.x
  platform:
    - debian11
    - ubuntu2204
    - macos_arm64
tasks:
  verify_targets:
    name: Verify build targets
    bazel: ${{ bazel }}
    platform: ${{ platform }}
    build_targets:
      - "@rules_pycross_backend_maturin//rules/..."
      - "@rules_pycross_backend_maturin//private/..."
      - "@rules_pycross_backend_maturin//extensions/..."
