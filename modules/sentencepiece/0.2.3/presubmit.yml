matrix:
  unix_platform:
  - debian11
  - ubuntu2404
  - ubuntu2404_arm64
  - macos
  - macos_arm64
  windows_platform:
  - windows
  bazel:
  - 8.x
  - 9.x
tasks:
  verify_targets_unix:
    name: Verify build targets (Unix)
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    environment:
      ANDROID_HOME: ""
      ANDROID_NDK_HOME: ""
    build_flags:
    - '--cxxopt=-std=c++20'
    - '--host_cxxopt=-std=c++20'
    build_targets:
    - '@sentencepiece//:sentencepiece'
    - '@sentencepiece//:sentencepiece_train'
    - '@sentencepiece//:sentencepiece_lite'
    - '@sentencepiece//:sentencepiece_lite_standalone'
    - '@sentencepiece//:cached_sentencepiece_lite'
    - '@sentencepiece//:sentencepiece_model_converters'
    - '@sentencepiece//:spm_decode'
    - '@sentencepiece//:spm_encode'
    - '@sentencepiece//:spm_export_vocab'
    - '@sentencepiece//:spm_normalize'
    - '@sentencepiece//:spm_train'
    - '@sentencepiece//:spm_lite'
    - '@sentencepiece//:spm_to_fb'
  verify_targets_windows:
    name: Verify build targets (Windows)
    platform: ${{ windows_platform }}
    bazel: ${{ bazel }}
    environment:
      ANDROID_HOME: ""
      ANDROID_NDK_HOME: ""
    build_flags:
    - '--cxxopt=/std:c++20'
    - '--host_cxxopt=/std:c++20'
    - '--cxxopt=/utf-8'
    - '--host_cxxopt=/utf-8'
    build_targets:
    - '@sentencepiece//:sentencepiece'
    - '@sentencepiece//:sentencepiece_train'
    - '@sentencepiece//:sentencepiece_lite'
    - '@sentencepiece//:sentencepiece_lite_standalone'
    - '@sentencepiece//:cached_sentencepiece_lite'
    - '@sentencepiece//:sentencepiece_model_converters'
    - '@sentencepiece//:spm_decode'
    - '@sentencepiece//:spm_encode'
    - '@sentencepiece//:spm_export_vocab'
    - '@sentencepiece//:spm_normalize'
    - '@sentencepiece//:spm_train'
    - '@sentencepiece//:spm_lite'
    - '@sentencepiece//:spm_to_fb'
bcr_test_module:
  module_path: bcr_tests
  matrix:
    unix_platform:
    - debian11
    - ubuntu2404
    - ubuntu2404_arm64
    - macos
    - macos_arm64
    windows_platform:
    - windows
    bazel:
    - 8.x
    - 9.x
  tasks:
    run_test_module_unix:
      name: Run test module (Unix)
      platform: ${{ unix_platform }}
      bazel: ${{ bazel }}
      environment:
        ANDROID_HOME: ""
        ANDROID_NDK_HOME: ""
      build_flags:
      - '--cxxopt=-std=c++20'
      - '--host_cxxopt=-std=c++20'
      test_targets:
      - '//...'
    run_test_module_windows:
      name: Run test module (Windows)
      platform: ${{ windows_platform }}
      bazel: ${{ bazel }}
      environment:
        ANDROID_HOME: ""
        ANDROID_NDK_HOME: ""
      build_flags:
      - '--cxxopt=/std:c++20'
      - '--host_cxxopt=/std:c++20'
      - '--cxxopt=/utf-8'
      - '--host_cxxopt=/utf-8'
      test_targets:
      - '//...'
