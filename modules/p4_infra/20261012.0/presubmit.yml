matrix:
  platform:
  - ubuntu2204
  - ubuntu2404
  bazel:
  - 7.x
  - 8.x
  - 9.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      # p4-infra requires C++20. The .bazelrc in the source tree sets these
      # flags, but BCR presubmit builds don't load it.
      - '--cxxopt=-std=c++20'
      - '--host_cxxopt=-std=c++20'
      # Mirrors the `.bazelrc` in the source tree, which disables Bazel's
      # strict include layering check.
      - '--features=-layering_check'
      - '--host_features=-layering_check'
      # In Bazel 9, native C++ rules are no longer autoloaded by default.
      # Some gRPC bundled sources still use `native.cc_library` and
      # `native.cc_binary`. No-op on Bazel 7.
      - '--incompatible_autoload_externally=+cc_library,+cc_binary'
    build_targets:
      - '@p4_infra//...'
