matrix:
  platform: [ubuntu2404, ubuntu2204_arm64]
  bazel: [8.x, 9.x]
tasks:
  verify_targets:
    name: Build nginx and its loadable modules
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@nginx//:nginx'
      - '@nginx//:dynamic_modules'
      - '@nginx//:perl_runtime'

bcr_test_module:
  module_path: .
  matrix:
    bazel: [8.x, 9.x]
  tasks:
    upstream_tests:
      name: Run nginx-tests with LLVM
      platform: ubuntu2404
      bazel: ${{ bazel }}
      test_flags:
        - '--extra_execution_platforms=@llvm//platforms:linux_x86_64'
        - '--platforms=@llvm//platforms:linux_x86_64'
      test_targets:
        - //tests:upstream
