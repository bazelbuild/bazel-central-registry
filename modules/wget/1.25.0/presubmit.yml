matrix:
  # No Windows: upstream builds there only under mingw, and gnulib's mingw
  # branches do not compile with the MSVC-based toolchains presubmit provides
  # (see the platform note in overlay/BUILD.bazel).
  platform:
    - debian11
    - ubuntu2004
    - ubuntu2004_arm64
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
  bazel: ["7.x", "8.x", "9.x"]
tasks:
  verify_targets:
    name: Verify build targets (defaults)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@wget//..."
    test_targets:
      - "@wget//..."
  verify_no_tls:
    name: Verify build targets (--ssl=no)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--@wget//:ssl=no"
    test_flags:
      - "--@wget//:ssl=no"
    build_targets:
      - "@wget//..."
    test_targets:
      - "@wget//..."
  verify_cares:
    name: Verify build targets (--cares)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--@wget//:cares=True"
    test_flags:
      - "--@wget//:cares=True"
    build_targets:
      - "@wget//..."
    test_targets:
      - "@wget//..."
  verify_minimal:
    name: Verify build targets (every optional feature off, assertions on)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--@wget//:assert=True"
      - "--@wget//:debug=False"
      - "--@wget//:digest=False"
      - "--@wget//:ipv6=False"
      - "--@wget//:libuuid=False"
      - "--@wget//:ntlm=False"
      - "--@wget//:opie=False"
      - "--@wget//:pcre2=False"
      - "--@wget//:xattr=False"
      - "--@wget//:zlib=False"
    test_flags:
      - "--@wget//:assert=True"
      - "--@wget//:debug=False"
      - "--@wget//:digest=False"
      - "--@wget//:ipv6=False"
      - "--@wget//:libuuid=False"
      - "--@wget//:ntlm=False"
      - "--@wget//:opie=False"
      - "--@wget//:pcre2=False"
      - "--@wget//:xattr=False"
      - "--@wget//:zlib=False"
    build_targets:
      - "@wget//..."
    test_targets:
      - "@wget//..."
# Upstream's Python test suite lives in a module of its own under testenv/, so
# that the Python toolchain it needs is not a dependency of @wget itself.  It
# is exercised in the same configurations as the module.
bcr_test_module:
  module_path: testenv
  matrix:
    platform:
      - debian11
      - ubuntu2004
      - ubuntu2004_arm64
      - ubuntu2204
      - ubuntu2404
      - macos
      - macos_arm64
    bazel: ["7.x", "8.x", "9.x"]
  tasks:
    run_test_module:
      name: Run test module (defaults)
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - "@wget//..."
        - "//..."
      test_targets:
        - "@wget//..."
        - "//..."
    run_test_module_no_tls:
      name: Run test module (--ssl=no)
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_flags:
        - "--@wget//:ssl=no"
      test_flags:
        - "--@wget//:ssl=no"
      build_targets:
        - "@wget//..."
        - "//..."
      test_targets:
        - "@wget//..."
        - "//..."
    run_test_module_minimal:
      name: Run test module (every optional feature off, assertions on)
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_flags:
        - "--@wget//:assert=True"
        - "--@wget//:debug=False"
        - "--@wget//:digest=False"
        - "--@wget//:ipv6=False"
        - "--@wget//:libuuid=False"
        - "--@wget//:ntlm=False"
        - "--@wget//:opie=False"
        - "--@wget//:pcre2=False"
        - "--@wget//:xattr=False"
        - "--@wget//:zlib=False"
      test_flags:
        - "--@wget//:assert=True"
        - "--@wget//:debug=False"
        - "--@wget//:digest=False"
        - "--@wget//:ipv6=False"
        - "--@wget//:libuuid=False"
        - "--@wget//:ntlm=False"
        - "--@wget//:opie=False"
        - "--@wget//:pcre2=False"
        - "--@wget//:xattr=False"
        - "--@wget//:zlib=False"
      build_targets:
        - "@wget//..."
        - "//..."
      test_targets:
        - "@wget//..."
        - "//..."
