matrix:
  platform:
    - debian10
    - macos_arm64
    - ubuntu2204
    - ubuntu2204_arm64
    - windows
  bazel: ["7.x", "8.x", "9.x"]
tasks:
  verify_targets:
    name: "Run test module"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - "@grep//..."
    test_targets:
    - "@grep//..."

  no_perl_regexp:
    name: "Build with --disable-perl-regexp (no PCRE2)"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@grep//:perl_regexp=false"
    build_targets:
    - "@grep//..."
    test_flags:
    - "--@grep//:perl_regexp=false"
    test_targets:
    - "@grep//..."
