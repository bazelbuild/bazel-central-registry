matrix:
  bazel: [8.x, 9.x]
tasks:
  linux:
    name: Build libslirp and check the linked version
    platform: ubuntu2404
    bazel: ${{ bazel }}
    build_targets: ['@libslirp//:libslirp']
    test_targets: ['@libslirp//:version_test']

bcr_test_module:
  module_path: bazel/presubmit
  tasks:
    windows:
      name: Build libslirp with the Windows x86_64 Zig MinGW toolchain
      platform: windows
      bazel: 9.x
      build_flags:
      - --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1
      - --incompatible_strict_action_env
      - --action_env=PATH=
      - --host_action_env=PATH=
      build_targets: ['@libslirp//:libslirp']
