bcr_test_module:
  module_path: "integration"
  matrix:
    # rain publishes binaries for Linux x86_64 and macOS only. The macOS
    # binary is x86_64, and runs under Rosetta 2 on macos_arm64.
    platform: ["debian11", "ubuntu2204", "ubuntu2404", "macos", "macos_arm64"]
    bazel: [8.x, 9.x]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      # These targets are filegroups, not tests, so `bazel test` would fail.
      # Building them fetches both torrent repositories.
      build_targets:
        - "@test_repo//:file"
        - "@test_repo_archive//:file"
