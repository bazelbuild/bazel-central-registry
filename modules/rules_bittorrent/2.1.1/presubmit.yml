bcr_test_module:
  module_path: "integration"
  matrix:
    # rain publishes binaries for Linux x86_64 and macOS x86_64 only. On an
    # arm64 Mac the x86_64 binary needs Rosetta 2, and the BCR macos_arm64
    # runner does not have it: rain fails there with "Bad CPU type in
    # executable" (filmil/bazel_rules_bt#43). macos_arm64 returns to this list
    # when rain ships an arm64 macOS build.
    platform: ["debian11", "ubuntu2204", "ubuntu2404", "macos"]
    bazel: [8.x, 9.x]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      # These targets are filegroups, not tests, so `bazel test` would fail.
      # Building them fetches both torrent repositories.
      build_targets:
        - "@test_repo//:file"
        - "@test_repo_archive//:file"
