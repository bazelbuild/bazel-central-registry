matrix:
  platform:
  - debian11
  - ubuntu2204
  - ubuntu2204_arm64
  - ubuntu2404
  - macos
  - macos_arm64
  # grub-mount needs fuse3, a Linux library, which is also where upstream's
  # probe finds it.
  linux_platform:
  - debian11
  - ubuntu2204
  - ubuntu2204_arm64
  - ubuntu2404
  # The boot-image compile targets are built for the lane's own CPU: every
  # x86 platform on the x86 Linux lanes (i386 needs only the compiler's
  # -m32, no 32-bit libraries), arm64-efi on the arm64 lane.
  linux_x86_platform:
  - debian11
  - ubuntu2204
  - ubuntu2404
  bazel: [7.x, 8.x, 9.x]
tasks:
  verify_targets:
    name: Verify build targets (defaults)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@grub//...'
    test_targets:
    - '@grub//...'
  verify_debug_options:
    name: Verify build targets (--enable-mm-debug --enable-cache-stats --enable-boot-time)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--@grub//:mm_debug=True'
    - '--@grub//:cache_stats=True'
    - '--@grub//:boot_time=True'
    test_flags:
    - '--@grub//:mm_debug=True'
    - '--@grub//:cache_stats=True'
    - '--@grub//:boot_time=True'
    build_targets:
    - '@grub//...'
    test_targets:
    - '@grub//...'
  verify_optional_programs:
    name: Verify build targets (--enable-grub-mkfont --enable-grub-mount)
    platform: ${{ linux_platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--@grub//:grub_mkfont=True'
    - '--@grub//:grub_mount=True'
    test_flags:
    - '--@grub//:grub_mkfont=True'
    - '--@grub//:grub_mount=True'
    build_targets:
    - '@grub//...'
    test_targets:
    - '@grub//...'
  verify_grub_mkfont:
    name: Verify build targets (--enable-grub-mkfont)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--@grub//:grub_mkfont=True'
    test_flags:
    - '--@grub//:grub_mkfont=True'
    build_targets:
    - '@grub//...'
    test_targets:
    - '@grub//...'
  verify_platform_objects_x86:
    name: Compile the x86 firmware platforms' kernels, modules and images
    platform: ${{ linux_x86_platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@grub//platform:i386_pc_objects'
    - '@grub//platform:i386_efi_objects'
    - '@grub//platform:i386_qemu_objects'
    - '@grub//platform:i386_coreboot_objects'
    - '@grub//platform:i386_multiboot_objects'
    - '@grub//platform:i386_ieee1275_objects'
    - '@grub//platform:i386_xen_objects'
    - '@grub//platform:i386_xen_pvh_objects'
    - '@grub//platform:x86_64_efi_objects'
    - '@grub//platform:x86_64_xen_objects'
  verify_platform_objects_arm64:
    name: Compile the arm64-efi kernel and modules
    platform: ubuntu2204_arm64
    bazel: ${{ bazel }}
    build_targets:
    - '@grub//platform:arm64_efi_objects'
