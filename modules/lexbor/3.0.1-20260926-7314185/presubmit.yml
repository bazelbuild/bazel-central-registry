matrix:
  unix_platform:
    - debian11
    - ubuntu2004
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
  bazel: [7.x, 8.x, rolling]
tasks:
  verify_targets_unix:
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@lexbor//:lexbor"
    test_targets:
      - "@lexbor//:all"
  # TODO: tests don't pass out of the box on Windows.
  verify_targets_windows:
    platform: windows
    bazel: ${{ bazel }}
    build_targets:
      - "@lexbor//:lexbor"
  verify_tokenizer_asan:
    platform: ubuntu2404
    bazel: ${{ bazel }}
    test_flags:
      - "--copt=-fsanitize=address"
      - "--linkopt=-fsanitize=address"
    test_targets:
      - "@lexbor//:lexbor_html_tokenizer_named_character_reference_test"
