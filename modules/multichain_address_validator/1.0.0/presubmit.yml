matrix:
  platform:
    - debian11
    - ubuntu2004
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
    - windows
  bazel: [7.x, 8.x, rolling]
tasks:
  verify_targets:
    name: Verify build and test targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@multichain_address_validator//:multichain_address_validator'
    test_targets:
      - '@multichain_address_validator//:address_validator_test'
