matrix:
  platform: [debian13, ubuntu2404]
  bazel: [7.x, 8.x, 9.x]
tasks:
  verify_targets:
    name: Build public targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets: ["@libdatrie//:datrie", "@libdatrie//:libdatrie", "@libdatrie//:trietool"]
bcr_test_module:
  module_path: bazel_test
  matrix:
    platform: [debian13, ubuntu2404]
    bazel: [7.x, 8.x, 9.x]
  tasks:
    run_tests:
      name: Test public APIs and runfiles
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets: ["//:all"]
