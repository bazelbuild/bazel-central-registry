bcr_test_module:
  module_path: "e2e/smoke"
  matrix:
    platform: ["macos", "ubuntu2204"]
    bazel: ["8.x", "9.x"]
  tasks:
    run_test_module:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      # Generate BUILD files with the published @aspect_gazelle_orion and a
      # tree-sitter query plugin, then assert the generated target exists.
      shell_commands:
        - "bazel run //:gazelle"
      build_targets:
        - "//..."
      test_targets:
        - "//..."
