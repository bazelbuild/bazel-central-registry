# The registry builds e2e/smoke, a consumer that exports a pack with the prebuilt engine.
# rules_godot requires Bazel 9 (bazel_compatibility in MODULE.bazel). Windows is not a
# supported host.
bcr_test_module:
  module_path: "e2e/smoke"
  matrix:
    platform: ["debian13", "ubuntu2204", "macos", "macos_arm64"]
    bazel: ["9.*"]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
