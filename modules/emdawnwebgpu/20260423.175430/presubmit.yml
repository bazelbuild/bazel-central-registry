matrix:
  platform:
    - ubuntu2404
    - macos_arm64
    - windows
  bazel:
    - 8.x
    - 9.x
    - rolling
tasks:
  verify_targets:
    name: Verify public targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@emdawnwebgpu//:webgpu_headers'
      - '@emdawnwebgpu//:webgpu_cpp'
      - '@emdawnwebgpu//:js_libraries'
      - '@emdawnwebgpu//:closure_externs'
      - '@emdawnwebgpu//:package_metadata'
      - '@emdawnwebgpu//:package_metadata_emscripten'

bcr_test_module:
  module_path: tests
  matrix:
    platform:
      - ubuntu2404
      - macos_arm64
      - windows
    bazel:
      - 8.x
      - 9.x
      - rolling
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - //...
      test_targets:
        - //...
