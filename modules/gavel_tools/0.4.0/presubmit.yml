matrix:
  platform: ["ubuntu2004"]
  bazel: ["7.x", "8.x", "9.x"]
tasks:
  verify:
    name: "Build and test gavel_tools"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    # The release archive builds gavel-lint nowhere: the Go dependencies of its
    # sources are dev-only, so `@gavel_tools//...` would not load. Build what a
    # consumer loads; the Go sources are built and tested by this repo's own CI.
    build_targets:
      - "@gavel_tools//lint/toolchain:toolchain_type"
      - "@gavel_tools//lint/aspects:defs.bzl"
