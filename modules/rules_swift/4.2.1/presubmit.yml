bcr_test_module:
  module_path: .
  matrix:
    bazel:
    - 8.x
    - 9.x
    - rolling
  tasks:
    verify_targets:
      name: Verify build targets
      bazel: ${{ bazel }}
      platform: ubuntu2204
      build_flags:
      - "--incompatible_enable_proto_toolchain_resolution"
      build_targets:
      - "//examples/xplatform/..."
      - "-//examples/xplatform/grpc/..." # TODO: Fix grpc on Linux
      - "-//examples/xplatform/proto_library_group/..." # TODO: Fix grpc on Linux
    verify_targets_macos:
      name: Verify build targets
      bazel: ${{ bazel }}
      platform: macos_arm64
      xcode_version: "26.2"
      build_targets:
      - "//examples/apple/..."
