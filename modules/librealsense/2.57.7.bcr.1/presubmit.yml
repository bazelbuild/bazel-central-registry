matrix:
  platform:
  - debian13
  - ubuntu2404
  - macos
  - macos_arm64
  bazel:
  - 9.x
  - 8.x
  - 7.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@librealsense//:gen_dir'
    - '@librealsense//:librealsense'
  verify_targets_rsusb:
    name: Verify build targets with RSUSB backend
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--@librealsense//:force_rsusb_backend=true'
    build_targets:
    - '@librealsense//:librealsense'
