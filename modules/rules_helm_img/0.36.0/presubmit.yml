---
bcr_test_module:
  # Relative to the module root after `strip_prefix`, so the module is
  # its own test module.
  module_path: "."
  matrix:
    # rules_img has not been exercised on windows. See `tests/BUILD.bazel`.
    platform: ["macos_arm64", "ubuntu2004"]
    bazel: ["7.x", "8.x"]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "--"
        - "//..."
