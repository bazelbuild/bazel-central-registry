matrix:
  platform:
    - ubuntu2404
    - ubuntu2404_arm64
    - macos
    - macos_arm64
  bazel:
    - 7.x
    - 8.x
    - 9.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    # dnn pulls in protobuf, whose abseil-cpp dependency requires C++17; Bazel's
    # default toolchain (notably on 7.x) otherwise compiles host tools as C++14.
    build_flags:
      - "--host_cxxopt=-std=c++17"
      - "--cxxopt=-std=c++17"
    build_targets:
      - '@opencv_contrib//...'
  verify_targets_nonfree:
    name: Verify build targets with nonfree modules enabled
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
      - "--@opencv_contrib//:enable_nonfree=true"
      - "--host_cxxopt=-std=c++17"
      - "--cxxopt=-std=c++17"
    build_targets:
      - '@opencv_contrib//...'
