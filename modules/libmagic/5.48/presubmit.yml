matrix:
  # No windows platform. Upstream supports Windows only through MinGW; the default Windows toolchain is MSVC,
  platform:
    - debian13
    - macos
    - macos_arm64
    - ubuntu2404
    - ubuntu2404_arm64
  bazel:
    - rolling
    - 9.x
    - 8.x
    - 7.x
    # The floor 7.x floats past: rules_cc_autoconf needs attr.string_keyed_label_dict (7.4.0).
    - 7.4.0
tasks:
  verify_targets:
    name: Build and test
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - '@libmagic'
      - '@libmagic//:lib'
      - '@libmagic//:magic_shared'
      - '@libmagic//:file'
      - '@libmagic//:magic.mgc'
    test_targets:
      - '@libmagic//tests/...'
bcr_test_module:
  module_path: test
  matrix:
    platform:
      - debian13
      - macos
      - macos_arm64
      - ubuntu2404
      - ubuntu2404_arm64
    bazel:
      - rolling
      - 9.x
      - 8.x
      - 7.x
      - 7.4.0
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - '//...'
    run_test_module_all_codecs:
      name: Run test module with every codec flag true
      platform: ubuntu2404
      bazel: 9.x
      build_flags: &all_codecs
        - '--@libmagic//:with_bzip2=true'
        - '--@libmagic//:with_xz=true'
        - '--@libmagic//:with_zlib=true'
        - '--@libmagic//:with_zstd=true'
      test_flags: *all_codecs
      build_targets:
        - '@libmagic//:file'
        - '@libmagic//:magic.mgc'
      test_targets:
        - '//...'
