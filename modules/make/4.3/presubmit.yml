matrix:
  platform:
    - debian10
    - macos_arm64
    - ubuntu2004
    - ubuntu2004_arm64
    - windows
  bazel: ["7.x", "8.x", "9.x"]
tasks:
  verify_targets:
    name: "Run test module"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - "@make//..."
    test_targets:
    - "@make//..."

  no_load:
    name: "Build with MAKE_LOAD disabled"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@make//:load=false"
    build_targets:
    - "@make//..."
    test_targets:
    - "@make//..."

  no_jobserver:
    name: "Build with MAKE_JOBSERVER disabled"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@make//:jobserver=false"
    build_targets:
    - "@make//..."
    test_targets:
    - "@make//..."

  no_posix_spawn:
    name: "Build with USE_POSIX_SPAWN disabled (fork/exec fallback)"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@make//:posix_spawn=false"
    build_targets:
    - "@make//..."
    test_targets:
    - "@make//..."
