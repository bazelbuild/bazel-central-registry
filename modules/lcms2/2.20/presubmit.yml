matrix:
  platform:
    - debian13
    - macos
    - macos_arm64
    - ubuntu2404
    - ubuntu2404_arm64
    - windows
  bazel:
    - rolling
    - 9.x
    - 8.x
    - 7.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@lcms2//:lcms2"
      - "@lcms2//testbed:testcms"
  run_tests:
    name: Run test targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    test_targets:
      - "@lcms2//testbed:testcms"
bcr_test_module:
  module_path: test
  matrix:
    platform:
      - debian13
      - macos
      - macos_arm64
      - ubuntu2404
      - ubuntu2404_arm64
      - windows
    bazel:
      - rolling
      - 9.x
      - 8.x
      - 7.x
  tasks:
    run_tests:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
