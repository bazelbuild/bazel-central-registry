# The integration module is an outside consumer: it links the packages next
# to its own files and checks that they are there. Compiling a document needs
# a LaTeX toolchain, which is not in the Bazel Central Registry; the source
# repository's CI does that (integration/latex).
bcr_test_module:
  module_path: "integration"
  matrix:
    platform: ["debian11", "ubuntu2204", "ubuntu2404", "macos", "macos_arm64"]
    bazel: [8.x, 9.x]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
