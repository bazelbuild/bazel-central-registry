matrix:
  platform:
    - debian11
    - ubuntu2204_arm64
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
    - windows
  bazel: [8.x, 9.x, rolling]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@suitesparse//:amd"
      - "@suitesparse//:btf"
      - "@suitesparse//:camd"
      - "@suitesparse//:ccolamd"
      - "@suitesparse//:cholmod"
      - "@suitesparse//:colamd"
      - "@suitesparse//:config"
      - "@suitesparse//:cxsparse"
      - "@suitesparse//:klu"
      - "@suitesparse//:ldl"
      - "@suitesparse//:prefixed_headers"
      - "@suitesparse//:source_files"
      - "@suitesparse//:suitesparse"
    test_targets:
      - "@suitesparse//:amd_demo_test"
      - "@suitesparse//:amd_demo2_test"
      - "@suitesparse//:amd_l_demo_test"
      - "@suitesparse//:amd_simple_test"
      - "@suitesparse//:camd_demo_test"
      - "@suitesparse//:camd_demo2_test"
      - "@suitesparse//:camd_l_demo_test"
      - "@suitesparse//:camd_simple_test"
      - "@suitesparse//:ccolamd_example_test"
      - "@suitesparse//:ccolamd_l_example_test"
      - "@suitesparse//:colamd_example_test"
      - "@suitesparse//:colamd_l_example_test"
      - "@suitesparse//:klu_simple_test"
      - "@suitesparse//:ldllsimple_test"
      - "@suitesparse//:ldlsimple_test"
